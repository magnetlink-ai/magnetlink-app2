          {/* ── Ads Manager sub-tab ── */}
          {subTab==='ads' && (
            <AdsManagerSubTab projId={projId} adsData={adsData} project={project} client={client} showToast={showToast}/>
          )}

          {/* Modals */}
          {modal==='new_post'  && <PostModal projectId={projId} onSave={p=>{onSavePost(p);showToast(t('soc_post_added'));}} onClose={()=>setModal(null)}/>}
          {modal==='edit_post' && editPost && <PostModal post={editPost} projectId={projId} onSave={p=>{onSavePost(p);showToast(t('soc_post_saved'));}} onClose={()=>{setModal(null);setEditPost(null);}}/>}
          {modal==='messages'  && <MessagesModal messages={smMessages} projectId={projId} onRead={onReadMessage} onClose={()=>setModal(null)}/>}
          {modal==='accounts'  && <AccountsModal account={account} projectId={projId} onSave={acc=>{onSaveAccount(acc);showToast(t('soc_acc_saved'));}} onClose={()=>setModal(null)}/>}
          {modal==='calendar'  && <CalendarModal posts={posts} projectId={projId} onClose={()=>setModal(null)} onEdit={p=>{setEditPost(p);setModal('edit_post');}} onDelete={handleDelete}/>}
        </div>
      );
    };

    /* ═══════════════════════════ TASKS MODULE ═══════════════════════════ */

    const TASK_PRIORITIES = [
      { id:'urgent',    label:'Urgent',    tKey:'tsk_p_urgent',    icon:'flame',   borderL:'border-l-red-500',    dot:'bg-red-500',    text:'text-red-400',    bg:'bg-red-500/10'    },
      { id:'important', label:'Important', tKey:'tsk_p_important', icon:'alert_t', borderL:'border-l-orange-500', dot:'bg-orange-500', text:'text-orange-400', bg:'bg-orange-500/10' },
      { id:'medium',    label:'Medium',    tKey:'tsk_p_medium',    icon:'equal',   borderL:'border-l-green-500',  dot:'bg-green-500',  text:'text-green-400',  bg:'bg-green-500/10'  },
      { id:'low',       label:'Low',       tKey:'tsk_p_low',       icon:'arr_dn',  borderL:'border-l-blue-500',   dot:'bg-blue-500',   text:'text-blue-400',   bg:'bg-blue-500/10'   },
    ];

    const TASK_STATUSES = [
      { id:'not_start',   label:'Not Started',  tKey:'tsk_s_not_start',   icon:'circle_o', dot:'bg-gray-400',  text:'text-slate-400' },
      { id:'in_progress', label:'In Progress',  tKey:'tsk_s_in_progress', icon:'clock2',   dot:'bg-blue-500',  text:'text-blue-400'  },
      { id:'completed',   label:'Completed',    tKey:'tsk_s_completed',   icon:'chk_c',    dot:'bg-green-500', text:'text-green-400' },
    ];

    const TASK_REPEATS = [
      { id:'none',     label:'None',     tKey:'tsk_repeat_none'     },
      { id:'daily',    label:'Daily',    tKey:'tsk_repeat_daily'    },
      { id:'weekdays', label:'Weekdays', tKey:'tsk_repeat_weekdays' },
      { id:'weekly',   label:'Weekly',   tKey:'tsk_repeat_weekly'   },
      { id:'monthly',  label:'Monthly',  tKey:'tsk_repeat_monthly'  },
      { id:'yearly',   label:'Yearly',   tKey:'tsk_repeat_yearly'   },
    ];

    const DEPT_PALETTE = [
      { bg:'bg-blue-900/30 border-blue-700/40', color:'text-blue-400' },
      { bg:'bg-rose-900/30 border-rose-700/40',     color:'text-rose-400'   },
      { bg:'bg-cyan-900/30 border-cyan-700/40',     color:'text-cyan-400'   },
      { bg:'bg-amber-900/30 border-amber-700/40',   color:'text-amber-400'  },
      { bg:'bg-emerald-900/30 border-emerald-700/40', color:'text-emerald-400' },
      { bg:'bg-blue-900/30 border-blue-700/40',     color:'text-blue-400'   },
      { bg:'bg-pink-900/30 border-pink-700/40',     color:'text-pink-400'   },
      { bg:'bg-teal-900/30 border-teal-700/40',     color:'text-teal-400'   },
    ];
    const DEPT_ICONS = { 'Design':'layers2', 'Social Media':'network', 'Social':'network', 'Website':'web', 'Web':'web', 'CRM':'crm', 'Finance':'finance' };
    const getDeptMeta = (dept, idx) => ({ ...DEPT_PALETTE[idx % DEPT_PALETTE.length], icon: DEPT_ICONS[dept.name] || 'tasks' });

    /* ── TaskOverlay ── */
    const TaskOverlay = ({ task, bucketId, deptId, projectId, buckets, teamMembers, onSave, onMarkComplete, onDelete, onClose }) => {
      const blank = {
        id: 'tsk_' + Date.now(), bucket_id: bucketId, department_id: deptId, project_id: projectId,
        title: '', status: 'not_start', priority: 'medium', assignees: [],
        start_date: '', due_date: '', repeat: 'none', parent_task_id: null,
        checklist: [], show_checklist_in_board: false, notes: '',
        created_at: new Date().toISOString().split('T')[0],
      };
      const [form, setForm] = useState(task ? { ...task } : blank);
      const [newItem, setNewItem] = useState('');

      const set = (k, v) => setForm(p => ({ ...p, [k]: v }));
      const toggleAssignee = id => set('assignees', form.assignees.includes(id)
        ? form.assignees.filter(x => x !== id) : [...form.assignees, id]);
      const addCheckItem = () => {
        if (!newItem.trim()) return;
        set('checklist', [...form.checklist, { id: 'c' + Date.now(), text: newItem.trim(), done: false }]);
        setNewItem('');
      };
      const toggleCheck = id => set('checklist', form.checklist.map(c => c.id === id ? { ...c, done: !c.done } : c));
      const removeCheck = id => set('checklist', form.checklist.filter(c => c.id !== id));
      const { t } = useLang();
      const activeMembers = teamMembers.filter(m => m.status === 'active');
      const priObj  = TASK_PRIORITIES.find(p => p.id === form.priority) || TASK_PRIORITIES[2];
      const statObj = TASK_STATUSES.find(s => s.id === form.status)     || TASK_STATUSES[0];

      return (
        <div className="fixed inset-0 z-50 flex items-start justify-center bg-black/60 backdrop-blur-sm overflow-y-auto pt-8 pb-8"
          onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg mx-4 shadow-2xl" dir="rtl">

            {/* Header */}
            <div className="flex items-center justify-between px-5 py-3 border-b border-slate-800">
              <div className="flex items-center gap-2 text-slate-400">
                <Ic name="tasks" size={14} />
                <span className="text-xs">{task ? t('tsk_task_detail') : t('tsk_new_task')}</span>
              </div>
              <button onClick={onClose} className="text-slate-500 hover:text-white transition-colors"><Ic name="x" size={16}/></button>
            </div>

            {/* Title */}
            <div className="border-b border-slate-800 px-5 py-3">
              <input autoFocus
                className="w-full bg-transparent text-white text-sm font-medium placeholder-slate-500 outline-none"
                placeholder={t('tsk_task_title')} value={form.title} onChange={e => set('title', e.target.value)} />
            </div>

            <div className="px-5 py-4 space-y-4">
              {/* Assign to */}
              <div>
                <label className="flex items-center gap-1.5 text-xs text-slate-500 mb-2">
                  <Ic name="users" size={11}/> {t('tsk_assign_to')}
                </label>
                <div className="flex items-center gap-2 flex-wrap">
                  {activeMembers.map(m => {
                    const sel = form.assignees.includes(m.id);
                    return (
                      <button key={m.id} onClick={() => toggleAssignee(m.id)} title={m.name}
                        className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium transition-all border
                          ${sel ? 'border-blue-500 bg-blue-500/15 text-blue-300' : 'border-slate-700 bg-slate-800 text-slate-400 hover:border-slate-600'}`}>
                        <span className="w-5 h-5 rounded-full bg-gradient-to-br from-blue-600 to-blue-600 flex items-center justify-center text-[9px] font-bold text-white">{m.name.charAt(0)}</span>
                        {m.name.split(' ')[0]}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Status + Priority */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="flex items-center gap-1.5 text-xs text-slate-500 mb-1.5">
                    <span className={`${statObj.text}`}><Ic name={statObj.icon} size={11}/></span> {t('tsk_status')}
                  </label>
                  <div className="relative">
                    <select className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none appearance-none"
                      value={form.status} onChange={e => set('status', e.target.value)}>
                      {TASK_STATUSES.map(s => <option key={s.id} value={s.id}>{sl(s,t)}</option>)}
                    </select>
                    <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none"><Ic name="chevdown" size={12}/></span>
                  </div>
                </div>
                <div>
                  <label className="flex items-center gap-1.5 text-xs text-slate-500 mb-1.5">
                    <span className={`${priObj.text}`}><Ic name={priObj.icon} size={11}/></span> {t('tsk_priority')}
                  </label>
                  <div className="relative">
                    <select className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none appearance-none"
                      value={form.priority} onChange={e => set('priority', e.target.value)}>
                      {TASK_PRIORITIES.map(p => <option key={p.id} value={p.id}>{sl(p,t)}</option>)}
                    </select>
                    <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none"><Ic name="chevdown" size={12}/></span>
                  </div>
                </div>
              </div>

              {/* Dates */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="flex items-center gap-1.5 text-xs text-slate-500 mb-1.5">
                    <Ic name="calendar" size={11}/> {t('tsk_start_date')}
                  </label>
                  <input type="date" className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none"
                    value={form.start_date} onChange={e => set('start_date', e.target.value)} />
                </div>
                <div>
                  <label className="flex items-center gap-1.5 text-xs text-slate-500 mb-1.5">
                    <Ic name="calendar" size={11}/> {t('tsk_due')}
                  </label>
                  <input type="date" className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none"
                    value={form.due_date} onChange={e => set('due_date', e.target.value)} />
                </div>
              </div>

              {/* Repeat + Bucket */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="flex items-center gap-1.5 text-xs text-slate-500 mb-1.5">
                    <Ic name="repeat2" size={11}/> {t('tsk_repeat')}
                  </label>
                  <div className="relative">
                    <select className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none appearance-none"
                      value={form.repeat} onChange={e => set('repeat', e.target.value)}>
                      {TASK_REPEATS.map(r => <option key={r.id} value={r.id}>{sl(r,t)}</option>)}
                    </select>
                    <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none"><Ic name="chevdown" size={12}/></span>
                  </div>
                </div>
                <div>
                  <label className="flex items-center gap-1.5 text-xs text-slate-500 mb-1.5">
                    <Ic name="columns" size={11}/> {t('tsk_bucket')}
                  </label>
                  <div className="relative">
                    <select className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none appearance-none"
                      value={form.bucket_id} onChange={e => set('bucket_id', e.target.value)}>
                      {buckets.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                    </select>
                    <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none"><Ic name="chevdown" size={12}/></span>
                  </div>
                </div>
              </div>

              {/* Checklist + Show in board */}
              <div className="grid grid-cols-2 gap-4 items-start">
                <div>
                  <label className="flex items-center gap-1.5 text-xs text-slate-500 mb-2">
                    <Ic name="tasks" size={11}/> {t('tsk_checklist')}
                    {form.checklist.length > 0 && (
                      <span className="text-blue-400 font-medium">{form.checklist.filter(c=>c.done).length}/{form.checklist.length}</span>
                    )}
                  </label>
                  <div className="space-y-1.5 mb-2">
                    {form.checklist.map(c => (
                      <div key={c.id} className="flex items-center gap-2 group/ci">
                        <button onClick={() => toggleCheck(c.id)}
                          className={`w-4 h-4 rounded-full border-2 flex-shrink-0 transition-all flex items-center justify-center
                            ${c.done ? 'bg-green-500 border-green-500 text-white' : 'border-slate-600 hover:border-slate-400'}`}>
                          {c.done && <Ic name="check" size={8}/>}
                        </button>
                        <span className={`text-xs flex-1 ${c.done ? 'line-through text-slate-500' : 'text-slate-300'}`}>{c.text}</span>
                        <button onClick={() => removeCheck(c.id)}
                          className="text-slate-600 hover:text-red-400 transition-colors opacity-0 group-hover/ci:opacity-100">
                          <Ic name="x" size={10}/>
                        </button>
                      </div>
                    ))}
                  </div>
                  <div className="flex items-center gap-2">
                    <div className="w-4 h-4 rounded-full border-2 border-dashed border-slate-600 flex-shrink-0" />
                    <input className="flex-1 text-xs bg-transparent text-slate-400 placeholder-slate-600 outline-none border-b border-slate-700 pb-0.5"
                      placeholder={t('tsk_add_item')} value={newItem}
                      onChange={e => setNewItem(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && addCheckItem()} />
                  </div>
                </div>
                <div className="mt-5">
                  <label className="flex items-center gap-2 cursor-pointer group/sb">
                    <input type="checkbox" checked={form.show_checklist_in_board}
                      onChange={e => set('show_checklist_in_board', e.target.checked)}
                      className="rounded accent-blue-500 cursor-pointer" />
                    <span className="flex items-center gap-1.5 text-xs text-slate-400 group-hover/sb:text-slate-300 transition-colors">
                      <Ic name="eye" size={11}/> {t('tsk_show_in_board')}
                    </span>
                  </label>
                </div>
              </div>

              {/* Notes */}
              <div>
                <label className="flex items-center gap-1.5 text-xs text-slate-500 mb-1.5">
                  <Ic name="note" size={11}/> {t('tsk_notes')}
                </label>
                <textarea rows={3}
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-600 outline-none resize-none"
                  placeholder={t('tsk_notes')+'...'} value={form.notes} onChange={e => set('notes', e.target.value)} />
              </div>
            </div>

            {/* Footer */}
            <div className="border-t border-slate-800 px-5 py-3 flex items-center justify-between">
              <div className="flex gap-2 flex-wrap">
                <button onClick={() => { if (!form.title.trim()) return; onSave(form); onClose(); }}
                  disabled={!form.title.trim()}
                  className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-xs font-medium px-4 py-2 rounded-lg transition-colors">
                  <Ic name="check" size={12}/> {t('save')}
                </button>
                {task && form.status !== 'completed' && (
                  <button onClick={() => { onMarkComplete?.({ ...form }); onClose(); }}
                    className="flex items-center gap-1.5 bg-green-600 hover:bg-green-500 text-white text-xs font-medium px-4 py-2 rounded-lg transition-colors">
                    <Ic name="chk_c" size={12}/> {t('tsk_mark_complete')}
                  </button>
                )}
                <button onClick={onClose}
                  className="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-4 py-2 rounded-lg transition-colors">
                  <Ic name="x" size={12}/> {t('cancel')}
                </button>
              </div>
              {task && (
                <button onClick={() => { onDelete(task.id); onClose(); }}
                  className="flex items-center gap-1.5 text-red-400 hover:text-red-300 text-xs px-3 py-2 rounded-lg hover:bg-red-500/10 transition-colors">
                  <Ic name="trash" size={12}/> {t('delete')}
                </button>
              )}
            </div>
          </div>
        </div>
      );
    };

    /* ── TaskCard ── */
    const TaskCard = ({ task, teamMembers, onClick, onComplete, onDragStart: onDragStartCb, onDragEnd: onDragEndCb }) => {
      const { t } = useLang();
      const pri  = TASK_PRIORITIES.find(p => p.id === task.priority) || TASK_PRIORITIES[2];
      const stat = TASK_STATUSES.find(s => s.id === task.status)     || TASK_STATUSES[0];
      const assigned   = teamMembers.filter(m => task.assignees.includes(m.id));
      const doneCount  = task.checklist.filter(c => c.done).length;
      const totalCount = task.checklist.length;
      const isOverdue  = task.due_date && task.status !== 'completed' && new Date(task.due_date) < new Date();
      const isCompleted = task.status === 'completed';

      return (
        <div
          draggable={true}
          onDragStart={e => { e.dataTransfer.setData('text/plain', task.id); e.dataTransfer.effectAllowed = 'move'; onDragStartCb?.(task.id); }}
          onDragEnd={() => onDragEndCb?.()}
          onClick={onClick}
          className={`bg-slate-800/80 border border-slate-700 hover:border-slate-600 rounded-xl p-3 cursor-grab active:cursor-grabbing hover:bg-slate-800 transition-all border-l-[3px] ${pri.borderL} group select-none`}>

          {/* Drag handle + Complete toggle + Title */}
          <div className="flex items-start gap-2 mb-2">
            <span className="text-slate-700 group-hover:text-slate-500 mt-0.5 flex-shrink-0 transition-colors" onClick={e => e.stopPropagation()}>
              <Ic name="grip" size={12}/>
            </span>
            {/* Complete shortcut */}
            <button
              onClick={e => { e.stopPropagation(); onComplete?.(task); }}
              title={t(isCompleted ? 'tsk_undo' : 'tsk_mark_complete')}
              className={`mt-0.5 flex-shrink-0 w-4 h-4 rounded-full border-2 flex items-center justify-center transition-all
                ${isCompleted
                  ? 'bg-green-500 border-green-500 text-white'
                  : 'border-slate-600 group-hover:border-green-500/60 hover:!border-green-500 hover:bg-green-500/10'}`}>
              {isCompleted && <Ic name="check" size={8}/>}
            </button>
            <span className={`text-sm font-medium leading-snug flex-1 ${isCompleted ? 'line-through text-slate-500' : 'text-white'}`}>
              {task.title}
            </span>
          </div>

          {/* Priority + Status chips */}
          <div className="flex items-center gap-1.5 mb-2 flex-wrap">
            <span className={`flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded ${pri.text} ${pri.bg}`}>
              <Ic name={pri.icon} size={9}/> {sl(pri,t)}
            </span>
            <span className={`flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded ${stat.text} bg-slate-900/60`}>
              <span className={`${stat.dot} ${task.status === 'in_progress' ? 'animate-pulse' : ''} w-1.5 h-1.5 rounded-full inline-block`}/>
              {sl(stat,t)}
            </span>
          </div>

          {/* Dates */}
          {(task.start_date || task.due_date) && (
            <div className={`flex items-center gap-1 text-[10px] mb-2 ${isOverdue ? 'text-red-400' : 'text-slate-500'}`}>
              <Ic name="calendar" size={9}/>
              {task.start_date && <span>{task.start_date}</span>}
              {task.start_date && task.due_date && <span>—</span>}
              {task.due_date && <span>{task.due_date}</span>}
            </div>
          )}

          {/* Checklist preview */}
          {task.show_checklist_in_board && task.checklist.length > 0 && (
            <div className="space-y-1 mb-2 bg-slate-900/40 rounded-lg p-2">
              {task.checklist.slice(0, 3).map(c => (
                <div key={c.id} className="flex items-center gap-1.5">
                  <div className={`w-3 h-3 rounded-full border flex-shrink-0 flex items-center justify-center
                    ${c.done ? 'bg-green-500 border-green-500 text-white' : 'border-slate-600'}`}>
                    {c.done && <Ic name="check" size={7}/>}
                  </div>
                  <span className={`text-[10px] ${c.done ? 'line-through text-slate-600' : 'text-slate-400'}`}>{c.text}</span>
                </div>
              ))}
              {totalCount > 3 && <span className="text-[10px] text-slate-600 pr-4">+{totalCount - 3} {t('tsk_more_items')}</span>}
            </div>
          )}

          {/* Footer: avatars + checklist count */}
          <div className="flex items-center justify-between mt-1">
            <div className="flex -space-x-1.5 space-x-reverse">
              {assigned.slice(0, 3).map(m => (
                <div key={m.id} title={m.name}
                  className="w-6 h-6 rounded-full bg-gradient-to-br from-blue-600 to-blue-600 border-2 border-slate-800 flex items-center justify-center text-[9px] font-bold text-white">
                  {m.name.charAt(0)}
                </div>
              ))}
              {assigned.length > 3 && (
                <div className="w-6 h-6 rounded-full bg-slate-700 border-2 border-slate-800 flex items-center justify-center text-[9px] text-slate-400">
                  +{assigned.length - 3}
                </div>
              )}
            </div>
            {totalCount > 0 && (
              <span className="flex items-center gap-1 text-[10px] text-slate-500">
                <Ic name="tasks" size={9}/> {doneCount}/{totalCount}
              </span>
            )}
          </div>
        </div>
      );
    };

    /* ══════════════════════════════════════════════════
       Web Services Module
    ══════════════════════════════════════════════════ */
    const WebServicesModule = ({ projects, clients, invoices, teamMembers, webData, onSaveWebData, showToast }) => {
      const { t } = useLang();
      const genId = () => 'ws_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

      const STAGES = ['Discovery','Design','Development','Review','Launch'];
      const stageProgress = s => { const i = STAGES.indexOf(s); return i < 0 ? 0 : Math.round((i+1)/STAGES.length*100); };
      const TASK_STATUSES = ['not_started','in_progress','completed'];
      const CAT_LABELS  = { on_page:'On-page', off_page:'Off-page', tech:'تقني', content:'محتوى' };
      const VOL_LABELS  = { high:'عالي', medium:'متوسط', low:'منخفض' };
      const DIFF_LABELS = { easy:'سهل', medium:'متوسط', hard:'صعب' };
      const STATUS_STYLES = {
        not_started:'bg-slate-700/60 text-slate-300 border-slate-600',
        in_progress:'bg-amber-500/15 text-amber-300 border-amber-500/30',
        completed:'bg-emerald-500/15 text-emerald-300 border-emerald-500/30',
      };
      const STATUS_LABELS = { not_started:'لم يبدأ', in_progress:'قيد التنفيذ', completed:'مكتمل' };

      const [tab,    setTab]    = useState('overview');
      const [projId, setProjId] = useState(() => webData[0]?.projectId ?? null);
      const [modal,  setModal]  = useState(null);
      const [form,   setForm]   = useState({});
      const [editId, setEditId] = useState(null);

      const closeModal = () => { setModal(null); setForm({}); setEditId(null); };

      const record = webData.find(r => r.projectId === projId) ?? null;
      const project = projects.find(p => p.id === projId);
      const client  = project ? clients.find(c => c.id === project.clientId) : null;
      const projInvoices = invoices.filter(inv => inv.projectId === projId);

      const saveRecord = patch => {
        if (!record) return;
        onSaveWebData({ ...record, ...patch });
      };

      /* Financial calcs (read-only from Invoices) */
      const calcInv = invArr => {
        let total = 0, collected = 0;
        invArr.forEach(inv => {
          const sub   = (inv.items||[]).reduce((s,it) => s+(it.qty||1)*(it.unit_price||0), 0);
          const grand = sub * (1 + (inv.tax||0)/100);
          total += grand;
          const paidPct = (inv.payments||[]).filter(p=>p.status==='paid').reduce((s,p)=>s+(p.pct||0),0);
          collected += grand * paidPct / 100;
        });
        return { total, collected, remaining: total - collected };
      };

      /* Days until a date */
      const today = new Date(); today.setHours(0,0,0,0);
      const daysUntil = dateStr => {
        if (!dateStr) return null;
        const d = new Date(dateStr); d.setHours(0,0,0,0);
        return Math.round((d - today) / 86400000);
      };

      /* All expiry alerts */
      const allAlerts = webData.flatMap(wr => {
        const prj = projects.find(p => p.id === wr.projectId);
        const out = [];
        const dd = daysUntil(wr.DomainExp_Web);
        const hd = daysUntil(wr.HostingExp_Web);
        if (dd !== null && dd <= 45) out.push({ type:'domain',  name:prj?.name||'—', days:dd, pid:wr.projectId });
        if (hd !== null && hd <= 45) out.push({ type:'hosting', name:prj?.name||'—', days:hd, pid:wr.projectId });
        return out;
      });

      /* KPI totals */
      const kpiActive   = webData.filter(r => r.Stage_Web !== 'Launch').length;
      const kpiLaunched = webData.filter(r => r.Stage_Web === 'Launch').length;
      const kpiSEO      = webData.filter(r => (r.services||[]).includes('seo')).length;
      const kpiAlerts   = allAlerts.length;

      /* Cycle task status */
      const cycleStatus = (arr, id, key) =>
        arr.map(item => item.id === id
          ? { ...item, [key]: TASK_STATUSES[(TASK_STATUSES.indexOf(item[key])+1) % TASK_STATUSES.length] }
          : item);

      /* ── Shared sub-components ── */
      const FInput = ({ label, ...props }) => (
        <div>
          <label className="block text-slate-400 text-xs mb-1.5">{label}</label>
          <input {...props} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm outline-none focus:border-blue-500 placeholder-slate-600"/>
        </div>
      );
      const FSelect = ({ label, children, ...props }) => (
        <div>
          <label className="block text-slate-400 text-xs mb-1.5">{label}</label>
          <select {...props} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm outline-none focus:border-blue-500">
            {children}
          </select>
        </div>
      );
      const WsModal = ({ title, onSave, children }) => (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl">
            <div className="flex items-center justify-between px-5 py-4 border-b border-slate-800">
              <h3 className="text-white font-semibold text-sm">{title}</h3>
              <button onClick={closeModal} className="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-all"><Ic name="x" size={14}/></button>

            <div className="p-5 space-y-3.5 max-h-[68vh] overflow-y-auto">{children}</div>
            <div className="flex gap-3 px-5 py-4 border-t border-slate-800">

      /* ── Modal render ── */
      const renderModal = () => {
        if (!modal) return null;

        /* Add new web project */

                Stage_Web:'Discovery', webTasks:[], milestones:[], Creds_Web:[],
                Type_Web:'', Domain_Web:'', DomainExp_Web:'', Hosting_Web:'', HostingExp_Web:'',
                Pages_Web:'', Langs_Web:'', LaunchDate_Web:'',
                SSL_Web:false, Maintenance_Web:false, LastBackup_Web:'',
                Organic_SEO:0, OrganicPrev_SEO:0, Backlinks_SEO:0,
                DA_SEO:0, Speed_SEO:0, Indexed_SEO:0, Errors_SEO:0,

              <div>
                <label className="block text-slate-400 text-xs mb-2">الخدمات</label>
                <div className="flex gap-4">
                  {['web','seo'].map(svc => (
                    <label key={svc} className="flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" checked={(form.services||['web','seo']).includes(svc)}
                        onChange={e => {
                          const cur = form.services || ['web','seo'];
                          setForm({...form, services: e.target.checked ? [...new Set([...cur,svc])] : cur.filter(x=>x!==svc)});

                      <span className="text-slate-300 text-sm">{svc==='web'?'موقع (Web Building)':'SEO'}</span>
                    </label>
                  ))}
                </div>
              </div>
            </WsModal>
          );
        }

        /* Edit tech info */
        if (modal === 'tech_info') {
          return (
            <WsModal title="تعديل المعلومات التقنية" onSave={() => {
              saveRecord(form);
              closeModal();
              showToast('تم الحفظ ✓');
            }}>
              <FInput label="نوع الموقع"                  value={form.Type_Web||''}        onChange={e=>setForm({...form,Type_Web:e.target.value})}        placeholder="WordPress / مخصص / Shopify..."/>
              <FInput label="النطاق (Domain)"             value={form.Domain_Web||''}      onChange={e=>setForm({...form,Domain_Web:e.target.value})}      placeholder="example.com"/>
              <FInput label="تاريخ انتهاء النطاق" type="date" value={form.DomainExp_Web||''}   onChange={e=>setForm({...form,DomainExp_Web:e.target.value})}/>
              <FInput label="الاستضافة"                    value={form.Hosting_Web||''}    onChange={e=>setForm({...form,Hosting_Web:e.target.value})}    placeholder="SiteGround — Business"/>
              <FInput label="تاريخ انتهاء الاستضافة" type="date" value={form.HostingExp_Web||''} onChange={e=>setForm({...form,HostingExp_Web:e.target.value})}/>
              <FInput label="عدد الصفحات"     type="number" value={form.Pages_Web||''}     onChange={e=>setForm({...form,Pages_Web:e.target.value})}/>
              <FInput label="لغات الموقع"                  value={form.Langs_Web||''}      onChange={e=>setForm({...form,Langs_Web:e.target.value})}      placeholder="عربي / English"/>
              <FInput label="موعد الإطلاق"    type="date"   value={form.LaunchDate_Web||''} onChange={e=>setForm({...form,LaunchDate_Web:e.target.value})}/>
              <FInput label="آخر نسخة احتياطية" type="date" value={form.LastBackup_Web||''} onChange={e=>setForm({...form,LastBackup_Web:e.target.value})}/>
            </WsModal>

        /* Add / edit web task */

            <WsModal title={editId ? 'تعديل مهمة موقع' : 'إضافة مهمة موقع'} onSave={() => {

              <FSelect label="المرحلة" value={form.Task_stage||'Discovery'} onChange={e=>setForm({...form,Task_stage:e.target.value})}>

              <FSelect label="الموظف المسؤول" value={form.Task_assignee||''} onChange={e=>setForm({...form,Task_assignee:Number(e.target.value)||''})}>
                <option value="">— اختر —</option>

              <FSelect label="الحالة" value={form.Task_status||'not_started'} onChange={e=>setForm({...form,Task_status:e.target.value})}>

        }

        /* Add / edit credential */
        if (modal === 'cred') {
          const creds = record?.Creds_Web || [];
          return (
            <WsModal title={editId ? 'تعديل وصول' : 'إضافة وصول'} onSave={() => {
              if (!form.label?.trim()) return;
              const updated = editId
                ? creds.map(x => x.id===editId ? {...x,...form} : x)
                : [...creds, { id:genId(), ...form }];
              saveRecord({ Creds_Web:updated });
              closeModal();
              showToast(editId ? 'تم التعديل ✓' : 'تمت الإضافة ✓');
            }}>

        }

        /* Add / edit keyword */
        if (modal === 'keyword') {
          const kws = record?.keywords || [];
          return (
            <WsModal title={editId ? 'تعديل كلمة مفتاحية' : 'إضافة كلمة مفتاحية'} onSave={() => {
              if (!form.KW_kw?.trim()) return;
              const item = { ...form, KW_pos:Number(form.KW_pos)||0, KW_prev:Number(form.KW_prev)||0 };
              const updated = editId
                ? kws.map(x => x.id===editId ? {...x,...item} : x)
                : [...kws, { id:genId(), ...item }];
              saveRecord({ keywords:updated });
              closeModal();
              showToast(editId ? 'تم التعديل ✓' : 'تمت الإضافة ✓');
            }}>
              <FInput label="الكلمة المفتاحية *" value={form.KW_kw||''} onChange={e=>setForm({...form,KW_kw:e.target.value})} placeholder="مثال: تصميم مواقع عمّان"/>
              <div className="grid grid-cols-2 gap-3">
                <FInput label="الترتيب الحالي" type="number" min="1" value={form.KW_pos||''} onChange={e=>setForm({...form,KW_pos:e.target.value})} placeholder="1"/>
                <FInput label="الترتيب السابق" type="number" min="1" value={form.KW_prev||''} onChange={e=>setForm({...form,KW_prev:e.target.value})} placeholder="1"/>
              </div>
              <FSelect label="حجم البحث" value={form.KW_vol||'medium'} onChange={e=>setForm({...form,KW_vol:e.target.value})}>
                <option value="high">عالي</option>
                <option value="medium">متوسط</option>
                <option value="low">منخفض</option>
              </FSelect>
              <FSelect label="الصعوبة" value={form.KW_diff_level||'medium'} onChange={e=>setForm({...form,KW_diff_level:e.target.value})}>
                <option value="easy">سهل</option>
                <option value="medium">متوسط</option>
                <option value="hard">صعب</option>
              </FSelect>
            </WsModal>
          );
        }

        /* Add / edit SEO task */
        if (modal === 'seo_task') {
          const stasks = record?.seoTasks || [];
          return (
            <WsModal title={editId ? 'تعديل مهمة SEO' : 'إضافة مهمة SEO'} onSave={() => {
              if (!form.STask_t?.trim()) return;
              const updated = editId
                ? stasks.map(x => x.id===editId ? {...x,...form} : x)
                : [...stasks, { id:genId(), ...form }];
              saveRecord({ seoTasks:updated });
              closeModal();
              showToast(editId ? 'تم التعديل ✓' : 'تمت الإضافة ✓');
            }}>
              <FInput label="وصف المهمة *" value={form.STask_t||''} onChange={e=>setForm({...form,STask_t:e.target.value})} placeholder="مثال: كتابة مقالة SEO"/>
              <FSelect label="التصنيف" value={form.STask_cat||'on_page'} onChange={e=>setForm({...form,STask_cat:e.target.value})}>
                <option value="on_page">On-page</option>
                <option value="off_page">Off-page</option>

                <option value="content">محتوى</option>

              <FSelect label="الموظف المسؤول" value={form.STask_assignee||''} onChange={e=>setForm({...form,STask_assignee:Number(e.target.value)||''})}>

                <option value="completed">مكتمل</option>

        if (modal === 'update_seo') {

                OrganicPrev_SEO:Number(form.OrganicPrev_SEO)||0,
                Backlinks_SEO:  Number(form.Backlinks_SEO)||0,
                DA_SEO:         Number(form.DA_SEO)||0,

                <FInput label="الزيارات (الشهر الماضي)"       type="number" value={form.OrganicPrev_SEO||''} onChange={e=>setForm({...form,OrganicPrev_SEO:e.target.value})}/>

                                <button onClick={() => saveRecord({keywords: keywords.filter(x=>x.id!==kw.id)})}
                                  className="p-1.5 rounded hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 transition-all"><Ic name="trash" size={12}/></button>
                              </div>
                            </td>

                  </table>

            {/* SEO Tasks */}
            <div className="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-5">

                  مهام SEO <span className="text-slate-500 font-normal text-xs">({seoTasks.length})</span>

                <button onClick={() => { setForm({STask_t:'',STask_cat:'on_page',STask_assignee:'',STask_status:'not_started'}); setEditId(null); setModal('seo_task'); }}

                  <Ic name="plus" size={11}/> + مهمة SEO
                </button>

              {seoTasks.length === 0 ? (
                <div className="text-center py-6 text-slate-500 text-sm">لا توجد مهام SEO — أضف مهمة</div>

                <div className="space-y-2">
                  {seoTasks.map(task => {
                    const member = teamMembers.find(m => m.id === task.STask_assignee);
                    return (
                      <div key={task.id} className="flex items-center gap-3 bg-slate-900/50 rounded-xl px-3 py-2.5 group">
                        <button onClick={() => saveRecord({seoTasks: cycleStatus(seoTasks, task.id, 'STask_status')})}
                          className={`px-2 py-0.5 rounded-full text-[10px] font-semibold border cursor-pointer transition-all flex-shrink-0 ${STATUS_STYLES[task.STask_status]}`}>
                          {STATUS_LABELS[task.STask_status]}
                        </button>
                        <div className="flex-1 min-w-0">
                          <div className="text-slate-200 text-sm truncate">{task.STask_t}</div>
                          <div className="text-slate-500 text-xs">{CAT_LABELS[task.STask_cat]||task.STask_cat} · {member?.name||'—'}</div>
                        </div>
                        <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-all flex-shrink-0">
                          <button onClick={() => { setForm({...task}); setEditId(task.id); setModal('seo_task'); }}
                            className="p-1.5 rounded-lg hover:bg-slate-700 text-slate-400 hover:text-white transition-all"><Ic name="edit2" size={12}/></button>
                          <button onClick={() => saveRecord({seoTasks: seoTasks.filter(x=>x.id!==task.id)})}
                            className="p-1.5 rounded-lg hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 transition-all"><Ic name="trash" size={12}/></button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Monthly report */}
            <div className="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-5">
              <h3 className="text-slate-200 font-semibold text-sm mb-1">التقرير الشهري</h3>
              <p className="text-slate-400 text-xs mb-4">تقرير شهري شامل بشعار Magnet Link — الزيارات العضوية، الكلمات المفتاحية، المهام المكتملة</p>
              <button onClick={() => showToast('جاري إعداد تقرير PDF... ⏳')}
                className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-medium hover:bg-blue-500 transition-all">
                🖨 تحميل تقرير PDF
              </button>
            </div>
          </div>
        );
      };

      /* ══════════ Main render ══════════ */
      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-2xl font-bold text-white">خدمات الويب</h1>
              <p className="text-slate-400 text-sm mt-0.5">
                {tab === 'overview' ? 'مواقع الإنترنت وتحسين محركات البحث' : (client?.name || project?.name || 'خدمات الويب')}
              </p>
            </div>
            {tab !== 'overview' && webData.length > 0 && (
              <select value={projId||''} onChange={e => setProjId(Number(e.target.value))}
                className="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white outline-none focus:border-blue-500 min-w-[200px]">
                {webData.map(wr => {
                  const prj = projects.find(p => p.id === wr.projectId);
                  return <option key={wr.id} value={wr.projectId}>{prj?.name||'مشروع'}</option>;
                })}
              </select>
            )}
          </div>

          {/* Tabs */}
          <div className="flex items-center gap-1 bg-slate-900 border border-slate-800 rounded-xl p-1 w-fit">
            {[
              { id:'overview', label:'نظرة عامة',   icon:'dashboard' },
              { id:'web',      label:'بناء المواقع', icon:'web'       },
              { id:'seo',      label:'SEO',           icon:'trending'  },
            ].map(tb => (
              <button key={tb.id} onClick={() => setTab(tb.id)}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                  tab===tb.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                <Ic name={tb.icon} size={14}/>
                {tb.label}
              </button>
            ))}
          </div>

          {/* Tab content */}
          {tab === 'overview' ? <OverviewTab/> : tab === 'web' ? <WebBuildingTab/> : <SEOTab/>}

          {/* Modals */}
          {renderModal()}
        </div>
      );
    };

    /* ── TasksModule ── */
    const TasksModule = ({ projects, teamMembers, taskDepts, taskBuckets, taskTasks,
      onAddDept, onDeleteDept, onReorderDepts, onAddBucket, onDeleteBucket, onRenameBucket, onSaveTask, onDeleteTask, showToast }) => {
      const { t } = useLang();
      const [projId,        setProjId]        = useState(projects[0]?.id ?? null);
      const [overlay,       setOverlay]       = useState(null);
      const [addDeptOpen,   setAddDeptOpen]   = useState(false);
      const [newDeptName,   setNewDeptName]   = useState('');
      const [addBucketFor,  setAddBucketFor]  = useState(null);
      const [newBucketName, setNewBucketName] = useState('');
      const [draggingId,    setDraggingId]    = useState(null);
      const [dragOverBucket,setDragOverBucket]= useState(null);
      const [renamingBucket,setRenamingBucket]= useState(null);
      const [renameVal,     setRenameVal]     = useState('');
      const [draggingDeptId,setDraggingDeptId]= useState(null);
      const [dragOverDeptId,setDragOverDeptId]= useState(null);

      const depts      = taskDepts.filter(d => d.project_id === projId).sort((a, b) => a.order - b.order);
      const getBuckets = deptId   => taskBuckets.filter(b => b.department_id === deptId).sort((a, b) => a.order - b.order);
      const getTasks   = bucketId => taskTasks.filter(t => t.bucket_id === bucketId);

      const handleAddDept = () => {
        if (!newDeptName.trim()) return;
        onAddDept({ id: 'dep_' + Date.now(), project_id: projId, name: newDeptName.trim(), order: depts.length + 1 });
        setNewDeptName(''); setAddDeptOpen(false); showToast(t('tsk_dept_added'));
      };
      const handleAddBucket = deptId => {
        if (!newBucketName.trim()) return;
        onAddBucket({ id: 'bk_' + Date.now(), department_id: deptId, name: newBucketName.trim(), order: getBuckets(deptId).length + 1 });
        setNewBucketName(''); setAddBucketFor(null);
      };
      const handleCompleteTask = (task) => {
        const prevStatus = task.status;
        if (prevStatus === 'completed') {
          onSaveTask({ ...task, status: 'not_start' });
        } else {
          onSaveTask({ ...task, status: 'completed' });
          showToast(t('tsk_completed_toast'), {
            onUndo: () => onSaveTask({ ...task, status: prevStatus }),
            undoLabel: t('tsk_undo'),
          });
        }
      };
      const handleDeptDrop = targetId => {
        if (!draggingDeptId || draggingDeptId === targetId) return;
        const ids = depts.map(d => d.id);
        const from = ids.indexOf(draggingDeptId);
        const to   = ids.indexOf(targetId);
        const next = [...ids];
        next.splice(from, 1);
        next.splice(to, 0, draggingDeptId);
        onReorderDepts(next);
        setDraggingDeptId(null); setDragOverDeptId(null);
      };

      const handleDrop = (bucketId) => {
        if (!draggingId) return;
        const tk = taskTasks.find(x => x.id === draggingId);
        if (tk && tk.bucket_id !== bucketId) {
          onSaveTask({ ...tk, bucket_id: bucketId });
          showToast(t('tsk_task_moved'));
        }
        setDraggingId(null); setDragOverBucket(null);
      };

      return (
        <div className="space-y-4" dir="ltr">
          {/* Header */}
          <div className="flex items-center justify-between gap-3" dir="rtl">
            <div className="relative">
              <select className="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 pr-8 text-sm text-white outline-none appearance-none min-w-[200px]"
                value={projId ?? ''}
                onChange={e => { const v = e.target.value; setProjId(isNaN(v) || v === '' ? v : Number(v)); }}>
                {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
              <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none"><Ic name="chevdown" size={12}/></span>
            </div>
            <button onClick={() => setAddDeptOpen(true)}
              className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-blue-500/40 text-white text-sm font-medium px-4 py-2 rounded-xl transition-all">
              <span className="text-blue-400"><Ic name="plus" size={14}/></span> {t('tsk_new_dept')}
            </button>
          </div>

          {/* Add dept form */}
          {addDeptOpen && (
            <div className="flex items-center gap-2 bg-slate-800 border border-blue-500/40 rounded-xl px-4 py-3" dir="rtl">
              <span className="text-blue-400 flex-shrink-0"><Ic name="layers2" size={14}/></span>
              <input autoFocus className="flex-1 bg-transparent text-white text-sm outline-none placeholder-slate-500"
                placeholder={t('tsk_dept_ph')} value={newDeptName}
                onChange={e => setNewDeptName(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') handleAddDept(); if (e.key === 'Escape') setAddDeptOpen(false); }} />
              <button onClick={handleAddDept}
                className="flex items-center gap-1 bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg">
                <Ic name="check" size={11}/> {t('add')}
              </button>
              <button onClick={() => setAddDeptOpen(false)} className="text-slate-500 hover:text-white transition-colors">
                <Ic name="x" size={14}/>
              </button>
            </div>
          )}

          {depts.length === 0 && (
            <div className="flex flex-col items-center justify-center py-20 text-center" dir="rtl">
              <div className="w-16 h-16 bg-slate-800 rounded-2xl flex items-center justify-center mb-4 border border-slate-700 text-slate-600">
                <Ic name="tasks" size={28}/>
              </div>
              <p className="text-slate-400 text-sm font-medium mb-1">{t('tsk_no_depts')}</p>
              <p className="text-slate-600 text-xs">{t('tsk_no_depts_hint')}</p>
            </div>
          )}

          {depts.map((dept, deptIdx) => {
            const buckets  = getBuckets(dept.id);
            const meta     = getDeptMeta(dept, deptIdx);
            const deptTaskCount = buckets.reduce((sum, b) => sum + getTasks(b.id).length, 0);
            return (
              <div key={dept.id}
                onDragOver={e => { if (!draggingDeptId) return; e.preventDefault(); e.dataTransfer.dropEffect='move'; if (dragOverDeptId !== dept.id) setDragOverDeptId(dept.id); }}
                onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOverDeptId(null); }}
                onDrop={e => { e.preventDefault(); e.stopPropagation(); handleDeptDrop(dept.id); }}
                className={`border rounded-2xl overflow-hidden transition-all duration-200 ${meta.bg}
                  ${draggingDeptId === dept.id ? 'opacity-40 scale-[0.98]' : ''}
                  ${dragOverDeptId === dept.id && draggingDeptId !== dept.id ? 'ring-2 ring-blue-500/60 -translate-y-1 shadow-lg shadow-blue-500/10' : ''}`}
                dir="rtl">
                {/* Dept header */}
                <div className="flex items-center justify-between px-5 py-3 border-b border-slate-700/50">
                  <div className="flex items-center gap-2.5">
                    <span
                      draggable
                      onDragStart={e => { e.stopPropagation(); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', dept.id); setDraggingDeptId(dept.id); }}
                      onDragEnd={() => { setDraggingDeptId(null); setDragOverDeptId(null); }}
                      className="text-slate-600 hover:text-slate-400 cursor-grab active:cursor-grabbing p-0.5 rounded transition-colors"
                      title="اسحب لإعادة الترتيب">
                      <Ic name="grip" size={14}/>
                    </span>
                    <span className={meta.color}><Ic name={meta.icon} size={16}/></span>
                    <h3 className="text-base font-semibold text-white">{dept.name}</h3>
                    {deptTaskCount > 0 && (
                      <span className="text-xs text-slate-500 bg-slate-800/60 px-2 py-0.5 rounded-full">{deptTaskCount}</span>
                    )}
                  </div>
                  <button
                    onClick={() => { if (window.confirm(`${t('delete')} "${dept.name}" ${t('tsk_del_dept')}`)) { onDeleteDept(dept.id); showToast(t('tsk_dept_deleted')); } }}
                    className="p-1.5 rounded-lg text-slate-600 hover:text-rose-400 hover:bg-rose-500/10 transition-all"
                    title={t('tsk_delete_dept')}>
                    <Ic name="trash" size={13}/>
                  </button>
                </div>

                {/* Buckets row */}
                <div className="p-3 overflow-x-auto" dir="ltr">
                  <div className="flex gap-3 min-w-max">
                    {buckets.map(bucket => {
                      const bTasks  = getTasks(bucket.id);
                      const isOver  = dragOverBucket === bucket.id;
                      const isDragSource = bTasks.some(tk => tk.id === draggingId);
                      return (
                        <div key={bucket.id} className="w-64 flex-shrink-0"
                          onDragOver={e => { if (draggingDeptId) return; e.preventDefault(); e.dataTransfer.dropEffect='move'; setDragOverBucket(bucket.id); }}
                          onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOverBucket(null); }}
                          onDrop={e => { if (draggingDeptId) return; e.preventDefault(); handleDrop(bucket.id); }}>

                          {/* Bucket header */}
                          <div className={`text-xs font-medium mb-2 py-1.5 px-2.5 rounded-lg border transition-all flex items-center justify-between gap-1
                            ${isOver ? 'bg-blue-500/20 border-blue-500/50 text-blue-300' : 'bg-slate-800/60 border-slate-700 text-slate-400'}`}>
                            <span className="flex items-center gap-1.5 min-w-0 flex-1">
                              <Ic name="columns" size={10}/>
                              {renamingBucket === bucket.id ? (
                                <input autoFocus
                                  className="flex-1 bg-transparent text-white text-xs outline-none border-b border-blue-500/60 min-w-0"
                                  value={renameVal}
                                  onChange={e => setRenameVal(e.target.value)}
                                  onBlur={() => { if (renameVal.trim()) onRenameBucket(bucket.id, renameVal.trim()); setRenamingBucket(null); }}
                                  onKeyDown={e => {
                                    if (e.key === 'Enter') { if (renameVal.trim()) onRenameBucket(bucket.id, renameVal.trim()); setRenamingBucket(null); }
                                    if (e.key === 'Escape') setRenamingBucket(null);
                                  }} />
                              ) : (
                                <span className="truncate cursor-pointer hover:text-white transition-colors"
                                  onDoubleClick={() => { setRenamingBucket(bucket.id); setRenameVal(bucket.name); }}
                                  title="Double-click to rename">
                                  {bucket.name}
                                </span>
                              )}
                              {bTasks.length > 0 && renamingBucket !== bucket.id && (
                                <span className={`${isOver ? 'text-blue-400' : 'text-slate-600'} font-normal shrink-0`}>({bTasks.length})</span>
                              )}
                            </span>
                            <button
                              onClick={() => { if (window.confirm(`${t('delete')} "${bucket.name}" ${t('tsk_del_bucket')}`)) { onDeleteBucket(bucket.id); showToast(t('tsk_bucket_deleted')); } }}
                              className="shrink-0 p-0.5 rounded hover:text-rose-400 hover:bg-rose-500/10 transition-all text-slate-600"
                              title={t('tsk_delete_bucket')}>
                              <Ic name="x" size={11}/>
                            </button>
                          </div>

                          {/* Drop zone */}
                          <div className={`space-y-2 min-h-[60px] rounded-xl transition-all p-1 -m-1
                            ${isOver ? 'bg-blue-500/5 ring-1 ring-blue-500/30 ring-dashed' : ''}`}>
                            {bTasks.map(tk => (
                              <TaskCard key={tk.id} task={tk} teamMembers={teamMembers}
                                onClick={() => !draggingId && setOverlay({ task: tk, bucketId: bucket.id, deptId: dept.id })}
                                onComplete={handleCompleteTask}
                                onDragStart={id => setDraggingId(id)}
                                onDragEnd={() => { setDraggingId(null); setDragOverBucket(null); }} />
                            ))}
                            {isOver && draggingId && (
                              <div className="h-16 rounded-xl border-2 border-dashed border-blue-500/40 bg-blue-500/5 flex items-center justify-center">
                                <span className="text-blue-400 text-[10px] flex items-center gap-1">
                                  <Ic name="plus" size={10}/> {t('tsk_drop_here')}
                                </span>
                              </div>
                            )}
                          </div>

                          {/* Add task button */}
                          <button onClick={() => setOverlay({ task: null, bucketId: bucket.id, deptId: dept.id })}
                            className="w-full mt-2 flex items-center justify-center gap-1.5 text-slate-500 hover:text-slate-300 text-xs py-2 rounded-lg hover:bg-slate-800/60 border border-transparent hover:border-slate-700 transition-all">
                            <Ic name="plus" size={11}/> {t('tsk_add_task')}
                          </button>
                        </div>
                      );
                    })}

                    {/* Add new bucket */}
                    <div className="w-52 flex-shrink-0">
                      {addBucketFor === dept.id ? (
                        <div className="w-full bg-slate-800 border border-blue-500/40 rounded-lg px-3 py-2 flex items-center gap-2">
                          <Ic name="columns" size={12} />{/* just visual */}
                          <input autoFocus className="flex-1 bg-transparent text-white text-xs outline-none placeholder-slate-500"
                            placeholder={t('tsk_bucket_ph')} value={newBucketName}
                            onChange={e => setNewBucketName(e.target.value)}
                            onKeyDown={e => { if (e.key === 'Enter') handleAddBucket(dept.id); if (e.key === 'Escape') setAddBucketFor(null); }} />
                          <button onClick={() => handleAddBucket(dept.id)}
                            className="text-blue-400 hover:text-blue-300 transition-colors"><Ic name="check" size={13}/></button>
                          <button onClick={() => setAddBucketFor(null)}
                            className="text-slate-600 hover:text-slate-400 transition-colors"><Ic name="x" size={13}/></button>
                        </div>
                      ) : (
                        <button onClick={() => { setAddBucketFor(dept.id); setNewBucketName(''); }}
                          className="w-full flex items-center justify-center gap-1.5 py-2 bg-blue-600/10 hover:bg-blue-600/20 border border-blue-600/30 hover:border-blue-500/50 text-blue-400 text-xs rounded-lg transition-all">
                          <Ic name="plus" size={11}/> {t('tsk_new_bucket')}
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}

          {overlay && (
            <TaskOverlay
              task={overlay.task} bucketId={overlay.bucketId} deptId={overlay.deptId} projectId={projId}
              buckets={overlay.deptId ? getBuckets(overlay.deptId) : []}
              teamMembers={teamMembers}
              onSave={tk => { onSaveTask({ ...tk, project_id: projId, department_id: overlay.deptId }); showToast(t('tsk_task_saved')); }}
              onMarkComplete={tk => handleCompleteTask({ ...tk, project_id: projId, department_id: overlay.deptId })}
              onDelete={id => { onDeleteTask(id); showToast(t('tsk_task_deleted')); }}
              onClose={() => setOverlay(null)} />
          )}
        </div>
      );
    };

    /* ═══════════════════════════ COMING SOON ═══════════════════════════ */

    const ComingSoon = ({ name }) => {
      const { t } = useLang();
      return (
        <div className="flex flex-col items-center justify-center min-h-[60vh] text-center">
          <div className="w-20 h-20 bg-slate-800 rounded-3xl flex items-center justify-center mb-5 border border-slate-700 text-3xl">🚧</div>
          <h2 className="text-xl font-bold text-white mb-2">{name}</h2>
          <p className="text-slate-500 text-sm">{t('under_dev')}</p>
        </div>
      );
    };

    /* ═══════════════════════════ EMAIL MODULE ═══════════════════════════ */

    const MAIL_SCOPES = [
      'https://graph.microsoft.com/Mail.ReadWrite',
      'https://graph.microsoft.com/Mail.Send',
    ];

    const getMailToken = async () => {
      const msal = getMsal();
      let account = getMsAccountForUser(_currentBmsUserId);
      if (!account) {
        const res = await msalLoginPopup({ scopes: MAIL_SCOPES });
        saveMsAccountLink(_currentBmsUserId, res.account);
        account = res.account;
      }
      const res = await msal.acquireTokenSilent({ scopes: MAIL_SCOPES, account }).catch(async () =>
        msalAcquireTokenPopup({ scopes: MAIL_SCOPES, account })
      );
      return res.accessToken;
    };

    const mailFetch = async (url, opts = {}) => {
      const token = await getMailToken();
      const res = await fetch(`https://graph.microsoft.com/v1.0${url}`, {
        ...opts,
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
      if (!res.ok) throw new Error(`Mail API error ${res.status}: ${await res.text()}`);
      return res.headers.get('content-type')?.includes('json') ? res.json() : res;
    };

    const MAIL_FOLDERS = [
      { id: 'inbox',          label: 'البريد الوارد',  tKey: 'em_inbox',   icon: 'inbox',    wellKnown: 'inbox' },
      { id: 'sentitems',      label: 'المُرسَل',        tKey: 'em_sent',    icon: 'send',     wellKnown: 'sentitems' },
      { id: 'drafts',         label: 'المسودات',        tKey: 'em_drafts',  icon: 'note',     wellKnown: 'drafts' },
      { id: 'deleteditems',   label: 'المحذوفات',       tKey: 'em_deleted', icon: 'trash',    wellKnown: 'deleteditems' },
      { id: 'junkemail',      label: 'البريد المزعج',  tKey: 'em_spam',    icon: 'alert_t',  wellKnown: 'junkemail' },
    ];

    /* ── Compose Modal ── */
    const ComposeModal = ({ onClose, onSent, showToast, replyTo = null, forwardOf = null }) => {
      const { t, lang } = useLang();
      const buildForwardBody = (email) => {
        const from    = email.from?.emailAddress;
        const locale  = lang==='ar'?'ar-SA':'en-US';
        const dateStr = email.receivedDateTime ? new Date(email.receivedDateTime).toLocaleString(locale, { dateStyle:'medium', timeStyle:'short' }) : '';
        const original = email.body?.contentType?.toLowerCase() === 'html'
          ? email.bodyPreview || ''
          : email.body?.content || email.bodyPreview || '';
        return `\n\n${t('em_fwd_header')}\n${t('em_from')}: ${from?.name || from?.address || '—'} <${from?.address || ''}>\n${dateStr}\n${t('em_subject')}: ${email.subject || ''}\n\n${original}`;
      };

      const [to,      setTo]      = useState(replyTo ? replyTo.from?.emailAddress?.address || '' : '');
      const [subject, setSubject] = useState(
        replyTo   ? `Re: ${replyTo.subject || ''}` :
        forwardOf ? `Fwd: ${forwardOf.subject || ''}` : ''
      );
      const [body,    setBody]    = useState(forwardOf ? buildForwardBody(forwardOf) : '');
      const [sending, setSending] = useState(false);

      const send = async () => {
        if (!to.trim()) return showToast(t('em_err_to'));
        setSending(true);
        try {
          const payload = {
            message: {
              subject: subject || t('em_no_subject'),
              body: { contentType: 'Text', content: body },
              toRecipients: [{ emailAddress: { address: to.trim() } }],
            },
            saveToSentItems: true,
          };
          await mailFetch('/me/sendMail', { method: 'POST', body: JSON.stringify(payload) });
          showToast(t('em_sent_ok'));
          onSent?.();
          onClose();
        } catch (e) {
          showToast(t('em_err_send') + e.message);
        } finally {
          setSending(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={onClose}>
          <div className="w-full max-w-xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl flex flex-col"
            style={{ maxHeight: '90vh' }} onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between px-5 py-4 border-b border-slate-800">
              <h3 className="text-white font-semibold text-sm">{replyTo ? t('em_reply_title') : forwardOf ? t('em_forward_title') : t('em_new_title')}</h3>
              <button onClick={onClose} className="text-slate-500 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition"><Ic name="x" size={16}/></button>
            </div>
            <div className="flex-1 overflow-y-auto p-5 space-y-3">
              <div>
                <label className="text-xs text-slate-400 mb-1 block">{t('em_to')}</label>
                <input value={to} onChange={e => setTo(e.target.value)} placeholder="email@example.com"
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 outline-none focus:border-blue-500 transition" dir="ltr"/>
              </div>
              <div>
                <label className="text-xs text-slate-400 mb-1 block">{t('em_subject')}</label>
                <input value={subject} onChange={e => setSubject(e.target.value)} placeholder={t('em_subject_ph')}
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 outline-none focus:border-blue-500 transition"/>
              </div>
              <div>
                <label className="text-xs text-slate-400 mb-1 block">{t('em_body')}</label>
                <textarea value={body} onChange={e => setBody(e.target.value)} rows={8} placeholder={t('em_body')}
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 outline-none focus:border-blue-500 transition resize-none"/>
              </div>
            </div>
            <div className="px-5 py-3 border-t border-slate-800 flex gap-2 justify-end">
              <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm text-slate-400 hover:bg-slate-800 transition">{t('cancel')}</button>
              <button onClick={send} disabled={sending}
                className="flex items-center gap-2 px-5 py-2 rounded-lg text-sm bg-blue-600 hover:bg-blue-500 text-white font-medium transition disabled:opacity-50">
                <Ic name="send" size={14}/>{sending ? t('em_sending') : t('em_send')}
              </button>
            </div>
          </div>
        </div>
      );
    };

    /* ── Email Viewer ── */
    const EmailViewer = ({ email, onClose, onReply, onForward, onDelete }) => {
      const { t, lang } = useLang();
      if (!email) return (
        <div className="flex-1 flex flex-col items-center justify-center text-slate-600 gap-3">
          <Ic name="mail" size={40}/>
          <p className="text-sm">{t('em_select')}</p>
        </div>
      );

      const from    = email.from?.emailAddress;
      const locale  = lang==='ar'?'ar-SA':'en-US';
      const dateStr = email.receivedDateTime ? new Date(email.receivedDateTime).toLocaleString(locale, { dateStyle:'medium', timeStyle:'short' }) : '';
      const bodyContent = email.body?.content || email.bodyPreview || '';
      const isHtml      = email.body?.contentType?.toLowerCase() === 'html';

      return (
        <div className="flex-1 flex flex-col overflow-hidden">
          <div className="px-6 py-4 border-b border-slate-800 flex items-start justify-between gap-4">
            <div className="flex-1 min-w-0">
              <h2 className="text-white font-semibold text-base mb-1 truncate">{email.subject || t('em_no_subject')}</h2>
              <div className="flex flex-wrap gap-x-3 gap-y-0.5 text-xs text-slate-400">
                <span>{t('em_from')}: <span className="text-slate-300">{from?.name || from?.address || '—'}</span></span>
                {from?.address && <span dir="ltr" className="text-slate-500">{from.address}</span>}
                <span className="text-slate-600">·</span>
                <span>{dateStr}</span>
              </div>
            </div>
            <div className="flex items-center gap-1 shrink-0">
              <button onClick={onReply} title={t('em_reply')}
                className="p-2 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition"><Ic name="reply" size={15}/></button>
              <button onClick={onForward} title={t('em_forward')}
                className="p-2 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-blue-400 transition"><Ic name="forward" size={15}/></button>
              <button onClick={onDelete} title={t('delete')}
                className="p-2 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-rose-400 transition"><Ic name="trash" size={15}/></button>
              <button onClick={onClose} title={t('close')}
                className="p-2 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition"><Ic name="x" size={15}/></button>
            </div>
          </div>
          <div className="flex-1 overflow-y-auto p-6">
            {isHtml
              ? <iframe srcDoc={bodyContent} className="w-full h-full border-0 bg-white rounded-xl" style={{ minHeight: 400 }} title="email-body" sandbox="allow-same-origin"/>
              : <pre className="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap font-sans">{bodyContent}</pre>
            }
          </div>
        </div>
      );
    };

    /* ── EmailModule ── */
    const EmailModule = ({ showToast }) => {
      const { t, lang } = useLang();
      const [authed,      setAuthed]      = useState(false);
      const [loading,     setLoading]     = useState(false);
      const [folders,     setFolders]     = useState(MAIL_FOLDERS);
      const [activeFolder, setActiveFolder] = useState('inbox');
      const [messages,    setMessages]    = useState([]);
      const [msgLoading,  setMsgLoading]  = useState(false);
      const [selected,    setSelected]    = useState(null);
      const [msgDetails,  setMsgDetails]  = useState(null);
      const [detailLoad,  setDetailLoad]  = useState(false);
      const [search,      setSearch]      = useState('');
      const [compose,     setCompose]     = useState(false);
      const [replyTo,     setReplyTo]     = useState(null);
      const [forwardOf,   setForwardOf]   = useState(null);
      const [folderCounts, setFolderCounts] = useState({});

      /* Auto-login on mount — wait for background MS auto-link to finish first */
      useEffect(() => {
        _msAutoLinkPromise.then(() => {
          const account = getMsAccountForUser(_currentBmsUserId);
          if (account || getMsal().getAllAccounts().length > 0) {
            setLoading(true);
            getMailToken()
              .then(() => setAuthed(true))
              .catch(() => {})
              .finally(() => setLoading(false));
          }
        });
      }, []);

      /* Sign in */
      const signIn = async () => {
        setLoading(true);
        try {
          await getMailToken();
          setAuthed(true);
          showToast(t('em_login_ok'));
        } catch (e) {
          showToast(t('em_err_login') + e.message);
        } finally {
          setLoading(false);
        }
      };

      /* Load folder unread counts */
      const loadCounts = useCallback(async () => {
        try {
          const results = await Promise.allSettled(
            MAIL_FOLDERS.map(f =>
              mailFetch(`/me/mailFolders/${f.wellKnown}?$select=unreadItemCount`)
            )
          );
          const counts = {};
          MAIL_FOLDERS.forEach((f, i) => {
            if (results[i].status === 'fulfilled') counts[f.id] = results[i].value.unreadItemCount || 0;
          });
          setFolderCounts(counts);
        } catch (_) {}
      }, []);

      /* Load messages for active folder */
      const loadMessages = useCallback(async (folder) => {
        setMsgLoading(true);
        setSelected(null);
        setMsgDetails(null);
        try {
          const f = MAIL_FOLDERS.find(x => x.id === folder);
          const q = search.trim();
          let url = q
            ? `/me/messages?$search="${encodeURIComponent(q)}"&$select=id,subject,from,receivedDateTime,isRead,bodyPreview,hasAttachments&$top=40`
            : `/me/mailFolders/${f?.wellKnown || folder}/messages?$select=id,subject,from,receivedDateTime,isRead,bodyPreview,hasAttachments&$orderby=receivedDateTime desc&$top=40`;
          const data = await mailFetch(url);
          setMessages(data.value || []);
        } catch (e) {
          showToast(t('em_err_msgs') + e.message);
          setMessages([]);
        } finally {
          setMsgLoading(false);
        }
      }, [search]);

      useEffect(() => {
        if (authed) { loadMessages(activeFolder); loadCounts(); }
      }, [authed, activeFolder]);

      /* Load full message */
      const openMessage = async (msg) => {
        setSelected(msg.id);
        setDetailLoad(true);
        try {
          const full = await mailFetch(`/me/messages/${msg.id}?$select=id,subject,from,toRecipients,receivedDateTime,body,hasAttachments,isRead`);
          setMsgDetails(full);
          if (!msg.isRead) {
            await mailFetch(`/me/messages/${msg.id}`, { method: 'PATCH', body: JSON.stringify({ isRead: true }) });
            setMessages(prev => prev.map(m => m.id === msg.id ? { ...m, isRead: true } : m));
            setFolderCounts(prev => ({ ...prev, [activeFolder]: Math.max(0, (prev[activeFolder] || 1) - 1) }));
          }
        } catch (e) {
          showToast(t('em_err_msg'));
        } finally {
          setDetailLoad(false);
        }
      };

      /* Delete message */
      const deleteMessage = async () => {
        if (!selected) return;
        try {
          await mailFetch(`/me/messages/${selected}`, { method: 'DELETE', headers: { 'Content-Type': undefined } });
          setMessages(prev => prev.filter(m => m.id !== selected));
          setSelected(null);
          setMsgDetails(null);
          showToast(t('em_delete_ok'));
        } catch (e) {
          showToast(t('em_err_delete'));
        }
      };

      const handleSearch = (e) => { e.preventDefault(); loadMessages(activeFolder); };

      /* ── Not signed in ── */
      if (!authed) return (
        <div className="flex flex-col items-center justify-center h-full py-32 gap-6">
          <div className="w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-600 to-sky-500 flex items-center justify-center shadow-2xl shadow-blue-500/30">
            <Ic name="mail" size={36}/>
          </div>
          <div className="text-center">
            <h2 className="text-xl font-bold text-white mb-2">{t('em_sign_in_title')}</h2>
            <p className="text-slate-400 text-sm max-w-xs">{t('em_sign_in_subtitle')}</p>
          </div>
          <button onClick={signIn} disabled={loading}
            className="flex items-center gap-2.5 px-7 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition shadow-lg shadow-blue-500/20 disabled:opacity-60">
            <Ic name="mail" size={16}/>{loading ? t('em_connecting') : t('em_sign_in')}
          </button>
        </div>
      );

      const filteredMessages = messages;

      return (
      <>
        <div className="flex gap-0 h-[calc(100vh-120px)] rounded-2xl overflow-hidden border border-slate-800 bg-slate-900">

          {/* Folders sidebar */}
          <div className="w-52 border-l border-slate-800 flex flex-col shrink-0">
            <div className="px-3 pt-4 pb-2">
              <button onClick={() => { setCompose(true); setReplyTo(null); }}
                className="w-full flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium transition">
                <Ic name="compose" size={14}/> {t('em_compose')}
              </button>
            </div>
            <nav className="flex-1 px-2 py-2 space-y-0.5 overflow-y-auto">
              {MAIL_FOLDERS.map(f => (
                <button key={f.id} onClick={() => setActiveFolder(f.id)}
                  className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm transition-all text-right
                    ${activeFolder === f.id ? 'bg-blue-600/20 text-blue-300 font-medium' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                  <span className={activeFolder === f.id ? 'text-blue-400' : 'text-slate-500'}><Ic name={f.icon} size={14}/></span>
                  <span className="flex-1 text-right">{sl(f,t)}</span>
                  {folderCounts[f.id] > 0 && (
                    <span className="text-[10px] bg-blue-600 text-white rounded-full px-1.5 py-0.5 leading-none">{folderCounts[f.id]}</span>
                  )}
                </button>
              ))}
            </nav>
            <div className="p-3 border-t border-slate-800">
              <button onClick={() => { loadMessages(activeFolder); loadCounts(); }}
                className="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-xs text-slate-500 hover:text-white hover:bg-slate-800 transition">
                <Ic name="repeat2" size={12}/> {t('em_refresh')}
              </button>
            </div>
          </div>

          {/* Message list */}
          <div className="w-72 border-l border-slate-800 flex flex-col shrink-0">
            <div className="px-3 pt-3 pb-2">
              <form onSubmit={handleSearch} className="relative">
                <input value={search} onChange={e => setSearch(e.target.value)}
                  placeholder={t('em_search_ph')} dir="rtl"
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 pr-8 text-xs text-white placeholder-slate-500 outline-none focus:border-blue-500 transition"/>
                <button type="submit" className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition">
                  <Ic name="search" size={13}/>
                </button>
              </form>
            </div>
            <div className="flex-1 overflow-y-auto">
              {msgLoading ? (
                <div className="flex items-center justify-center py-12 text-slate-500 text-sm gap-2">
                  <Ic name="repeat2" size={14}/> {t('em_loading_msgs')}
                </div>
              ) : filteredMessages.length === 0 ? (
                <div className="flex flex-col items-center justify-center py-12 text-slate-600 gap-2">
                  <Ic name="inbox" size={28}/>
                  <p className="text-xs">{t('em_no_msgs')}</p>
                </div>
              ) : filteredMessages.map(msg => {
                const from    = msg.from?.emailAddress;
                const isRead  = msg.isRead;
                const dateStr = msg.receivedDateTime
                  ? new Date(msg.receivedDateTime).toLocaleDateString(lang==='ar'?'ar-SA':'en-US', { month:'short', day:'numeric' })
                  : '';
                return (
                  <button key={msg.id} onClick={() => openMessage(msg)}
                    className={`w-full text-right px-4 py-3 border-b border-slate-800/60 transition-all
                      ${selected === msg.id ? 'bg-blue-600/15 border-r-2 border-r-blue-500' : 'hover:bg-slate-800/50'}
                      ${!isRead ? 'bg-slate-800/30' : ''}`}>
                    <div className="flex items-start justify-between gap-2 mb-1">
