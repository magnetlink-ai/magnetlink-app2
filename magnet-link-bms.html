                      <span className={`text-xs truncate ${isRead ? 'text-slate-400' : 'text-white font-semibold'}`}>
                        {from?.name || from?.address || t('em_unknown')}
                      </span>
                      <span className="text-[10px] text-slate-500 shrink-0">{dateStr}</span>
                    </div>
                    <div className={`text-xs truncate mb-1 ${isRead ? 'text-slate-500' : 'text-slate-300 font-medium'}`}>
                      {msg.subject || t('em_no_subject')}
                    </div>
                    <div className="text-[11px] text-slate-600 truncate">{msg.bodyPreview}</div>
                    <div className="flex items-center gap-1.5 mt-1">
                      {!isRead && <span className="w-1.5 h-1.5 rounded-full bg-blue-500 inline-block"/>}
                      {msg.hasAttachments && <span className="text-slate-500"><Ic name="attach" size={10}/></span>}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Email reader */}
          <div className="flex-1 flex flex-col overflow-hidden">
            {detailLoad ? (
              <div className="flex-1 flex items-center justify-center text-slate-500 gap-2 text-sm">
                <Ic name="repeat2" size={16}/> {t('em_loading')}
              </div>
            ) : (
              <EmailViewer
                email={msgDetails}
                onClose={() => { setSelected(null); setMsgDetails(null); }}
                onReply={() => { setReplyTo(msgDetails); setForwardOf(null); setCompose(true); }}
                onForward={() => { setForwardOf(msgDetails); setReplyTo(null); setCompose(true); }}
                onDelete={deleteMessage}
              />
            )}
          </div>
        </div>

        {compose && (
          <ComposeModal
            replyTo={replyTo}
            forwardOf={forwardOf}
            onClose={() => { setCompose(false); setReplyTo(null); setForwardOf(null); }}
            onSent={() => loadMessages(activeFolder)}
            showToast={showToast}
          />
        )}
      </>
      );
    };

    /* ═══════════════════════════ TEAMS CHAT MODULE ═══════════════════════════ */

    const CHAT_SCOPES = [
      'https://graph.microsoft.com/Chat.ReadWrite',
      'https://graph.microsoft.com/Chat.Create',
    ];

    const getChatToken = async () => {
      const msal = getMsal();
      let account = getMsAccountForUser(_currentBmsUserId);
      if (!account) {
        const res = await msalLoginPopup({ scopes: CHAT_SCOPES });
        saveMsAccountLink(_currentBmsUserId, res.account);
        account = res.account;
      }
      const res = await msal.acquireTokenSilent({ scopes: CHAT_SCOPES, account }).catch(async () =>
        msalAcquireTokenPopup({ scopes: CHAT_SCOPES, account })
      );
      return res.accessToken;
    };

    const chatFetch = async (url, opts = {}) => {
      const token = await getChatToken();
      const res = await fetch(`https://graph.microsoft.com/v1.0${url}`, {
        ...opts,
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
      if (!res.ok) throw new Error(`Chat API ${res.status}: ${await res.text()}`);
      return res.headers.get('content-type')?.includes('json') ? res.json() : res;
    };

    const ChatModule = ({ showToast }) => {
      const { t, lang } = useLang();
      const [authed,       setAuthed]       = useState(false);
      const [signingIn,    setSigningIn]    = useState(false);
      const [myProfile,    setMyProfile]    = useState(null);
      const [chats,        setChats]        = useState([]);
      const [chatsLoading, setChatsLoading] = useState(false);
      const [selected,     setSelected]     = useState(null);
      const [messages,     setMessages]     = useState([]);
      const [msgsLoading,  setMsgsLoading]  = useState(false);
      const [newMsg,       setNewMsg]       = useState('');
      const [sending,      setSending]      = useState(false);
      const [search,       setSearch]       = useState('');
      const [photos,       setPhotos]       = useState({});
      const [memberNames,  setMemberNames]  = useState({});
      const [newChatModal,  setNewChatModal]  = useState(false);
      const [chatType,      setChatType]      = useState('oneOnOne');
      const [newChatEmail,  setNewChatEmail]  = useState('');
      const [groupName,     setGroupName]     = useState('');
      const [groupMembers,  setGroupMembers]  = useState(['']);
      const [newChatMsg,    setNewChatMsg]    = useState('');
      const [creating,      setCreating]      = useState(false);
      const [renaming,      setRenaming]      = useState(false);
      const [renameVal,     setRenameVal]     = useState('');
      const [confirmDel,    setConfirmDel]    = useState(false);
      const messagesEndRef = useRef(null);
      const pollRef        = useRef(null);
      const textareaRef    = useRef(null);

      /* ── Auto-login on mount — wait for background MS auto-link first ── */
      useEffect(() => {
        _msAutoLinkPromise.then(() => {
          const account = getMsAccountForUser(_currentBmsUserId);
          if (account || getMsal().getAllAccounts().length > 0) {
            setSigningIn(true);
            chatFetch('/me?$select=id,displayName,mail')
              .then(me => { setMyProfile(me); setAuthed(true); fetchPhoto(me.id); })
              .catch(() => {})
              .finally(() => setSigningIn(false));
          }
        });
      }, []);

      /* ── Sign in ── */
      const signIn = async () => {
        setSigningIn(true);
        try {
          const me = await chatFetch('/me?$select=id,displayName,mail');
          setMyProfile(me);
          setAuthed(true);
          fetchPhoto(me.id);
        } catch(e) { showToast(t('chat_err_login') + e.message); }
        finally { setSigningIn(false); }
      };

      /* ── Fetch user photo (cached) ── */
      const fetchPhoto = useCallback(async (userId) => {
        if (!userId) return;
        setPhotos(prev => { if (prev[userId] !== undefined) return prev; return { ...prev, [userId]: null }; });
        try {
          const token = await getChatToken();
          const res = await fetch(`https://graph.microsoft.com/v1.0/users/${userId}/photo/$value`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) {
            const blob = await res.blob();
            const url  = URL.createObjectURL(blob);
            setPhotos(prev => ({ ...prev, [userId]: url }));
          }
        } catch(_) {}
      }, []);

      /* ── Resolve display name from members ── */
      const resolveName = useCallback((userId, fallback) => {
        return memberNames[userId] || fallback || userId?.slice(0,8) || '—';
      }, [memberNames]);

      /* ── Load chats ── */
      const loadChats = useCallback(async () => {
        setChatsLoading(true);
        try {
          const data = await chatFetch('/me/chats?$expand=members&$top=50');
          const sorted = (data.value || []).sort((a, b) =>
            new Date(b.lastUpdatedDateTime || 0) - new Date(a.lastUpdatedDateTime || 0)
          );
          sorted.forEach(chat => {
            (chat.members || []).forEach(m => {
              if (m.userId && m.displayName)
                setMemberNames(prev => prev[m.userId] ? prev : { ...prev, [m.userId]: m.displayName });
              if (m.userId) fetchPhoto(m.userId);
            });
          });
          setChats(sorted);
        } catch(e) { showToast(t('chat_err_chats') + (e.message||'').slice(0,60)); }
        finally { setChatsLoading(false); }
      }, [fetchPhoto]);

      useEffect(() => { if (authed) loadChats(); }, [authed]);

      /* ── Load messages ── */
      const loadMessages = useCallback(async (chatId, silent = false) => {
        if (!silent) setMsgsLoading(true);
        try {
          const data = await chatFetch(`/me/chats/${chatId}/messages?$top=50&$orderby=createdDateTime desc`);
          const msgs = (data.value || []).filter(m => m.messageType === 'message').reverse();
          setMessages(msgs);
          /* fetch photos + cache names for new senders */
          msgs.forEach(m => {
            const uid  = m.from?.user?.id;
            const name = m.from?.user?.displayName;
            if (!uid) return;
            if (name) setMemberNames(prev => prev[uid] ? prev : { ...prev, [uid]: name });
            fetchPhoto(uid);
          });
        } catch(e) { if (!silent) showToast(t('chat_err_msgs')); }
        finally { setMsgsLoading(false); }
      }, [fetchPhoto]);

      useEffect(() => {
        if (!selected) return;
        loadMessages(selected.id);
        pollRef.current = setInterval(() => loadMessages(selected.id, true), 5000);
        /* load members names + photos */
        (selected.members || []).forEach(m => {
          if (!m.userId) return;
          if (m.displayName) setMemberNames(prev => ({ ...prev, [m.userId]: m.displayName }));
          fetchPhoto(m.userId);
        });
        return () => clearInterval(pollRef.current);
      }, [selected?.id]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      /* ── Send message ── */
      const sendMessage = async () => {
        if (!newMsg.trim() || !selected || sending) return;
        const text = newMsg.trim();
        setNewMsg('');
        setSending(true);
        try {
          await chatFetch(`/me/chats/${selected.id}/messages`, {
            method: 'POST',
            body: JSON.stringify({ body: { content: text, contentType: 'text' } }),
          });
          await loadMessages(selected.id, true);
        } catch(e) { showToast(t('chat_err_send')); setNewMsg(text); }
        finally { setSending(false); }
      };

      /* ── Rename group chat ── */
      const renameChat = async () => {
        if (!renameVal.trim() || !selected) return;
        try {
          await chatFetch(`/chats/${selected.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ topic: renameVal.trim() }),
          });
          setSelected(prev => ({ ...prev, topic: renameVal.trim() }));
          setChats(prev => prev.map(c => c.id === selected.id ? { ...c, topic: renameVal.trim() } : c));
          setRenaming(false);
          showToast(t('chat_rename_ok'));
        } catch(e) { showToast(t('chat_rename_err') + e.message.slice(0,80)); }
      };

      /* ── Leave / delete chat ── */
      const leaveChat = async () => {
        if (!selected || !myProfile) return;
        const me = (selected.members || []).find(m => m.userId === myProfile.id);
        if (!me) return;
        try {
          await chatFetch(`/chats/${selected.id}/members/${me.id}`, { method: 'DELETE' });
          setChats(prev => prev.filter(c => c.id !== selected.id));
          setSelected(null);
          setMessages([]);
          setConfirmDel(false);
          showToast(t('chat_leave_ok'));
        } catch(e) { showToast(t('chat_leave_err') + e.message.slice(0,80)); setConfirmDel(false); }
      };

      /* ── Create chat (1-on-1 or group) ── */
      const createChat = async () => {
        if (!myProfile?.id) return;
        if (chatType === 'oneOnOne' && !newChatEmail.trim()) return;
        if (chatType === 'group' && (!groupName.trim() || groupMembers.every(m => !m.trim()))) return;
        setCreating(true);
        try {
          let body;
          if (chatType === 'oneOnOne') {
            body = {
              chatType: 'oneOnOne',
              members: [
                { '@odata.type':'#microsoft.graph.aadUserConversationMember', roles:['owner'], 'user@odata.bind':`https://graph.microsoft.com/v1.0/users/${myProfile.id}` },
                { '@odata.type':'#microsoft.graph.aadUserConversationMember', roles:['owner'], 'user@odata.bind':`https://graph.microsoft.com/v1.0/users/${newChatEmail.trim()}` },
              ],
            };
          } else {
            const validMembers = groupMembers.map(m => m.trim()).filter(Boolean);
            body = {
              chatType: 'group',
              topic: groupName.trim(),
              members: [
                { '@odata.type':'#microsoft.graph.aadUserConversationMember', roles:['owner'], 'user@odata.bind':`https://graph.microsoft.com/v1.0/users/${myProfile.id}` },
                ...validMembers.map(upn => ({
                  '@odata.type':'#microsoft.graph.aadUserConversationMember',
                  roles: ['owner'],
                  'user@odata.bind': `https://graph.microsoft.com/v1.0/users/${upn}`,
                })),
              ],
            };
          }
          const chat = await chatFetch('/chats', { method:'POST', body: JSON.stringify(body) });
          if (newChatMsg.trim()) {
            await chatFetch(`/me/chats/${chat.id}/messages`, {
              method: 'POST',
              body: JSON.stringify({ body: { content: newChatMsg.trim(), contentType: 'text' } }),
            });
          }
          showToast(t('chat_created'));
          setNewChatModal(false); setNewChatEmail(''); setGroupName(''); setGroupMembers(['']); setNewChatMsg('');
          await loadChats();
          /* Fetch full chat with members so getChatName works immediately */
          try {
            const full = await chatFetch(`/chats/${chat.id}?$expand=members`);
            (full.members || []).forEach(m => {
              if (m.userId && m.displayName)
                setMemberNames(prev => ({ ...prev, [m.userId]: m.displayName }));
              if (m.userId) fetchPhoto(m.userId);
            });
            setSelected(full);
          } catch(_) { setSelected(chat); }
        } catch(e) {
          const msg = e.message || '';
          if (msg.includes('404')) showToast(t('chat_err_not_found'));
          else if (msg.includes('403')) showToast(t('chat_err_perm'));
          else showToast(t('chat_err_create') + msg.slice(0,150));
        }
        finally { setCreating(false); }
      };

      /* ── Helpers ── */
      const getMemberLabel = (m) =>
        m?.displayName || memberNames[m?.userId] || m?.email || null;

      const getChatName = (chat) => {
        if (chat.topic) return chat.topic;
        const others = (chat.members || []).filter(m => m.userId !== myProfile?.id);
        if (chat.chatType === 'oneOnOne') {
          const other = others[0];
          if (!other) return t('chat_private_label');
          return getMemberLabel(other) || other.userId?.slice(0,8) || t('chat_private_label');
        }
        const names = others.map(getMemberLabel).filter(Boolean);
        return names.length ? names.join(', ') : t('chat_group_label');
      };

      const getChatSubtitle = (chat) => {
        if (chat.chatType === 'oneOnOne') {
          const other = (chat.members || []).find(m => m.userId !== myProfile?.id);
          const email = other?.email || '';
          return email || t('chat_private_label');
        }
        return `${(chat.members || []).length} ${t('chat_members_count')}`;
      };

      const getChatColor = (chat) => {
        const colors = ['from-blue-600 to-purple-700','from-blue-600 to-blue-700','from-emerald-600 to-teal-700','from-rose-600 to-pink-700','from-amber-600 to-orange-700'];
        const i = (getChatName(chat).charCodeAt(0) || 0) % colors.length;
        return colors[i];
      };

      const fmtTime = (iso) => {
        if (!iso) return '';
        const d = new Date(iso), now = new Date();
        const locale = lang==='ar'?'ar-SA':'en-US';
        if (d.toDateString() === now.toDateString())
          return d.toLocaleTimeString(locale, { hour:'2-digit', minute:'2-digit' });
        return d.toLocaleDateString(locale, { month:'short', day:'numeric' });
      };

      const isMe = (msg) => msg.from?.user?.id === myProfile?.id;

      const filteredChats = search.trim()
        ? chats.filter(c => getChatName(c).toLowerCase().includes(search.toLowerCase()))
        : chats;

      /* ── Not signed in ── */
      if (!authed) return (
        <div className="flex flex-col items-center justify-center h-full py-32 gap-6">
          <div className="w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-600 to-blue-600 flex items-center justify-center shadow-2xl shadow-blue-500/30">
            <Ic name="chat" size={36}/>
          </div>
          <div className="text-center">
            <h2 className="text-xl font-bold text-white mb-2">{t('chat_title')}</h2>
            <p className="text-slate-400 text-sm max-w-xs">{t('chat_sign_in_desc')}</p>
          </div>
          <button onClick={signIn} disabled={signingIn}
            className="flex items-center gap-2.5 px-7 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition shadow-lg shadow-blue-500/20 disabled:opacity-60">
            <Ic name="chat" size={16}/>{signingIn ? t('chat_connecting') : t('chat_sign_in')}
          </button>
        </div>
      );

      return (
        <>
        <div className="flex gap-0 h-[calc(100vh-120px)] rounded-2xl overflow-hidden border border-slate-800 bg-slate-900">

          {/* ── Chats list ── */}
          <div className="w-72 border-l border-slate-800 flex flex-col shrink-0">
            <div className="px-3 pt-3 pb-2.5 border-b border-slate-800 space-y-2">
              <div className="flex items-center justify-between">
                <span className="text-white font-semibold text-sm">{t('chat_convs')}</span>
                <button onClick={() => setNewChatModal(true)}
                  className="flex items-center gap-1 text-xs text-blue-400 hover:text-blue-300 bg-blue-500/10 hover:bg-blue-500/20 px-2.5 py-1 rounded-lg transition">
                  <Ic name="plus" size={11}/> {t('chat_new')}
                </button>
              </div>
              <input value={search} onChange={e => setSearch(e.target.value)}
                placeholder={t('chat_search_ph')} dir="rtl"
                className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white placeholder-slate-500 outline-none focus:border-blue-500 transition"/>
            </div>

            <div className="flex-1 overflow-y-auto">
              {chatsLoading ? (
                <div className="flex items-center justify-center py-12 text-slate-500 text-sm gap-2">
                  <Ic name="repeat2" size={14}/> {t('chat_loading')}
                </div>
              ) : filteredChats.length === 0 ? (
                <div className="flex flex-col items-center justify-center py-16 text-slate-600 gap-2">
                  <Ic name="chat" size={28}/>
                  <p className="text-xs">{t('chat_no_convs')}</p>
                </div>
              ) : filteredChats.map(chat => {
                const otherM  = chat.chatType === 'oneOnOne' ? (chat.members||[]).find(m => m.userId !== myProfile?.id) : null;
                const oPh     = otherM ? photos[otherM.userId] : null;
                const cName   = getChatName(chat);
                return (
                  <button key={chat.id} onClick={() => setSelected(chat)}
                    className={`w-full text-right px-3 py-3 border-b border-slate-800/50 flex gap-3 items-center hover:bg-slate-800/40 transition-all
                      ${selected?.id === chat.id ? 'bg-blue-600/10 border-r-2 border-r-blue-500' : ''}`}>
                    {oPh
                      ? <img src={oPh} alt={cName} className="w-9 h-9 rounded-xl object-cover shrink-0 ring-1 ring-slate-700"/>
                      : <div className={`w-9 h-9 rounded-xl bg-gradient-to-br ${getChatColor(chat)} flex items-center justify-center text-sm font-bold text-white shrink-0`}>
                          {cName.charAt(0).toUpperCase()}
                        </div>
                    }
                    <div className="flex-1 min-w-0">
                      <div className="text-xs font-medium text-white truncate">{cName}</div>
                      <div className="text-[10px] text-slate-500 mt-0.5">
                        {chat.chatType === 'oneOnOne' ? (otherM?.email || t('chat_private_label')) : `${(chat.members||[]).length} ${t('chat_members_count')}`}
                      </div>
                    </div>
                    {chat.lastUpdatedDateTime && (
                      <span className="text-[10px] text-slate-600 shrink-0">{fmtTime(chat.lastUpdatedDateTime)}</span>
                    )}
                  </button>
                );
              })}
            </div>

            <div className="p-3 border-t border-slate-800">
              <button onClick={loadChats}
                className="w-full flex items-center justify-center gap-1.5 py-1.5 text-xs text-slate-500 hover:text-white hover:bg-slate-800 rounded-lg transition">
                <Ic name="repeat2" size={12}/> {t('chat_refresh')}
              </button>
            </div>
          </div>

          {/* ── Messages panel ── */}
          <div className="flex-1 flex flex-col overflow-hidden">
            {!selected ? (
              <div className="flex-1 flex flex-col items-center justify-center text-slate-600 gap-3">
                <Ic name="chat" size={44}/>
                <p className="text-sm">{t('chat_select')}</p>
                <button onClick={() => setNewChatModal(true)}
                  className="mt-2 flex items-center gap-2 px-4 py-2 rounded-xl bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 text-sm transition">
                  <Ic name="plus" size={13}/> {t('chat_new_conv')}
                </button>
              </div>
            ) : (
              <>
                {/* Header */}
                {(() => {
                  const isGroup     = selected.chatType === 'group';
                  const otherMember = !isGroup ? (selected.members||[]).find(m => m.userId !== myProfile?.id) : null;
                  const otherPhoto  = otherMember ? photos[otherMember.userId] : null;
                  const chatName    = getChatName(selected);
                  return (
                    <div className="px-5 py-3 border-b border-slate-800 flex items-center gap-2 shrink-0">
                      {otherPhoto
                        ? <img src={otherPhoto} alt={chatName} className="w-9 h-9 rounded-xl object-cover shrink-0 ring-1 ring-slate-700"/>
                        : <div className={`w-9 h-9 rounded-xl bg-gradient-to-br ${getChatColor(selected)} flex items-center justify-center text-sm font-bold text-white shrink-0`}>
                            {chatName.charAt(0).toUpperCase()}
                          </div>
                      }
                      <div className="flex-1 min-w-0">
                        {renaming && isGroup ? (
                          <div className="flex items-center gap-1.5">
                            <input autoFocus value={renameVal} onChange={e => setRenameVal(e.target.value)}
                              onKeyDown={e => { if(e.key==='Enter') renameChat(); if(e.key==='Escape') setRenaming(false); }}
                              className="flex-1 bg-slate-800 border border-blue-500 rounded-lg px-2 py-0.5 text-sm text-white outline-none min-w-0"/>
                            <button onClick={renameChat} className="text-xs text-blue-400 hover:text-blue-300 px-2 py-0.5 rounded bg-blue-500/20 hover:bg-blue-500/30 transition whitespace-nowrap">{t('chat_rename_save')}</button>
                            <button onClick={() => setRenaming(false)} className="text-xs text-slate-500 hover:text-white px-1.5 py-0.5 rounded hover:bg-slate-800 transition">×</button>
                          </div>
                        ) : (
                          <>
                            <div className="text-white font-semibold text-sm truncate">{chatName}</div>
                            <div className="text-[10px] text-slate-500 truncate">{getChatSubtitle(selected)}</div>
                          </>
                        )}
                      </div>
                      {isGroup && !renaming && (
                        <button onClick={() => { setRenameVal(selected.topic || chatName); setRenaming(true); }}
                          className="text-slate-500 hover:text-blue-400 p-1.5 rounded-lg hover:bg-slate-800 transition" title={t('chat_rename')}>
                          <Ic name="edit2" size={13}/>
                        </button>
                      )}
                      <button onClick={() => loadMessages(selected.id)}
                        className="text-slate-500 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition" title={t('chat_refresh')}>
                        <Ic name="repeat2" size={14}/>
                      </button>
                      <button onClick={() => setConfirmDel(true)}
                        className="text-slate-500 hover:text-red-400 p-1.5 rounded-lg hover:bg-red-500/10 transition" title={t('chat_leave')}>
                        <Ic name="trash" size={13}/>
                      </button>
                    </div>
                  );
                })()}

                {/* Confirm leave dialog */}
                {confirmDel && (
                  <div className="px-5 py-2.5 bg-red-500/10 border-b border-red-500/20 flex items-center gap-3">
                    <span className="text-xs text-red-300 flex-1">{t('chat_leave_confirm')}</span>
                    <button onClick={leaveChat} className="text-xs bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg transition">{t('chat_leave')}</button>
                    <button onClick={() => setConfirmDel(false)} className="text-xs text-slate-400 hover:text-white px-2 py-1 rounded-lg hover:bg-slate-800 transition">{t('cancel')}</button>
                  </div>
                )}

                {/* Messages */}
                <div className="flex-1 overflow-y-auto px-5 py-5 space-y-4" dir="ltr">
                  {msgsLoading ? (
                    <div className="flex items-center justify-center py-12 text-slate-500 gap-2 text-sm">
                      <Ic name="repeat2" size={14}/> {t('chat_loading')}
                    </div>
                  ) : messages.length === 0 ? (
                    <div className="flex flex-col items-center justify-center py-16 text-slate-600 gap-2">
                      <Ic name="chat" size={28}/>
                      <p className="text-xs">{t('chat_no_msgs')}</p>
                    </div>
                  ) : messages.map((msg) => {
                    const mine    = isMe(msg);
                    const uid     = msg.from?.user?.id;
                    const sender  = resolveName(uid, msg.from?.user?.displayName);
                    const photo   = uid ? photos[uid] : null;
                    const content = msg.body?.content?.replace(/<[^>]*>/g,'').trim() || '';
                    if (!content) return null;
                    return (
                      <div key={msg.id} className={`flex gap-2.5 ${mine ? 'flex-row-reverse' : 'flex-row'}`}>
                        {/* Avatar */}
                        {!mine && (
                          photo
                            ? <img src={photo} alt={sender}
                                className="w-8 h-8 rounded-xl object-cover shrink-0 mt-1 ring-1 ring-slate-700"/>
                            : <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-slate-600 to-slate-700 flex items-center justify-center text-xs font-bold text-white shrink-0 mt-1">
                                {sender.charAt(0).toUpperCase()}
                              </div>
                        )}
                        {mine && (
                          photos[myProfile?.id]
                            ? <img src={photos[myProfile.id]} alt="أنت"
                                className="w-8 h-8 rounded-xl object-cover shrink-0 mt-1 ring-1 ring-blue-500/40"/>
                            : <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-600 to-purple-700 flex items-center justify-center text-xs font-bold text-white shrink-0 mt-1">
                                {(myProfile?.displayName||'أ').charAt(0).toUpperCase()}
                              </div>
                        )}
                        <div className={`flex flex-col gap-0.5 max-w-[60%] ${mine ? 'items-end' : 'items-start'}`}>
                          <span className={`text-[10px] px-1 ${mine ? 'text-blue-400' : 'text-slate-500'}`}>
                            {mine ? t('chat_you') : sender}
                          </span>
                          <div className={`px-4 py-2.5 rounded-2xl text-sm leading-relaxed break-words
                            ${mine ? 'bg-blue-600 text-white rounded-tr-sm' : 'bg-slate-800 text-slate-200 rounded-tl-sm'}`}
                            dir="rtl">
                            {content}
                          </div>
                          <span className="text-[10px] text-slate-600 px-1">{fmtTime(msg.createdDateTime)}</span>
                        </div>
                      </div>
                    );
                  })}
                  <div ref={messagesEndRef}/>
                </div>

                {/* Input */}
                <div className="px-4 py-3 border-t border-slate-800 shrink-0">
                  <div className="flex gap-2 items-end">
                    <textarea ref={textareaRef} value={newMsg}
                      onChange={e => setNewMsg(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
                      placeholder={t('chat_type_ph')} dir="rtl" rows={1}
                      className="flex-1 bg-slate-800 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition resize-none"
                      style={{ minHeight:44, maxHeight:120 }}/>
                    <button onClick={sendMessage} disabled={sending || !newMsg.trim()}
                      className="w-10 h-10 rounded-xl bg-blue-600 hover:bg-blue-500 flex items-center justify-center text-white transition disabled:opacity-40 shrink-0">
                      <Ic name="send" size={15}/>
                    </button>
                  </div>
                  <p className="text-[10px] text-slate-600 mt-1.5 text-right">{t('chat_enter_hint')}</p>
                </div>
              </>
            )}
          </div>
        </div>

        {/* ── New Chat Modal ── */}
        {newChatModal && (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
            onClick={() => { setNewChatModal(false); setChatType('oneOnOne'); setNewChatEmail(''); setGroupName(''); setGroupMembers(['']); setNewChatMsg(''); }}>
            <div className="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl" onClick={e => e.stopPropagation()} dir="rtl">

              {/* Header */}
              <div className="flex items-center justify-between px-5 py-4 border-b border-slate-800">
                <span className="text-white font-semibold text-sm flex items-center gap-2"><Ic name="chat" size={14}/> {t('chat_new_chat')}</span>
                <button onClick={() => { setNewChatModal(false); setChatType('oneOnOne'); }}
                  className="text-slate-500 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition"><Ic name="x" size={15}/></button>
              </div>

              <div className="px-5 py-4 space-y-4">
                {/* Type selector */}
                <div className="grid grid-cols-2 gap-2">
                  {[
                    { id:'oneOnOne', labelKey:'chat_private',    descKey:'chat_private_desc', icon:'client'     },
                    { id:'group',    labelKey:'chat_group_label', descKey:'chat_group_desc',   icon:'chat_group' },
                  ].map(ct => (
                    <button key={ct.id} onClick={() => setChatType(ct.id)}
                      className={`flex flex-col items-center gap-1.5 px-3 py-3 rounded-xl border text-center transition-all
                        ${chatType === ct.id ? 'border-blue-500 bg-blue-500/10 text-blue-300' : 'border-slate-700 bg-slate-800/50 text-slate-400 hover:border-slate-600'}`}>
                      <span className={chatType === ct.id ? 'text-blue-400' : 'text-slate-500'}><Ic name={ct.icon} size={18}/></span>
                      <span className="text-xs font-semibold">{t(ct.labelKey)}</span>
                      <span className="text-[10px] text-slate-500">{t(ct.descKey)}</span>
                    </button>
                  ))}
                </div>

                {/* 1-on-1 fields */}
                {chatType === 'oneOnOne' && (
                  <div>
                    <label className="text-xs text-slate-400 mb-1.5 block">{t('chat_email_label')}</label>
                    <input value={newChatEmail} onChange={e => setNewChatEmail(e.target.value)}
                      placeholder="name@company.com" dir="ltr"
                      className="w-full bg-slate-800 border border-slate-700 focus:border-blue-500 rounded-xl px-3 py-2.5 text-sm text-white outline-none transition"/>
                  </div>
                )}

                {/* Group fields */}
                {chatType === 'group' && (
                  <>
                    <div>
                      <label className="text-xs text-slate-400 mb-1.5 block">{t('chat_group_name')}</label>
                      <input value={groupName} onChange={e => setGroupName(e.target.value)}
                        placeholder={t('chat_group_name_ph')}
                        className="w-full bg-slate-800 border border-slate-700 focus:border-blue-500 rounded-xl px-3 py-2.5 text-sm text-white outline-none transition"/>
                    </div>
                    <div>
                      <div className="flex items-center justify-between mb-1.5">
                        <label className="text-xs text-slate-400">{t('chat_members')}</label>
                        <button onClick={() => setGroupMembers(p => [...p, ''])}
                          className="text-[11px] text-blue-400 hover:text-blue-300 flex items-center gap-1 transition">
                          <Ic name="plus" size={10}/> {t('chat_add_member')}
                        </button>
                      </div>
                      <div className="space-y-2 max-h-36 overflow-y-auto">
                        {groupMembers.map((m, i) => (
                          <div key={i} className="flex gap-2">
                            <input value={m} onChange={e => setGroupMembers(p => p.map((x,j) => j===i ? e.target.value : x))}
                              placeholder={`${t('chat_member_ph')} ${i+1} — email@company.com`} dir="ltr"
                              className="flex-1 bg-slate-800 border border-slate-700 focus:border-blue-500 rounded-xl px-3 py-2 text-sm text-white outline-none transition"/>
                            {groupMembers.length > 1 && (
                              <button onClick={() => setGroupMembers(p => p.filter((_,j) => j!==i))}
                                className="text-slate-600 hover:text-rose-400 p-2 rounded-lg hover:bg-rose-500/10 transition">
                                <Ic name="x" size={12}/>
                              </button>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  </>
                )}

                {/* First message */}
                <div>
                  <label className="text-xs text-slate-400 mb-1.5 block">{t('chat_first_msg')}</label>
                  <textarea value={newChatMsg} onChange={e => setNewChatMsg(e.target.value)}
                    placeholder={t('chat_first_msg_ph')} rows={2}
                    className="w-full bg-slate-800 border border-slate-700 focus:border-blue-500 rounded-xl px-3 py-2.5 text-sm text-white outline-none transition resize-none"/>
                </div>
              </div>

              {/* Footer */}
              <div className="px-5 py-3 border-t border-slate-800 flex gap-2 justify-end">
                <button onClick={() => { setNewChatModal(false); setChatType('oneOnOne'); }}
                  className="px-4 py-2 text-sm text-slate-400 hover:bg-slate-800 rounded-lg transition">{t('cancel')}</button>
                <button onClick={createChat} disabled={creating ||
                    (chatType==='oneOnOne' && !newChatEmail.trim()) ||
                    (chatType==='group' && (!groupName.trim() || groupMembers.every(m=>!m.trim())))}
                  className="flex items-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition disabled:opacity-50">
                  <Ic name={chatType==='group'?'chat_group':'chat'} size={13}/>
                  {creating ? t('chat_creating') : t('chat_create')}
                </button>
              </div>
            </div>
          </div>
        )}
        </>
      );
    };

    /* ═══════════════════════════ ANNOUNCEMENT BAR ═══════════════════════════ */

    const AnnouncementBar = ({ ann, onDismiss }) => {
      const { t, lang } = useLang();
      if (!ann) return null;
      const locale = lang==='ar'?'ar-SA':'en-US';
      return (
        <div className="w-full bg-red-600 text-white text-sm flex items-center gap-3 px-5 py-2.5 shrink-0 z-50" dir="rtl">
          <Ic name="announce" size={15}/>
          <span className="flex-1 font-medium leading-snug">{ann.text}</span>
          <span className="text-red-200 text-xs shrink-0 hidden sm:block">
            {ann.createdBy?.name} · {new Date(ann.createdAt).toLocaleDateString(locale,{month:'short',day:'numeric'})} {new Date(ann.createdAt).toLocaleTimeString(locale,{hour:'2-digit',minute:'2-digit'})}
          </span>
          <button onClick={onDismiss} className="text-red-200 hover:text-white p-0.5 rounded transition shrink-0" title={t('hide')}>
            <Ic name="x" size={14}/>
          </button>
        </div>
      );
    };

    /* ═══════════════════════════ ANNOUNCEMENTS MODULE ═══════════════════════════ */

    const AnnouncementsModule = ({ announcements, currentUser, onAdd, onDeactivate, onDelete, showToast }) => {
      const { t, lang } = useLang();
      const canManage = ['super_admin','admin'].includes(currentUser?.role);
      const [text, setText] = useState('');
      const [hours, setHours] = useState('24');

      const fmtDate = (iso) => {
        const d = new Date(iso);
        const locale = lang==='ar'?'ar-SA':'en-US';
        return d.toLocaleDateString(locale,{year:'numeric',month:'short',day:'numeric'}) + ' — ' +
               d.toLocaleTimeString(locale,{hour:'2-digit',minute:'2-digit'});
      };

      const isExpired = (a) => {
        if (!a.durationHours) return false;
        return new Date(a.createdAt).getTime() + a.durationHours * 3600000 <= Date.now();
      };

      const submit = () => {
        if (!text.trim()) return;
        onAdd(text.trim(), hours);
        setText('');
        showToast(t('ann_published_toast'));
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6 py-2" dir="rtl">
          <div className="flex items-center gap-3 mb-2">
            <div className="w-10 h-10 rounded-xl bg-red-600/20 flex items-center justify-center text-red-400">
              <Ic name="announce" size={20}/>
            </div>
            <div>
              <h2 className="text-white font-bold text-lg">{t('ann_title')}</h2>
              <p className="text-slate-500 text-xs">{t('ann_subtitle')}</p>
            </div>
          </div>

          {/* Create form — admins only */}
          {canManage && (
            <div className="bg-slate-900 border border-red-500/30 rounded-2xl p-5 space-y-4">
              <h3 className="text-red-400 font-semibold text-sm flex items-center gap-2">
                <Ic name="announce" size={14}/> {t('ann_new')}
              </h3>
              <textarea value={text} onChange={e => setText(e.target.value)}
                placeholder={t('ann_ph')}
                rows={3}
                className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none focus:border-red-500 transition resize-none"/>
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 flex-1">
                  <span className="text-slate-400 text-xs shrink-0">{t('ann_duration')}:</span>
                  <select value={hours} onChange={e => setHours(e.target.value)}
                    className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white outline-none focus:border-red-500 transition">
                    <option value="1">{t('ann_d_1h')}</option>
                    <option value="6">{t('ann_d_6h')}</option>
                    <option value="12">{t('ann_d_12h')}</option>
                    <option value="24">{t('ann_d_1d')}</option>
                    <option value="72">{t('ann_d_3d')}</option>
                    <option value="168">{t('ann_d_1w')}</option>
                    <option value="0">{t('ann_d_forever')}</option>
                  </select>
                </div>
                <button onClick={submit} disabled={!text.trim()}
                  className="flex items-center gap-2 px-5 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-sm font-semibold transition disabled:opacity-50 shrink-0">
                  <Ic name="announce" size={13}/> {t('ann_publish')}
                </button>
              </div>
            </div>
          )}

          {/* Announcements list */}
          <div className="space-y-3">
            {announcements.length === 0 ? (
              <div className="flex flex-col items-center justify-center py-20 text-slate-600 gap-3">
                <Ic name="announce" size={36}/>
                <p className="text-sm">{t('ann_empty')}</p>
              </div>
            ) : announcements.map(a => {
              const expired = isExpired(a);
              const status  = !a.active ? t('ann_st_cancelled') : expired ? t('ann_st_expired') : t('ann_st_active');
              const statusColor = !a.active ? 'text-slate-500 bg-slate-800' : expired ? 'text-amber-400 bg-amber-500/10' : 'text-emerald-400 bg-emerald-500/10';
              return (
                <div key={a.id} className={`bg-slate-900 border rounded-2xl p-4 space-y-3 ${(!a.active||expired) ? 'border-slate-800 opacity-70' : 'border-red-500/30'}`}>
                  <div className="flex items-start gap-3">
                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 ${(!a.active||expired) ? 'bg-slate-800 text-slate-500' : 'bg-red-600/20 text-red-400'}`}>
                      <Ic name="announce" size={14}/>
                    </div>
                    <div className="flex-1 min-w-0">
                      <p className="text-white text-sm leading-relaxed">{a.text}</p>
                    </div>
                    <span className={`text-[10px] font-medium px-2 py-0.5 rounded-full shrink-0 ${statusColor}`}>{status}</span>
                  </div>
                  <div className="flex items-center justify-between pt-1 border-t border-slate-800">
                    <div className="flex items-center gap-3 text-[11px] text-slate-500">
                      <span>{a.createdBy?.name}</span>
                      <span>·</span>
                      <span>{fmtDate(a.createdAt)}</span>
                      {a.durationHours > 0 && <span>· {a.durationHours < 24 ? a.durationHours+t('ann_hrs') : Math.round(a.durationHours/24)+t('ann_days')}</span>}
                    </div>
                    {canManage && (
                      <div className="flex items-center gap-1">
                        {a.active && !expired && (
                          <button onClick={() => onDeactivate(a.id)}
                            className="text-xs text-amber-500 hover:text-amber-400 px-2 py-0.5 rounded hover:bg-amber-500/10 transition">{t('cancel')}</button>
                        )}
                        <button onClick={() => onDelete(a.id)}
                          className="p-1 text-slate-600 hover:text-red-400 hover:bg-red-500/10 rounded transition">
                          <Ic name="trash" size={12}/>
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    /* ═══════════════════════════ APP ═══════════════════════════ */

    const App = () => {
      const [currentUser,  setCurrentUser] = useState(null);
      const [showProfile,  setShowProfile] = useState(false);
      const [page,         setPage]        = useState(() => localStorage.getItem('bms_page') || 'dashboard');
      const [leads,        setLeads]       = useState([]);
      const [clients,      setClients]     = useState([]);
      const [projects,     setProjects]    = useState([]);
      const [invoices,     setInvoices]    = useState([]);
      const [teamMembers,  setTeamMembers] = useState([]);
      const [teamClients,  setTeamClients] = useState([]);
      const [expenses,     setExpenses]    = useState([]);
      const [salaries,     setSalaries]    = useState([]);
      const [designAssets, setDesignAssets]= useState([]);
      const [clientAssets, setClientAssets]= useState([]);
      const [dcDocuments,  setDcDocuments] = useState([]);
      const [smStats,      setSmStats]     = useState(INITIAL_SM_STATS);
      const [smPosts,      setSmPosts]     = useState(INITIAL_SM_POSTS);
      const [smMessages,   setSmMessages]  = useState(INITIAL_SM_MESSAGES);
      const [smAccounts,   setSmAccounts]  = useState(INITIAL_SM_ACCOUNTS);
      const [adsData,      setAdsData]     = useState(INITIAL_ADS_DATA);
      const [taskDepts,    setTaskDepts]     = useState([]);
      const [taskBuckets,  setTaskBuckets]   = useState([]);
      const [taskTasks,    setTaskTasks]     = useState([]);
      const [webData,      setWebData]       = useState(INITIAL_WEB_DATA);
      const [customRoles,  setCustomRoles]   = useState([]);
      const [dashShortcuts, setDashShortcuts] = useState([]);
      const [attendance,   setAttendance]    = useState([]);
      const [offDays,      setOffDays]       = useState([]);
      const [deductions,   setDeductions]    = useState([]);
      const [bonuses,      setBonuses]       = useState([]);
      const [dbLoaded,     setDbLoaded]      = useState(!_sbReady);
      const [toast,        setToast]         = useState(null);
      const [theme,        setTheme]         = useState('dark');
      const [lang,         setLang]          = useState('ar');

      useEffect(() => {
        const p = JSON.parse(localStorage.getItem('bms_passwords') || '{}');
        if (!p['owner@magnetlink.com']) {
          p['owner@magnetlink.com'] = 'owner1234';
          localStorage.setItem('bms_passwords', JSON.stringify(p));
        }
      }, []);

      useEffect(() => {
        document.body.setAttribute('data-theme', theme);
      }, [theme]);

      useEffect(() => {
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        document.documentElement.setAttribute('lang', lang);
      }, [lang]);

      /* ── Supabase: load all data on mount ── */
      useEffect(() => {
        if (!_sbReady) {
          setLeads(INITIAL_LEADS);
          setClients(INITIAL_CLIENTS);
          setProjects(INITIAL_PROJECTS);
          setInvoices(INITIAL_INVOICES);
          setExpenses(INITIAL_EXPENSES);
          setTeamMembers(INITIAL_TEAM);
          setTeamClients(INITIAL_TEAM_CLIENTS);
          setCustomRoles(INITIAL_CUSTOM_ROLES);
          setTaskDepts(INITIAL_TASK_DEPTS);
          setTaskBuckets(INITIAL_TASK_BUCKETS);
          setTaskTasks(INITIAL_TASK_TASKS);
          setDbLoaded(true);
          return;
        }
        (async () => {
          try {
            const [
              lds, cls, prj, inv, exp, sal, att, ofd, ded, bon,
              tm,  tc,  cr,  td,  tb,  tt,  da,  ca,  doc, pwds
            ] = await Promise.all([
              db.load('leads'),        db.load('clients'),       db.load('projects'),
              db.load('invoices'),     db.load('expenses'),      db.load('salaries'),
              db.load('attendance'),   db.load('off_days'),      db.load('deductions'),
              db.load('bonuses'),      db.load('team_members'),  db.load('team_clients'),
              db.load('custom_roles'), db.load('task_depts'),    db.load('task_buckets'),
              db.load('task_tasks'),   db.load('design_assets'), db.load('client_assets'),
              db.load('documents'),    db.load('user_passwords'),
            ]);
            if (pwds.length) {
              const ps = JSON.parse(localStorage.getItem('bms_passwords')||'{}');
              pwds.forEach(p => { if (p.id && p.password && !(p.id in ps)) ps[p.id] = p.password; });
              localStorage.setItem('bms_passwords', JSON.stringify(ps));
            }
            setLeads(lds);
            setClients(cls);
            setProjects(prj);
            setInvoices(inv);
            setExpenses(exp);
            setSalaries(sal);
            setAttendance(att);
            setOffDays(ofd);
            setDeductions(ded);
            setBonuses(bon);
            if (tm.length) { setTeamMembers(tm); } else {
              setTeamMembers(INITIAL_TEAM);
              db.saveMany('team_members', INITIAL_TEAM);
            }
            setTeamClients(tc);
            if (cr.length) { setCustomRoles(cr); } else {
              setCustomRoles(INITIAL_CUSTOM_ROLES);
              db.saveMany('custom_roles', INITIAL_CUSTOM_ROLES);
            }
            setTaskDepts(td);
            setTaskBuckets(tb);
            setTaskTasks(tt);
            setDesignAssets(da);
            setClientAssets(ca);
            setDcDocuments(doc);
          } catch(e) {
            console.error('Supabase initial load failed:', e);
            setTeamMembers(INITIAL_TEAM);
            setCustomRoles(INITIAL_CUSTOM_ROLES);
          } finally {
            setDbLoaded(true);
          }
        })();
      }, []);

      const t = useCallback(key => TRANSLATIONS[lang]?.[key] ?? TRANSLATIONS.ar?.[key] ?? key, [lang]);

      const toggleTheme = () => {
        setTheme(prev => {
          const next = prev === 'dark' ? 'light' : 'dark';
          if (currentUser) localStorage.setItem(`bms_theme_${currentUser.id}`, next);
          return next;
        });
      };

      const toggleLang = () => {
        setLang(prev => {
          const next = prev === 'ar' ? 'en' : 'ar';
          if (currentUser) localStorage.setItem(`bms_lang_${currentUser.id}`, next);
          return next;
        });
      };

      const [notifications, setNotifications] = useState(() => {
        try { return JSON.parse(localStorage.getItem('bms_notifications') || '[]'); } catch(_) { return []; }
      });
      const [announcements, setAnnouncements] = useState(() => {
        try { return JSON.parse(localStorage.getItem('bms_announcements') || '[]'); } catch(_) { return []; }
      });
      const [annBarDismissed, setAnnBarDismissed] = useState(false);

      const toastTimerRef = React.useRef(null);
      const showToast = (msg, opts = {}) => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToast({ msg, ...opts });
        toastTimerRef.current = setTimeout(() => setToast(null), opts.onUndo ? 5000 : 3000);
      };

      /* ── Notification helpers ── */
      const pushNotif = (notif) => {
        const n = { id:'n_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), read:false, createdAt:new Date().toISOString(), ...notif };
        setNotifications(prev => {
          const updated = [n, ...prev].slice(0, 300);
          try { localStorage.setItem('bms_notifications', JSON.stringify(updated)); } catch(_) {}
          return updated;
        });
      };
      const markNotifRead = (id) => {
        setNotifications(prev => {
          const updated = prev.map(n => n.id === id ? {...n, read:true} : n);
          try { localStorage.setItem('bms_notifications', JSON.stringify(updated)); } catch(_) {}
          return updated;
        });
      };
      const markAllNotifsRead = (userId) => {
        setNotifications(prev => {
          const updated = prev.map(n => n.userId === userId ? {...n, read:true} : n);
          try { localStorage.setItem('bms_notifications', JSON.stringify(updated)); } catch(_) {}
          return updated;
        });
      };

      const saveAnnouncements = (list) => {
        try { localStorage.setItem('bms_announcements', JSON.stringify(list)); } catch(_) {}
      };
      const addAnnouncement = (text, durationHours) => {
        const ann = {
          id: 'ann_' + Date.now(),
          text,
          durationHours: Number(durationHours) || 0,
          createdAt: new Date().toISOString(),
          createdBy: { name: currentUser?.name || '?', role: currentUser?.role || '?' },
          active: true,
        };
        const updated = [ann, ...announcements];
        setAnnouncements(updated);
        saveAnnouncements(updated);
        setAnnBarDismissed(false);
      };
      const deactivateAnnouncement = (id) => {
        const updated = announcements.map(a => a.id === id ? { ...a, active: false } : a);
        setAnnouncements(updated);
        saveAnnouncements(updated);
      };
      const deleteAnnouncement = (id) => {
        const updated = announcements.filter(a => a.id !== id);
        setAnnouncements(updated);
        saveAnnouncements(updated);
      };

      /* Active announcement = newest active one that hasn't expired */
      const activeAnn = announcements.find(a => {
        if (!a.active) return false;
        if (!a.durationHours) return true;
        return new Date(a.createdAt).getTime() + a.durationHours * 3600000 > Date.now();
      });

      useEffect(() => { localStorage.setItem('bms_page', page); }, [page]);

      // Auto-convert Won leads to clients
      useEffect(() => {
        if (!dbLoaded) return;
        const newWon = leads.filter(l => l.status === 'won' && !clients.find(c => c.id === l.id));
        if (newWon.length > 0) {
          const newClients = newWon.map(l => ({
            id:l.id, name:l.name, phone:l.phone, email:l.email, price_quote:l.price_quote,
            company_name:'', field:'', status_client:'active', project_client:[],
            created: new Date().toISOString().split('T')[0],
          }));
          setClients(prev => [...prev, ...newClients]);
          newClients.forEach(c => db.save('clients', c));
          newWon.forEach(l => showToast(t('app_lead_converted').replace('{{name}}', l.name)));
        }
      }, [leads, dbLoaded]);

      // Auto-resolve timeouts
      useEffect(() => {
        if (!dbLoaded) return;
        const now = new Date();
        [...teamMembers, ...teamClients].forEach(m => {
          if (m.status === 'timeout' && m.timeout_until && new Date(m.timeout_until) <= now) {
            const updated = { ...m, status: 'active', timeout_until: null };
            if (teamMembers.find(x => x.id === m.id)) {
              setTeamMembers(prev => prev.map(x => x.id === m.id ? updated : x));
              db.save('team_members', updated);
            } else {
              setTeamClients(prev => prev.map(x => x.id === m.id ? updated : x));
              db.save('team_clients', updated);
            }
          }
        });
      }, [dbLoaded]);

      const handleLeadUpdate = (id, field, value, newLead) => {
        if (newLead) { setLeads(prev => [newLead, ...prev]); db.save('leads', newLead); return; }
        if (field === '_full') {
          const old = leads.find(l => l.id === id);
          if (old && old.status !== 'won' && value.status === 'won') {
            teamMembers.filter(m => m.id !== currentUser?.id && canSee(m,'crm',customRoles))
              .forEach(m => pushNotif({ userId:m.id, type:'lead_won', title:t('app_notif_lead_won'), body:value.name||'—', section:'clients' }));
          }
          setLeads(prev => prev.map(l => l.id === id ? value : l));
          db.save('leads', value);
          return;
        }
        if (field === 'status' && value === 'won') {
          const lead = leads.find(l => l.id === id);
          teamMembers.filter(m => m.id !== currentUser?.id && canSee(m,'crm',customRoles))
            .forEach(m => pushNotif({ userId:m.id, type:'lead_won', title:t('app_notif_lead_won'), body:lead?.name||'—', section:'clients' }));
        }
        setLeads(prev => {
          const next = prev.map(l => l.id === id ? { ...l, [field]: value } : l);
          db.save('leads', next.find(l => l.id === id));
          return next;
        });
      };
      const handleLeadDelete = id => {
        if (confirm(t('app_del_lead_confirm'))) { setLeads(prev => prev.filter(l => l.id !== id)); db.del('leads', id); }
      };
      const handleClientUpdate = u => { setClients(prev => prev.map(c => c.id === u.id ? u : c)); db.save('clients', u); };
      const handleClientDelete = id => { setClients(prev => prev.filter(c => c.id !== id)); db.del('clients', id); };
      const handleClientAdd = c => {
        setClients(prev => [c, ...prev]);
        db.save('clients', c);
        teamMembers.filter(m => m.id !== currentUser?.id && canSee(m,'clients',customRoles))
          .forEach(m => pushNotif({ userId:m.id, type:'client_added', title:t('app_notif_client_added'), body:c.name||'—', section:'clients' }));
      };

      const handleSaveProject = p => { setProjects(prev => prev.map(x => x.id === p.id ? p : x)); db.save('projects', p); };
      const handleAddProject = p => {
        setProjects(prev => [...prev, p]);
        db.save('projects', p);
        teamMembers.filter(m => m.id !== currentUser?.id && canSee(m,'projects',customRoles))
          .forEach(m => pushNotif({ userId:m.id, type:'project_added', title:t('app_notif_project_added'), body:p.name||'—', section:'projects' }));
      };
      const handleSaveInvoice = inv => {
        setInvoices(prev => prev.find(i => i.id === inv.id) ? prev.map(i => i.id === inv.id ? inv : i) : [...prev, inv]);
        db.save('invoices', inv);
      };
      const handleDeleteInvoice = id => { setInvoices(prev => prev.filter(i => i.id !== id)); db.del('invoices', id); };

      const handleAddMember = m => {
        setTeamMembers(prev => [...prev, m]);
        db.save('team_members', m);
        teamMembers.filter(x => x.id !== currentUser?.id && ['super_admin','admin'].includes(x.role))
          .forEach(x => pushNotif({ userId:x.id, type:'member_added', title:t('app_notif_member_added'), body:m.name||'—', section:'team' }));
      };
      const handleUpdateMember = m   => { setTeamMembers(prev => prev.map(x => x.id === m.id ? m : x)); db.save('team_members', m); };
      const handleDeleteMember = id  => { setTeamMembers(prev => { const m=prev.find(x=>x.id===id); if(m?.role==='super_admin')return prev; return prev.filter(x=>x.id!==id); }); db.del('team_members', id); };
      const handleAddClient    = c   => { setTeamClients(prev => [...prev, c]); db.save('team_clients', c); };
      const handleUpdateClient = c   => { setTeamClients(prev => prev.map(x => x.id === c.id ? c : x)); db.save('team_clients', c); };
      const handleDeleteClient = id  => { setTeamClients(prev => prev.filter(x => x.id !== id)); db.del('team_clients', id); };

      const handleAddExpense    = e  => { setExpenses(prev => [...prev, e]); db.save('expenses', e); };
      const handleUpdateExpense = e  => { setExpenses(prev => prev.map(x => x.id === e.id ? e : x)); db.save('expenses', e); };
      const handleDeleteExpense = id => { setExpenses(prev => prev.filter(x => x.id !== id)); db.del('expenses', id); };
      const handleAddSalary     = s  => { setSalaries(prev => [...prev, s]); db.save('salaries', s); };
      const handleUpdateSalary  = s  => { setSalaries(prev => prev.map(x => x.id === s.id ? s : x)); db.save('salaries', s); };
      const handleDeleteSalary  = id => { setSalaries(prev => prev.filter(x => x.id !== id)); db.del('salaries', id); };

      const handleSaveAdsData  = d  => setAdsData(prev => prev.find(x=>x.projectId===d.projectId) ? prev.map(x=>x.projectId===d.projectId?d:x) : [...prev,d]);
      const handleSavePost     = p  => setSmPosts(prev => prev.find(x=>x.id===p.id) ? prev.map(x=>x.id===p.id?p:x) : [...prev,p]);
      const handleDeletePost   = id => setSmPosts(prev => prev.filter(x=>x.id!==id));
      const handleReadMessage  = id => setSmMessages(prev => prev.map(x=>x.id===id?{...x,read:true}:x));
      const handleSaveAccount  = a  => setSmAccounts(prev => prev.find(x=>x.projectId===a.projectId) ? prev.map(x=>x.projectId===a.projectId?a:x) : [...prev,a]);
      const handleUpdateStats  = partial => setSmStats(prev => {
        const existing = prev.find(s=>s.projectId===partial.projectId);
        const merged   = existing ? { ...existing, facebook:{...existing.facebook,...partial.facebook}, instagram:{...existing.instagram,...partial.instagram} } : { id:Date.now(), unique_views:0, audience:null, growth_30d:null, ...partial };
        return existing ? prev.map(s=>s.projectId===partial.projectId?merged:s) : [...prev,merged];
      });

      const handleSaveDesignAsset  = a  => { setDesignAssets(prev => prev.find(x=>x.id===a.id) ? prev.map(x=>x.id===a.id?a:x) : [...prev,a]); db.save('design_assets', a); };
      const handleDeleteDesignAsset= id => { setDesignAssets(prev => prev.filter(x=>x.id!==id)); db.del('design_assets', id); };
      const handleSaveClientAsset  = a  => { setClientAssets(prev => prev.find(x=>x.id===a.id) ? prev.map(x=>x.id===a.id?a:x) : [...prev,a]); db.save('client_assets', a); };
      const handleDeleteClientAsset= id => { setClientAssets(prev => prev.filter(x=>x.id!==id)); db.del('client_assets', id); };
      const handleSaveDocument     = d  => { setDcDocuments(prev => prev.find(x=>x.id===d.id) ? prev.map(x=>x.id===d.id?d:x) : [...prev,d]); db.save('documents', d); };
      const handleDeleteDocument   = id => { setDcDocuments(prev => prev.filter(x=>x.id!==id)); db.del('documents', id); };

      const handleSaveShortcuts = ids => {
        setDashShortcuts(ids);
        if (currentUser) {
          try { localStorage.setItem(`bms_dash_shortcuts_${currentUser.id}`, JSON.stringify(ids)); } catch(_) {}
        }
      };

      const handleLogin = user => {
        _currentBmsUserId = user.id;
        setCurrentUser(user);
        tryAutoLinkMicrosoft(user.id);
        const savedTheme = localStorage.getItem(`bms_theme_${user.id}`) || 'dark';
        const savedLang  = localStorage.getItem(`bms_lang_${user.id}`)  || 'ar';
        const savedShortcuts = (() => {
          try { return JSON.parse(localStorage.getItem(`bms_dash_shortcuts_${user.id}`) || '[]'); } catch(_) { return []; }
        })();
        setTheme(savedTheme);
        setLang(savedLang);
        setDashShortcuts(savedShortcuts);
        setPage('dashboard');
      };

      const handleClockIn = () => {
        if (!currentUser || currentUser.role === 'client') return;
        const today = todayStr();
        setAttendance(prev => {
          if (prev.find(r => r.userId === currentUser.id && r.date === today)) return prev;
          const rec = { id: Date.now(), userId: currentUser.id, date: today, clockIn: new Date().toISOString(), clockOut: null, pauses: [] };
          db.save('attendance', rec);
          return [...prev, rec];
        });
      };

      const handleClockOut = () => {
        if (!currentUser || currentUser.role === 'client') return;
        const today = todayStr();
        setAttendance(prev => prev.map(r => {
          if (r.userId === currentUser.id && r.date === today && !r.clockOut) {
            const pauses = (r.pauses||[]).map(p => p.end ? p : { ...p, end: new Date().toISOString() });
            const updated = { ...r, clockOut: new Date().toISOString(), pauses };
            db.save('attendance', updated);
            return updated;
          }
          return r;
        }));
      };
      const handleLogout = () => {
        if (currentUser && currentUser.role !== 'client') {
          const today = todayStr();
          setAttendance(prev => prev.map(r => {
            if (r.userId === currentUser.id && r.date === today && !r.clockOut) {
              const pauses = (r.pauses||[]).map(p => p.end ? p : { ...p, end: new Date().toISOString() });
              const updated = { ...r, clockOut: new Date().toISOString(), pauses };
              db.save('attendance', updated);
              return updated;
            }
            return r;
          }));
        }
        setCurrentUser(null);
        setShowProfile(false);
      };

      const handlePauseAttendance = () => {
        const today = todayStr();
        setAttendance(prev => prev.map(r => {
          if (r.userId === currentUser.id && r.date === today && !r.clockOut) {
            const pauses = r.pauses||[];
            if (pauses.length > 0 && !pauses[pauses.length-1].end) return r;
            const updated = { ...r, pauses: [...pauses, { start: new Date().toISOString(), end: null }] };
            db.save('attendance', updated);
            return updated;
          }
          return r;
        }));
        showToast('بدأت الاستراحة ⏸');
      };

      const handleResumeAttendance = () => {
        const today = todayStr();
        setAttendance(prev => prev.map(r => {
          if (r.userId === currentUser.id && r.date === today && !r.clockOut) {
            const pauses = [...(r.pauses||[])];
            if (pauses.length > 0 && !pauses[pauses.length-1].end) {
              pauses[pauses.length-1] = { ...pauses[pauses.length-1], end: new Date().toISOString() };
            }
            const updated = { ...r, pauses };
            db.save('attendance', updated);
            return updated;
          }
          return r;
        }));
        showToast('استأنفت العمل ✓');
      };

      const handleAddDeduction = d  => { setDeductions(prev => [...prev, d]); db.save('deductions', d); };
      const handleAddOffDay    = d  => { setOffDays(prev => [...prev, d]); db.save('off_days', d); };
      const handleAddBonus     = b  => { setBonuses(prev => [...prev, b]); db.save('bonuses', b); };
      const handleSaveProfile = updated => {
        if (updated.role === 'client') {
          setTeamClients(prev => prev.map(c => c.id === updated.id ? updated : c));
          db.save('team_clients', updated);
        } else {
          setTeamMembers(prev => prev.map(m => m.id === updated.id ? updated : m));
          db.save('team_members', updated);
        }
        setCurrentUser(updated);
        showToast('تم حفظ التغييرات ✓');
      };

      const handleAddTaskDept = d => { setTaskDepts(prev => [...prev, d]); db.save('task_depts', d); };
      const handleDeleteTaskDept = id => {
        const bucketIds = taskBuckets.filter(b => b.department_id === id).map(b => b.id);
        const taskIds   = taskTasks.filter(t => bucketIds.includes(t.bucket_id)).map(t => t.id);
        setTaskTasks(prev => prev.filter(t => !bucketIds.includes(t.bucket_id)));
        setTaskBuckets(prev => prev.filter(b => b.department_id !== id));
        setTaskDepts(prev => prev.filter(d => d.id !== id));
        if (taskIds.length) db.delMany('task_tasks', taskIds);
        if (bucketIds.length) db.delMany('task_buckets', bucketIds);
        db.del('task_depts', id);
      };
      const handleReorderTaskDepts = orderedIds => {
        setTaskDepts(prev => {
          const next = prev.map(d => ({ ...d, order: orderedIds.indexOf(d.id) + 1 }));
          db.saveMany('task_depts', next);
          return next;
        });
      };
      const handleAddTaskBucket = b => { setTaskBuckets(prev => [...prev, b]); db.save('task_buckets', b); };
      const handleDeleteTaskBucket = id => {
        const taskIds = taskTasks.filter(t => t.bucket_id === id).map(t => t.id);
        setTaskTasks(prev => prev.filter(tk => tk.bucket_id !== id));
        setTaskBuckets(prev => prev.filter(b => b.id !== id));
        if (taskIds.length) db.delMany('task_tasks', taskIds);
        db.del('task_buckets', id);
      };
      const handleRenameTaskBucket = (id, name) => {
        setTaskBuckets(prev => {
          const next = prev.map(b => b.id === id ? { ...b, name } : b);
          const updated = next.find(b => b.id === id);
          if (updated) db.save('task_buckets', updated);
          return next;
        });
      };
      const handleSaveTaskTask = task => {
        const existing = taskTasks.find(x => x.id === task.id);
        if (!existing) {
          (task.assignees||[]).filter(uid => uid !== currentUser?.id).forEach(uid => {
            const m = teamMembers.find(x => x.id === uid);
            if (m) pushNotif({ userId:uid, type:'task_assigned', title:t('app_notif_task_assigned'), body:task.title||t('app_task_no_title'), section:'tasks' });
          });
        } else if (existing.status !== task.status) {
          (task.assignees||[]).filter(uid => uid !== currentUser?.id).forEach(uid =>
            pushNotif({ userId:uid, type:'task_updated', title:t('app_notif_task_updated'), body:`"${task.title}" — ${t('app_notif_task_status')}`, section:'tasks' })
          );
        }
        setTaskTasks(prev => prev.find(x=>x.id===task.id) ? prev.map(x=>x.id===task.id?task:x) : [...prev,task]);
        db.save('task_tasks', task);
      };
      const handleDeleteTaskTask = id => { setTaskTasks(prev => prev.filter(x=>x.id!==id)); db.del('task_tasks', id); };
      const handleSaveWebData = record => setWebData(prev => {
        const exists = prev.find(x => x.id === record.id || x.projectId === record.projectId);
        return exists
          ? prev.map(x => (x.id === record.id || x.projectId === record.projectId) ? { ...x, ...record } : x)
          : [...prev, record];
      });
      const handleAddCustomRole    = r  => { setCustomRoles(prev => [...prev, r]); db.save('custom_roles', r); };
      const handleUpdateCustomRole = r  => { setCustomRoles(prev => prev.map(x => x.id===r.id ? r : x)); db.save('custom_roles', r); };
      const handleDeleteCustomRole = id => { setCustomRoles(prev => prev.filter(x => x.id!==id)); db.del('custom_roles', id); };

      const render = () => {
        switch (page) {
          case 'dashboard': return <Dashboard
            leads={leads} clients={clients} projects={projects} invoices={invoices}
            expenses={expenses} teamMembers={teamMembers} attendance={attendance}
            designAssets={designAssets} smStats={smStats} smPosts={smPosts}
            smMessages={smMessages} taskTasks={taskTasks} announcements={announcements}
            currentUser={currentUser} customRoles={customRoles} setPage={setPage}
            dashShortcuts={dashShortcuts} onSaveShortcuts={handleSaveShortcuts}/>;
          case 'crm': return <CRM leads={leads} clients={clients} onUpdate={handleLeadUpdate} onDelete={handleLeadDelete}/>;
          case 'clients': return <Clients clients={clients} onUpdate={handleClientUpdate} onDelete={handleClientDelete} onAdd={handleClientAdd} showToast={showToast}/>;
          case 'projects': return (
            <ProjectsModule projects={projects} clients={clients} invoices={invoices}
              onAddProject={handleAddProject} onSaveProject={handleSaveProject} onSaveInvoice={handleSaveInvoice} onDeleteInvoice={handleDeleteInvoice} showToast={showToast}/>
          );
          case 'team': return (
            <TeamModule teamMembers={teamMembers} teamClients={teamClients} customRoles={customRoles} currentUser={currentUser}
              onAddMember={handleAddMember} onUpdateMember={handleUpdateMember} onDeleteMember={handleDeleteMember}
              onAddClient={handleAddClient} onUpdateClient={handleUpdateClient} onDeleteClient={handleDeleteClient}
              onAddCustomRole={handleAddCustomRole} onUpdateCustomRole={handleUpdateCustomRole} onDeleteCustomRole={handleDeleteCustomRole}
              attendanceRecords={attendance} offDays={offDays} deductions={deductions} bonuses={bonuses}
              onAddDeduction={handleAddDeduction} onAddOffDay={handleAddOffDay} onAddBonus={handleAddBonus}
              showToast={showToast}/>
          );
          case 'design': return (
            <DesignContentModule
              projects={projects} clients={clients} teamMembers={teamMembers}
              designAssets={designAssets} clientAssets={clientAssets} documents={dcDocuments}
              onSaveDesignAsset={handleSaveDesignAsset}   onDeleteDesignAsset={handleDeleteDesignAsset}
              onSaveClientAsset={handleSaveClientAsset}   onDeleteClientAsset={handleDeleteClientAsset}
              onSaveDocument={handleSaveDocument}         onDeleteDocument={handleDeleteDocument}
              showToast={showToast}/>
          );
          case 'finance': return (
            <FinanceModule
              invoices={invoices} projects={projects} clients={clients} teamMembers={teamMembers}
              expenses={expenses} salaries={salaries} deductions={deductions} bonuses={bonuses} customRoles={customRoles}
              onAddExpense={handleAddExpense} onUpdateExpense={handleUpdateExpense} onDeleteExpense={handleDeleteExpense}
              onAddSalary={handleAddSalary} onUpdateSalary={handleUpdateSalary} onDeleteSalary={handleDeleteSalary}
              onSaveInvoice={handleSaveInvoice}
              showToast={showToast}/>
          );
          case 'social': return (
            <SocialMediaModule
              projects={projects} clients={clients}
              smStats={smStats} smPosts={smPosts} smMessages={smMessages} smAccounts={smAccounts}
              adsData={adsData}
              onSavePost={handleSavePost} onDeletePost={handleDeletePost}
              onReadMessage={handleReadMessage} onSaveAccount={handleSaveAccount}
              onUpdateStats={handleUpdateStats} onSaveAdsData={handleSaveAdsData}
              showToast={showToast}/>
          );
          case 'web': return (
            <WebServicesModule
              projects={projects} clients={clients} invoices={invoices}
              teamMembers={teamMembers} webData={webData}
              onSaveWebData={handleSaveWebData}
              showToast={showToast}/>
          );
          case 'tasks': return (
            <TasksModule
              projects={projects} teamMembers={teamMembers}
              taskDepts={taskDepts} taskBuckets={taskBuckets} taskTasks={taskTasks}
              onAddDept={handleAddTaskDept} onDeleteDept={handleDeleteTaskDept} onReorderDepts={handleReorderTaskDepts}
              onAddBucket={handleAddTaskBucket} onDeleteBucket={handleDeleteTaskBucket} onRenameBucket={handleRenameTaskBucket}
              onSaveTask={handleSaveTaskTask} onDeleteTask={handleDeleteTaskTask}
              showToast={showToast}/>
          );
          case 'email': return <EmailModule showToast={showToast}/>;
          case 'chat':  return <ChatModule  showToast={showToast}/>;
          case 'announcements': return (
            <AnnouncementsModule
              announcements={announcements}
              currentUser={currentUser}
              onAdd={addAnnouncement}
              onDeactivate={deactivateAnnouncement}
              onDelete={deleteAnnouncement}
              showToast={showToast}/>
          );
          default: return <ComingSoon name={NAV.find(n => n.id === page)?.label || page} />;
        }
      };

      const langCtxVal = useMemo(() => ({ lang, t }), [lang, t]);

      if (!dbLoaded) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center gap-4">
            <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center text-white font-black text-2xl shadow-2xl shadow-blue-500/30">M</div>
            <div className="flex gap-1.5">
              {[0,1,2].map(i => (
                <div key={i} className="w-2 h-2 rounded-full bg-blue-500 animate-bounce" style={{ animationDelay: `${i * 0.15}s` }}/>
              ))}
            </div>
            <p className="text-slate-500 text-sm">جاري تحميل البيانات…</p>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <LangContext.Provider value={langCtxVal}>
            <LoginScreen teamMembers={teamMembers} teamClients={teamClients} customRoles={customRoles} onLogin={handleLogin} />
          </LangContext.Provider>
        );
      }

      const isTeamMember = currentUser.role !== 'client';

      return (
        <LangContext.Provider value={langCtxVal}>
        <div className="flex min-h-screen bg-slate-950" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
          <Sidebar page={page} setPage={setPage} currentUser={currentUser} customRoles={customRoles}
            notifications={notifications} onMarkRead={markNotifRead} onMarkAllRead={markAllNotifsRead}
            onProfile={() => setShowProfile(true)} onLogout={handleLogout}
            theme={theme} onToggleTheme={toggleTheme}
            lang={lang} onToggleLang={toggleLang} />
          <div className={`flex-1 flex flex-col min-h-screen ${lang === 'ar' ? 'mr-56' : 'ml-56'}`}>
            {activeAnn && !annBarDismissed && (
              <AnnouncementBar ann={activeAnn} onDismiss={() => setAnnBarDismissed(true)}/>
            )}
            <AttendanceBar
              currentUser={currentUser}
              attendanceRecords={isTeamMember ? attendance : []}
              onClockIn={handleClockIn}
              onClockOut={handleClockOut}
              onPause={handlePauseAttendance}
              onResume={handleResumeAttendance}
              notifications={notifications}
              onMarkRead={markNotifRead}
              onMarkAllRead={markAllNotifsRead}
              onNavigate={setPage}
            />
            <main className="flex-1 p-8">
              {render()}
            </main>
          </div>
          {showProfile && (
            <ProfileOverlay user={currentUser} customRoles={customRoles}
              attendanceRecords={attendance} offDays={offDays}
              deductions={deductions} bonuses={bonuses}
              onSave={handleSaveProfile} showToast={showToast}
              onClose={() => setShowProfile(false)} />
          )}
          {toast && <Toast msg={toast.msg} onUndo={toast.onUndo} undoLabel={toast.undoLabel} onClose={() => setToast(null)}/>}
        </div>
        </LangContext.Provider>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
