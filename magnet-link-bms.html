              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-slate-400 block mb-1">{t('fin_salary_lbl')} *</label>
                  <input type="number" min="0" value={f.amount} onChange={e=>setF(p=>({...p,amount:e.target.value}))} placeholder="0" className={inputCls}/>
                </div>
                <div>
                  <label className="text-xs text-slate-400 block mb-1">{t('fin_monthly_q')}</label>
                  <button onClick={()=>setF(p=>({...p,recurring:!p.recurring}))}
                    className={`w-full py-2 rounded-lg border text-sm transition-all ${f.recurring?'bg-blue-500/15 text-blue-300 border-blue-500/40':'bg-slate-700 text-slate-400 border-slate-600 hover:border-slate-500'}`}>
                    {f.recurring ? t('fin_monthly_yes') : t('fin_rec_one_time')}
                  </button>
                </div>
              </div>
              {f.recurring ? (
                <div>
                  <label className="text-xs text-slate-400 block mb-1">{t('tsk_start_date')}</label>
                  <input type="date" value={f.start_date} onChange={e=>setF(p=>({...p,start_date:e.target.value}))} className={inputCls}/>
                </div>
              ) : (
                <div>
                  <label className="text-xs text-slate-400 block mb-1">{t('fin_month_lbl')}</label>
                  <input type="month" value={f.month||''} onChange={e=>setF(p=>({...p,month:e.target.value}))} className={inputCls}/>
                </div>
              )}
            </div>
            <div className="flex gap-3 px-5 pb-5">
              <button onClick={save} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-2.5 text-sm font-medium transition-colors shadow-lg shadow-blue-500/20">{isEdit ? t('save') : t('add')}</button>
              <button onClick={onClose} className="px-5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl py-2.5 text-sm transition-colors">{t('cancel')}</button>
            </div>
          </div>
        </div>
      );
    };

    /* ─── Finance Module ─── */
    const FinanceModule = ({ invoices, projects, clients, teamMembers, expenses, salaries, deductions, bonuses, customRoles, onAddExpense, onUpdateExpense, onDeleteExpense, onAddSalary, onUpdateSalary, onDeleteSalary, onSaveInvoice, showToast }) => {
      const { t } = useLang();
      const [tab,      setTab]      = useState('money_in');
      const [month,    setMonth]    = useState(() => new Date().toISOString().slice(0,7));
      const [expModal, setExpModal] = useState(null);
      const [salModal, setSalModal] = useState(null);
      const [invModal, setInvModal] = useState(false);

      const prevMonth = getPrevMonth(month);

      /* ── Money In ── */
      const moneyInEntries = invoices.flatMap(inv => {
        const st = inv.items.reduce((s,i)=>s+i.qty*i.unit_price,0);
        const gt = st*(1+(inv.tax||0)/100);
        const proj = projects.find(p=>p.id===inv.projectId);
        const cl   = clients.find(c=>c.id===proj?.clientId);
        return inv.payments
          .map((p,idx)=>({p,idx}))
          .filter(({p})=>p.status==='paid' && (p.paid_date||inv.due_date||'').startsWith(month))
          .map(({p,idx})=>({
            key:`${inv.id}-${p.id}`, inv_no:inv.inv_no,
            pmt_label:t('proj_payment_n').replace('{{n}}',idx+1),
            amount: gt*p.pct/100,
            date: p.paid_date||inv.due_date,
            client_name: cl?.name||'—', project_name: proj?.name||'—',
          }));
      });
      const moneyInTotal = moneyInEntries.reduce((s,e)=>s+e.amount,0);

      /* ── Money Out ── */
      const allOcc      = expenses.flatMap(e=>generateOccurrences(e));
      const monthExp    = allOcc.filter(e=>e.gen_date.startsWith(month));
      const prevMonthExp= allOcc.filter(e=>e.gen_date.startsWith(prevMonth));
      const moneyOutTotal  = monthExp.reduce((s,e)=>s+e.amount,0);
      const prevOutTotal   = prevMonthExp.reduce((s,e)=>s+e.amount,0);

      const monthExpWithStatus = monthExp.map(occ => {
        const rec = (occ.paid_months||[]).find(p=>p.month===month);
        return { ...occ, paid: rec?.paid||false, paid_date: rec?.paid_date||null };
      });
      const paidOccs    = monthExpWithStatus.filter(e=>e.paid);
      const paidOutTotal= paidOccs.reduce((s,e)=>s+e.amount,0);
      const paidCount   = paidOccs.length;

      /* ── Salary ── */
      const genSalOcc = (sal) => {
        if (!sal.recurring || !sal.start_date) return (sal.month===month)?[{...sal,gen_month:sal.month}]:[];
        const res=[]; const today=new Date(); today.setHours(23,59,59);
        let cur=new Date(sal.start_date); let safe=0;
        while(cur<=today&&safe<200){safe++;res.push({...sal,gen_month:cur.toISOString().slice(0,7)});cur.setMonth(cur.getMonth()+1);}
        return res;
      };
      /* Auto-salaries derived from team members (salary > 0, joined on or before this month) */
      const autoMonthSals = teamMembers
        .filter(m => Number(m.salary) > 0 && (!m.join_date || m.join_date.slice(0,7) <= month))
        .map(m => ({
          id: `auto_${m.id}`, _auto: true, _memberId: m.id,
          employee_name: m.name,
          role: getRoleInfo(m.role, customRoles||[]).label,
          amount: Number(m.salary),
          recurring: true, start_date: m.join_date, gen_month: month,
        }));
      const manualMonthSals = salaries.flatMap(s=>genSalOcc(s)).filter(s=>s.gen_month===month);
      const monthSals   = [...autoMonthSals, ...manualMonthSals];
      const salaryTotal = monthSals.reduce((s,x)=>s+x.amount,0);

      /* ── Deductions & Bonuses ── */
      const allDeds = deductions||[];
      const allBons = bonuses||[];
      const monthDeds = allDeds.filter(d => (d.date||'').startsWith(month));
      const monthBons = allBons.filter(b => (b.date||'').startsWith(month));
      const deductionTotal = monthDeds.reduce((s,d)=>s+Number(d.amount),0);
      const bonusTotal     = monthBons.reduce((s,b)=>s+Number(b.amount),0);
      const netSalary = salaryTotal - deductionTotal + bonusTotal;
      /* helper: per-employee deductions and bonuses */
      const empDed  = (uid) => monthDeds.filter(d=>d.userId===uid).reduce((s,d)=>s+Number(d.amount),0);
      const empBonus= (uid) => monthBons.filter(b=>b.userId===uid).reduce((s,b)=>s+Number(b.amount),0);

      /* ── Revenue ── */
      const revenue = moneyInTotal - moneyOutTotal - netSalary;

      const toggleExpPaid = (occ, newPaid) => {
        const srcExp = expenses.find(e=>e.id===occ.id);
        if (!srcExp) return;
        const paid_date = newPaid ? new Date().toISOString().split('T')[0] : null;
        const rest = (srcExp.paid_months||[]).filter(p=>p.month!==month);
        onUpdateExpense({ ...srcExp, paid_months:[...rest,{month,paid:newPaid,paid_date}] });
      };

      const TABS = [
        {id:'money_in',  labelKey:'fin_tab_in'},
        {id:'money_out', labelKey:'fin_tab_out'},
        {id:'salary',    labelKey:'fin_tab_salary'},
        {id:'revenue',   labelKey:'fin_tab_revenue'},
      ];

      return (
        <div className="space-y-5">
          {/* Header */}
          <div className="flex items-start justify-between">
            <div>
              <h1 className="text-2xl font-bold text-white">{t('nav_finance')}</h1>
              <p className="text-slate-500 text-sm mt-1">{t('fin_subtitle')}</p>
            </div>
            <input type="month" value={month} onChange={e=>setMonth(e.target.value)}
              className="bg-slate-800 border border-slate-700 focus:border-blue-500 rounded-lg px-3 py-2 text-sm text-white outline-none"/>
          </div>

          {/* Summary cards */}
          <div className="grid grid-cols-4 gap-4">
            <div className="bg-slate-800/60 rounded-2xl p-4 border border-slate-700/40">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-600 to-emerald-800 flex items-center justify-center mb-3"><Ic name="finance" size={14}/></div>
              <div className="text-xl font-bold text-white">${moneyInTotal.toFixed(0)}</div>
              <div className="text-slate-500 text-xs mt-0.5">{t('fin_tab_in')}</div>
            </div>
            <div className="bg-slate-800/60 rounded-2xl p-4 border border-slate-700/40">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-orange-600 to-orange-800 flex items-center justify-center mb-3"><Ic name="finance" size={14}/></div>
              <div className="text-xl font-bold text-white">${moneyOutTotal.toFixed(0)}</div>
              <div className="text-slate-500 text-xs mt-0.5">{t('fin_tab_out')}</div>
            </div>
            <div className="bg-slate-800/60 rounded-2xl p-4 border border-slate-700/40">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center mb-3"><Ic name="finance" size={14}/></div>
              <div className="text-xl font-bold text-white">${netSalary.toFixed(0)}</div>
              <div className="text-slate-500 text-xs mt-0.5 flex flex-wrap gap-1">
                <span>{t('fin_tab_salary')}</span>
                {deductionTotal > 0 && <span className="text-rose-400">−${deductionTotal.toFixed(0)}</span>}
                {bonusTotal > 0 && <span className="text-emerald-400">+${bonusTotal.toFixed(0)}</span>}
              </div>
            </div>
            <div className="bg-slate-800/60 rounded-2xl p-4 border border-slate-700/40">
              <div className={`w-8 h-8 rounded-lg bg-gradient-to-br ${revenue>=0?'from-blue-600 to-blue-800':'from-rose-600 to-rose-800'} flex items-center justify-center mb-3`}><Ic name="finance" size={14}/></div>
              <div className={`text-xl font-bold ${revenue>=0?'text-white':'text-red-300'}`}>${revenue.toFixed(0)}</div>
              <div className="text-slate-500 text-xs mt-0.5">{t('fin_tab_revenue')}</div>
            </div>
          </div>

          {/* Tabs */}
          <div className="flex gap-1 border-b border-slate-700/60">
            {TABS.map(ti=>(
              <button key={ti.id} onClick={()=>setTab(ti.id)}
                className={`px-5 py-2.5 text-sm font-medium transition-all border-b-2 -mb-px ${tab===ti.id?'text-blue-300 border-blue-500':'text-slate-500 border-transparent hover:text-slate-300'}`}>
                {t(ti.labelKey)}
              </button>
            ))}
          </div>

          {/* ── Money In ── */}
          {tab==='money_in'&&(
            <div className="bg-slate-800/60 rounded-2xl border border-slate-700/40 overflow-hidden">
              <div className="flex items-center justify-between px-5 py-3 border-b border-slate-700/40">
                <span className="text-xs text-slate-400">{t('fin_collected')} {month}</span>
                <button onClick={()=>setInvModal(true)}
                  className="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-colors shadow-lg shadow-emerald-500/20">
                  <Ic name="plus" size={12}/>
                  {t('fin_add_inv')}
                </button>
              </div>
              <table className="w-full text-sm">
                <thead><tr className="border-b border-slate-700/60 text-right">
                  <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('fin_col_client')}</th>
                  <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('fin_col_inv')}</th>
                  <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('fin_col_payment')}</th>
                  <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('fin_date')}</th>
                  <th className="px-4 py-3 text-xs font-medium text-slate-500 text-left">{t('fin_col_amount')}</th>
                </tr></thead>
                <tbody>
                  {moneyInEntries.length===0&&<tr><td colSpan={5} className="text-center py-12 text-slate-600">{t('fin_no_payments')}</td></tr>}
                  {moneyInEntries.map(e=>(
                    <tr key={e.key} className="border-b border-slate-700/30 hover:bg-white/[0.02]">
                      <td className="px-4 py-3"><div className="text-slate-200 font-medium">{e.client_name}</div><div className="text-xs text-slate-500">{e.project_name}</div></td>
                      <td className="px-4 py-3 text-slate-300">{e.inv_no}</td>
                      <td className="px-4 py-3"><span className="text-xs bg-blue-500/15 text-blue-300 border border-blue-500/30 px-2 py-0.5 rounded-full">{e.pmt_label}</span></td>
                      <td className="px-4 py-3 text-slate-500 text-xs">{e.date}</td>
                      <td className="px-4 py-3 text-emerald-400 font-semibold text-left">${e.amount.toFixed(2)}</td>
                    </tr>
                  ))}
                </tbody>
                {moneyInEntries.length>0&&<tfoot><tr className="border-t border-slate-700">
                  <td colSpan={4} className="px-4 py-3 text-slate-400 text-sm font-medium">{t('fin_total')}</td>
                  <td className="px-4 py-3 text-emerald-400 font-bold text-left">${moneyInTotal.toFixed(2)}</td>
                </tr></tfoot>}
              </table>
            </div>
          )}

          {/* ── Money Out ── */}
          {tab==='money_out'&&(
            <div className="space-y-4">
              {/* Summary cards */}
              <div className="grid grid-cols-3 gap-3">
                <div className="bg-slate-800/60 rounded-xl p-4 border border-slate-700/40">
                  <div className="text-slate-500 text-xs mb-1">{t('fin_total')} {month}</div>
                  <div className="text-orange-400 font-bold text-xl">${moneyOutTotal.toFixed(0)}</div>
                  <div className="text-slate-600 text-xs mt-0.5">{monthExpWithStatus.length} {t('fin_exp_count')}</div>
                </div>
                <div className="bg-slate-800/60 rounded-xl p-4 border border-slate-700/40">
                  <div className="text-slate-500 text-xs mb-1">{t('fin_paid')}</div>
                  <div className="text-emerald-400 font-bold text-xl">${paidOutTotal.toFixed(0)}</div>
                  <div className="text-slate-600 text-xs mt-0.5">{paidCount} {t('fin_pay_count')}</div>
                </div>
                <div className="bg-slate-800/60 rounded-xl p-4 border border-slate-700/40">
                  <div className="text-slate-500 text-xs mb-1">{t('fin_remaining')}</div>
                  <div className="text-rose-400 font-bold text-xl">${(moneyOutTotal-paidOutTotal).toFixed(0)}</div>
                  <div className="text-slate-600 text-xs mt-0.5">{monthExpWithStatus.length-paidCount} {t('fin_exp_count')}</div>
                </div>
              </div>

              {/* Monthly occurrences — per-month paid tracking */}
              <div className="bg-slate-800/60 rounded-2xl border border-slate-700/40 overflow-hidden">
                <div className="flex items-center justify-between px-5 py-3 border-b border-slate-700/40">
                  <span className="text-xs text-slate-400">{t('fin_expenses_in')} {month} ({monthExpWithStatus.length})</span>
                  <button onClick={()=>setExpModal({edit:null})}
                    className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">
                    <Ic name="plus" size={12}/>{t('fin_new_exp')}
                  </button>
                </div>
                <table className="w-full text-sm">
                  <thead><tr className="border-b border-slate-700/60 text-right">
                    <th className="px-4 py-3 text-xs font-medium text-slate-500 min-w-[160px]">{t('fin_col_expense')}</th>
                    <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('fin_col_amount')}</th>
                    <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('tm_col_status')}</th>
                    <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('fin_col_paid_date')}</th>
                    <th className="px-3 py-3 w-40"></th>
                  </tr></thead>
                  <tbody>
                    {monthExpWithStatus.length===0&&(
                      <tr><td colSpan={5} className="text-center py-12 text-slate-600">
                        {expenses.length===0?t('fin_no_exp'):t('fin_no_exp_month')}
                      </td></tr>
                    )}
                    {monthExpWithStatus.map(occ=>(
                      <tr key={occ.id+month} className="border-b border-slate-700/30 hover:bg-white/[0.02]">
                        <td className="px-4 py-3 text-slate-200 font-medium">{occ.desc}</td>
                        <td className="px-4 py-3 text-orange-400 font-semibold">${Number(occ.amount).toLocaleString()}</td>
                        <td className="px-4 py-3">
                          {occ.paid
                            ?<span className="text-xs bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full">{t('fin_status_paid')}</span>
                            :<span className="text-xs bg-rose-500/15 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded-full">{t('fin_status_unpaid')}</span>}
                        </td>
                        <td className="px-4 py-3 text-slate-500 text-xs">{occ.paid_date||'—'}</td>
                        <td className="px-3 py-3">
                          <div className="flex items-center gap-1">
                            <button onClick={()=>toggleExpPaid(occ,!occ.paid)}
                              className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${
                                occ.paid
                                  ?'bg-slate-700/60 text-slate-400 hover:bg-rose-500/15 hover:text-rose-300'
                                  :'bg-emerald-500/15 text-emerald-300 hover:bg-emerald-500/25'}`}>
                              {occ.paid?t('fin_btn_undo'):t('fin_btn_paid')}
                            </button>
                            <button onClick={()=>setExpModal({edit:expenses.find(e=>e.id===occ.id)})} className="p-1.5 rounded-lg text-slate-600 hover:text-blue-400 hover:bg-blue-500/10 transition-all"><Ic name="edit2" size={13}/></button>
                            <button onClick={()=>{if(confirm(t('fin_del_expense'))){onDeleteExpense(occ.id);showToast(t('fin_del_exp_toast'));}}} className="p-1.5 rounded-lg text-slate-600 hover:text-red-400 hover:bg-red-500/10 transition-all"><Ic name="trash" size={13}/></button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                  {monthExpWithStatus.length>0&&(
                    <tfoot><tr className="border-t border-slate-700">
                      <td colSpan={2} className="px-4 py-3 text-slate-400 text-sm">{t('fin_total')}</td>
                      <td className="px-4 py-3 text-emerald-400 text-sm font-medium">{t('fin_paid')}: ${paidOutTotal.toFixed(2)}</td>
                      <td className="px-4 py-3 text-rose-400 text-sm font-medium">{t('fin_remaining')}: ${(moneyOutTotal-paidOutTotal).toFixed(2)}</td>
                      <td/>
                    </tr></tfoot>
                  )}
                </table>
              </div>

              {/* All expenses management */}
              <details className="group">
                <summary className="cursor-pointer text-xs text-slate-500 hover:text-slate-300 transition-colors select-none flex items-center gap-1.5 py-1">
                  <span className="group-open:rotate-90 transition-transform inline-block">▶</span>
                  {t('fin_manage_all')} ({expenses.length})
                </summary>
                <div className="mt-3 bg-slate-800/60 rounded-2xl border border-slate-700/40 overflow-hidden">
                  <table className="w-full text-sm">
                    <thead><tr className="border-b border-slate-700/60 text-right">
                      <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('fin_col_expense')}</th>
                      <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('fin_col_amount')}</th>
                      <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('fin_recurrence')}</th>
                      <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('fin_col_start')}</th>
                      <th className="px-3 py-3 w-28"></th>
                    </tr></thead>
                    <tbody>
                      {expenses.map(exp=>(
                        <tr key={exp.id} className={`border-b border-slate-700/30 hover:bg-white/[0.02] ${exp.paused?'opacity-50':''}`}>
                          <td className="px-4 py-3 text-slate-200 font-medium">{exp.desc}</td>
                          <td className="px-4 py-3 text-orange-400 font-semibold">${Number(exp.amount).toLocaleString()}</td>
                          <td className="px-4 py-3">
                            <span className="text-xs bg-slate-700/60 text-slate-400 px-2 py-0.5 rounded-full">
                              {t(RECURRENCE_LABELS[exp.recurrence]||exp.recurrence)}
                              {exp.recurrence==='every_x_days'&&` (${exp.recurrence_x})`}
                            </span>
                          </td>
                          <td className="px-4 py-3 text-slate-500 text-xs">{exp.recurrence!=='one_time'?exp.start_date:exp.date}</td>
                          <td className="px-3 py-3">
                            <div className="flex items-center gap-1">
                              {exp.recurrence!=='one_time'&&(
                                <button onClick={()=>onUpdateExpense({...exp,paused:!exp.paused})}
                                  className={`px-2 py-1 rounded-lg text-xs transition-all ${exp.paused?'bg-emerald-500/15 text-emerald-300 hover:bg-emerald-500/25':'bg-amber-500/15 text-amber-300 hover:bg-amber-500/25'}`}>
                                  {exp.paused?t('fin_btn_activate'):t('fin_btn_stop')}
                                </button>
                              )}
                              <button onClick={()=>setExpModal({edit:exp})} className="p-1.5 rounded-lg text-slate-600 hover:text-blue-400 hover:bg-blue-500/10 transition-all"><Ic name="edit2" size={13}/></button>
                              <button onClick={()=>{if(confirm(t('fin_del_expense'))){onDeleteExpense(exp.id);showToast(t('fin_del_exp_toast'));}}} className="p-1.5 rounded-lg text-slate-600 hover:text-red-400 hover:bg-red-500/10 transition-all"><Ic name="trash" size={13}/></button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </details>
            </div>
          )}

          {/* ── Salary ── */}
          {tab==='salary'&&(
            <div className="space-y-4">
              <div className="flex justify-end">
                <button onClick={()=>setSalModal({edit:null})}
                  className="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium transition-colors shadow-lg shadow-blue-500/20">
                  <Ic name="plus" size={14}/>{t('fin_new_salary')}
                </button>
              </div>
              <div className="bg-slate-800/60 rounded-2xl border border-slate-700/40 overflow-hidden">
                <table className="w-full text-sm">
                  <thead><tr className="border-b border-slate-700/60 text-right">
                    <th className="px-4 py-3 text-xs font-medium text-slate-500 min-w-[150px]">{t('fin_employee')}</th>
                    <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('fin_col_source')}</th>

    const SpThumbnail = ({ itemId, fileType, className='', onClick }) => {
      const [blobUrl, setBlobUrl] = useState(null);
      const [err,     setErr]     = useState(false);

      useEffect(() => {
        if (!itemId) return;
        let cancelled = false;
        let objUrl    = null;

        const load = async () => {
          try {
            const driveId = await getDriveId();
            const token   = await getToken();
            const res = await fetch(
              `https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/thumbnails/0/medium/content`,
              { headers: { Authorization: `Bearer ${token}` } }
            );
            if (!res.ok) throw new Error('thumb ' + res.status);
            const blob = await res.blob();
            objUrl = URL.createObjectURL(blob);
            if (!cancelled) setBlobUrl(objUrl);
          } catch { if (!cancelled) setErr(true); }
        };

        load();
        return () => { cancelled = true; if (objUrl) URL.revokeObjectURL(objUrl); };
      }, [itemId]);

      const cursor = onClick ? 'cursor-pointer' : '';
      if (blobUrl && !err) return (
        <img src={blobUrl} alt="" onClick={onClick} className={`w-full object-cover ${cursor} ${className}`} onError={()=>setErr(true)} />
      );
      return (
        <div onClick={onClick} className={`bg-slate-800 flex items-center justify-center text-4xl ${cursor} ${className}`}>
          {fileTypeIcon(fileType)}
        </div>
      );
    };

    const AssetDetailOverlay = ({ asset, teamMembers, onUpdate, onClose, isDoc }) => {
      const { t } = useLang();
      const [newComment, setNewComment] = useState('');
      const [imgOpening, setImgOpening] = useState(false);
      const person = teamMembers.find(m=>m.id===(isDoc?asset.created_by_id:asset.designer_id));

      const openFullImage = async () => {
        if (!asset.sp_item_id) return;
        setImgOpening(true);
        try { const url = await spGetDownloadUrl(asset.sp_item_id); window.open(url, '_blank'); }
        catch(e) {}
        setImgOpening(false);
      };
      const statusCfg = isDoc ? DOC_STATUS_CFG[asset.status] : DESIGN_STATUSES.find(s=>s.id===asset.status);
      const addComment = () => {
        if (!newComment.trim()) return;
        onUpdate({ ...asset, comments:[...(asset.comments||[]), { id:Date.now(), author:t('att_you'), text:newComment.trim(), date:new Date().toISOString().split('T')[0] }] });
        setNewComment('');
      };
      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-4xl max-h-[92vh] flex overflow-hidden">

            {/* ── Left: full image ── */}
            <div className="w-1/2 bg-slate-950 flex items-center justify-center flex-shrink-0 relative min-h-64 group/img">
              <SpThumbnail itemId={asset.sp_item_id} fileType={asset.file_type} className="w-full h-full object-contain max-h-[92vh]" />
              {asset.sp_item_id && (
                <button onClick={openFullImage} disabled={imgOpening}
                  className="absolute bottom-3 left-3 opacity-0 group-hover/img:opacity-100 transition-opacity bg-black/70 hover:bg-black/90 text-white text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5 disabled:opacity-50">
                  {imgOpening ? '⏳' : '↗'} {t('des_open_full')}
                </button>
              )}
            </div>

            {/* ── Right: details + comments ── */}
            <div className="flex-1 overflow-y-auto p-6 border-r border-slate-800">
              {/* Header */}
              <div className="flex items-start justify-between mb-5">
                <div>
                  <h3 className="text-white font-bold text-lg mb-1">{asset.title}</h3>
                  {isDoc
                    ? <span className="flex items-center gap-1.5 text-xs text-slate-400"><span className={`w-2 h-2 rounded-full ${statusCfg?.dot}`}/>{t(statusCfg?.tKey)||statusCfg?.label}</span>
                    : <span className={`text-xs px-2 py-0.5 rounded-full border ${statusCfg?.badge||''}`}>{t(statusCfg?.tKey)||statusCfg?.label||asset.status}</span>
                  }
                </div>
                <button onClick={onClose} className="text-slate-500 hover:text-slate-300 text-2xl leading-none flex-shrink-0">×</button>
              </div>

              {/* Meta grid */}
              <div className="grid grid-cols-2 gap-3 mb-4">
                {[
                  [t('asset_category_lbl'), asset.category],
                  [isDoc?t('doc_executor_lbl'):t('asset_designer_lbl'), person?.name||'—'],
                  ['Due Date', asset.due_date||'—'],
                  [t('asset_file_type_lbl'), asset.file_type||'—'],
                  [t('des_file_size'), asset.file_size||'—'],
                  [t('des_created_lbl'), asset.created||'—'],
                ].map(([k,v])=>(
                  <div key={k} className="bg-slate-800/50 rounded-lg p-3">
                    <div className="text-xs text-slate-500 mb-0.5">{k}</div>
                    <div className="text-slate-200 text-sm font-medium">{v}</div>
                  </div>
                ))}
              </div>

              {/* Status actions */}
              {!isDoc&&(
                <div className="flex gap-2 mb-5">
                  {asset.status==='under_modification'&&<button onClick={()=>onUpdate({...asset,status:'ready'})} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 text-sm font-medium">{t('des_btn_approve')}</button>}
                  {asset.status==='ready'&&<button onClick={()=>onUpdate({...asset,status:'published'})} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg py-2 text-sm font-medium">{t('des_btn_publish')}</button>}
                  {asset.status==='ready'&&<button onClick={()=>onUpdate({...asset,status:'under_modification'})} className="px-4 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg py-2 text-sm">{t('des_btn_revert')}</button>}
                </div>
              )}
              {isDoc&&(
                <div className="flex gap-2 mb-5">
                  {asset.status!=='approved'&&<button onClick={()=>onUpdate({...asset,status:'approved'})} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg py-2 text-sm font-medium">{t('des_btn_approve_doc')}</button>}
                  {asset.status!=='rejected'&&<button onClick={()=>onUpdate({...asset,status:'rejected'})} className="flex-1 bg-red-600 hover:bg-red-700 text-white rounded-lg py-2 text-sm">{t('des_btn_reject')}</button>}
                  {asset.status==='approved'&&<button onClick={()=>onUpdate({...asset,status:'pending'})} className="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg py-2 text-sm">{t('des_btn_revert_doc')}</button>}
                </div>
              )}

              {/* Comments */}
              <div>
                <div className="text-sm font-medium text-slate-300 mb-3">{t('des_comments')} ({(asset.comments||[]).length})</div>
                {(asset.comments||[]).length===0&&<div className="text-slate-600 text-sm text-center py-4">{t('des_no_comments')}</div>}
                {(asset.comments||[]).map(c=>(
                  <div key={c.id} className="bg-slate-800/50 rounded-lg p-3 mb-2">
                    <div className="flex justify-between text-xs text-slate-500 mb-1">
                      <span className="font-medium text-slate-400">{c.author}</span>
                      <span>{c.date}</span>
                    </div>
                    <div className="text-slate-300 text-sm">{c.text}</div>
                  </div>
                ))}
                <div className="flex gap-2 mt-3">
                  <input className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm" value={newComment} onChange={e=>setNewComment(e.target.value)} placeholder={t('des_comment_ph')} onKeyDown={e=>e.key==='Enter'&&addComment()} />
                  <button onClick={addComment} className="px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm">{t('des_send')}</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const MOVE_TABS = [
      { key:'design',      label:'Design',      icon:'🎨' },
      { key:'from_client', label:'From Client', icon:'📥' },
      { key:'documents',   label:'Documents',   icon:'📝' },
    ];

    const MoveMenu = ({ asset, fromTab, onMove }) => {
      const { t } = useLang();
      const [open, setOpen] = useState(false);
      const targets = MOVE_TABS.filter(tk => tk.key !== fromTab);
      return (
        <div className="relative">
          <button onClick={()=>setOpen(p=>!p)}
            className="px-2 text-xs bg-slate-700 hover:bg-slate-600 text-slate-400 py-1.5 rounded-lg">
            {t('des_move')}
          </button>
          {open&&(
            <div className="absolute bottom-full mb-1 left-0 bg-slate-800 border border-slate-700 rounded-xl overflow-hidden z-20 shadow-xl min-w-32">
              {targets.map(tk=>(
                <button key={tk.key} onClick={()=>{onMove(asset,fromTab,tk.key);setOpen(false);}}
                  className="w-full text-right px-3 py-2 text-xs text-slate-300 hover:bg-slate-700 flex items-center gap-2 whitespace-nowrap">
                  <span>{tk.icon}</span><span>{tk.label}</span>
                </button>
              ))}
            </div>
          )}
        </div>
      );
    };

    const DesignContentModule = ({ projects, clients, teamMembers, designAssets, clientAssets, documents, onSaveDesignAsset, onDeleteDesignAsset, onSaveClientAsset, onDeleteClientAsset, onSaveDocument, onDeleteDocument, showToast }) => {
      const { t } = useLang();
      const [selProjectId, setSelProjectId] = useState(projects[0]?.id||null);
      const [activeTab,    setActiveTab]    = useState('design');
      const [customCats,   setCustomCats]   = useState({ design:[], client:[], docs:[] });
      const [detailAsset,  setDetailAsset]  = useState(null);
      const [addModal,     setAddModal]     = useState(null);
      const [addCatModal,  setAddCatModal]  = useState(null);
      const [spUser,       setSpUser]       = useState(null);
      const [spLoading,    setSpLoading]    = useState(false);
      const [spRootPath,   setSpRootPath]   = useState('');
      const [showPathInput,setShowPathInput]= useState(false);
      const [dragInfo,      setDragInfo]     = useState(null);
      const [dragOverTab,   setDragOverTab]  = useState(null);
      const [dragOverCat,   setDragOverCat]  = useState(null);
      const [spBrowsePath,  setSpBrowsePath] = useState([]);
      const [spBrowseItems, setSpBrowseItems]= useState([]);
      const [spBrowseLoad,  setSpBrowseLoad] = useState(false);
      const [spLive,        setSpLive]       = useState([]);
      const [spLiveLoad,    setSpLiveLoad]   = useState(false);

      const project = projects.find(p=>p.id===selProjectId);
      const cats = (type) => [...DC_DEFAULT_CATS, ...(type==='docs'?['Content']:[] ), ...customCats[type]];

      const pDesign = designAssets.filter(a=>a.projectId===selProjectId);
      const pClient = clientAssets.filter(a=>a.projectId===selProjectId);
      const pDocs   = documents.filter(d=>d.projectId===selProjectId);

      /* ── كل الفئات الموجودة فعلاً بالداتا + الافتراضية ── */
      const allDesignCats = [...new Set([...DC_DEFAULT_CATS, ...customCats.design, ...pDesign.map(a=>a.category)])];
      const allClientCats = [...new Set([...DC_DEFAULT_CATS, ...customCats.client, ...pClient.map(a=>a.category)])];
      const allDocCats    = [...new Set(['Content', ...DC_DEFAULT_CATS, ...customCats.docs, ...pDocs.map(d=>d.category)])];

      const statusBadge = s => {
        const cfg = DESIGN_STATUSES.find(x=>x.id===s);
        return cfg ? <span className={`text-xs px-2 py-0.5 rounded-full border ${cfg.badge}`}>{t(cfg.tKey)}</span> : null;
      };

      /* ── SP paths for current project ── */
      const spPaths = project ? getSpPaths(project.name) : null;

      /* ── Auto-restore session on mount ── */
      useEffect(() => {
        const account = getMsAccountForUser(_currentBmsUserId);
        if (account) setSpUser(account);
      }, []);

      /* ── Auto-load live SP files when tab/project/auth changes ── */
      useEffect(() => { loadCurrentTab(); }, [spUser, selProjectId, activeTab]);

      /* ── Login to SharePoint ── */
      const handleSpLogin = async () => {
        setSpLoading(true);
        try {
          const msal = getMsal();
          const res = await msalLoginPopup({ scopes: SP_SCOPES });
          saveMsAccountLink(_currentBmsUserId, res.account);
          setSpUser(res.account);
          showToast(t('des_sp_connected'));
        } catch(e) { showToast(t('des_sp_connect_err') + e.message); }
        setSpLoading(false);
      };

      /* ── Logout ── */
      const handleSpLogout = () => {
        removeMsAccountLink(_currentBmsUserId);
        setSpUser(null);
      };

      /* ── Live SP loading for Design/From Client/Documents tabs ── */
      const TAB_SP_FOLDER = { design:'Design', from_client:'From Client', documents:'Documents' };

      const loadCurrentTab = async () => {
        const folder = TAB_SP_FOLDER[activeTab];
        if (!spUser || !project || !folder) { setSpLive([]); return; }
        setSpLiveLoad(true);
        try {
          const driveId = await getDriveId();
          const safe = project.name.replace(/[\?%*:|"<>]/g, '-');
          const rootData = await graphFetch(
            `/drives/${driveId}/root:/${safe}/${folder}:/children?$select=id,name,size,webUrl,folder,file,lastModifiedDateTime&$orderby=name`
          ).catch(() => ({ value: [] }));
          const items = rootData.value || [];
          let files = items.filter(i => !i.folder).map(i => ({ ...i, _cat: folder }));
          for (const sf of items.filter(i => i.folder)) {
            const sfData = await graphFetch(
              `/drives/${driveId}/items/${sf.id}/children?$select=id,name,size,webUrl,folder,file,lastModifiedDateTime&$orderby=name`
            ).catch(() => ({ value: [] }));
            files = [...files, ...(sfData.value || []).filter(i => !i.folder).map(i => ({ ...i, _cat: sf.name }))];
          }
          setSpLive(files);
        } catch(e) { setSpLive([]); }
        setSpLiveLoad(false);
      };

      const getMeta = (spItem, assets) => {
        const m = assets.find(a => a.sp_item_id === spItem.id);
        if (m) return m;
        const sz = spItem.size != null
          ? spItem.size < 1048576 ? (spItem.size/1024).toFixed(1)+' KB' : (spItem.size/1048576).toFixed(2)+' MB'
          : '—';
        return {
          id: 'sp_'+spItem.id, projectId: selProjectId, sp_item_id: spItem.id,
          title: spItem.name.replace(/\.[^.]+$/, ''),
          file_type: (spItem.name.split('.').pop()||'').toUpperCase(),
          file_size: sz, sp_web_url: spItem.webUrl||'', sharepoint_path: spItem.webUrl||'',
          status: 'under_modification', designer_id: '', due_date: '', comments: [],
          created: (spItem.lastModifiedDateTime||'').split('T')[0], category: spItem._cat,
        };
      };

      /* ── SharePoint file browser ── */
      const spBrowseFetch = async (itemId = null, breadcrumb = []) => {
        if (!spUser) return;
        setSpBrowseLoad(true);
        try {
          const driveId = await getDriveId();
          const url = itemId
            ? `/drives/${driveId}/items/${itemId}/children?$select=id,name,size,webUrl,folder,file,lastModifiedDateTime,createdBy&$orderby=name`
            : `/drives/${driveId}/root/children?$select=id,name,size,webUrl,folder,file,lastModifiedDateTime,createdBy&$orderby=name`;
          const data = await graphFetch(url);
          setSpBrowseItems(data.value || []);
          setSpBrowsePath(breadcrumb);
        } catch(e) { showToast('SharePoint error: ' + e.message); }
        setSpBrowseLoad(false);
      };

      useEffect(() => {
        if (activeTab === 'sharepoint' && spUser && spBrowseItems.length === 0 && !spBrowseLoad) {
          spBrowseFetch(null, []);
        }
      }, [activeTab, spUser]);

      /* ── Setup: create per-project folder structure in SharePoint ── */
      const handleSetupFolders = async () => {
        if (!project) return;
        setSpLoading(true);
        try {
          const paths = getSpPaths(project.name);
          for (const cfg of Object.values(paths))
            for (const cat of cfg.cats)
              await spCreateFolder(`${cfg.root}/${cat}`);
          showToast(t('des_sp_folders_ok').replace('{{name}}', project.name));
        } catch(e) { showToast(t('des_err_prefix') + e.message); }
        setSpLoading(false);
      };

      /* ── Sync: read per-project SP folders → fill state ── */
      const handleSpSync = async () => {
        if (!project) return;
        setSpLoading(true);
        try {
          const driveId = await getDriveId();
          const paths   = getSpPaths(project.name);
          let addedCount = 0;

          const getChildren = async (path) => {
            try { const d = await graphFetch(`/drives/${driveId}/root:/${path}:/children`); return d.value||[]; }
            catch { return []; }
          };

          const mkAsset = (item, category) => ({
            id: item.id, projectId: selProjectId, category,
            title: item.name.replace(/\.[^.]+$/,''), status:'under_modification',
            designer_id:'', due_date:'',
            file_type: (item.name.split('.').pop()||'').toUpperCase(),
            file_size: item.size ? (item.size/1024/1024).toFixed(2)+' MB' : '—',
            sharepoint_path: item.webUrl||'', sp_item_id: item.id, sp_web_url: item.webUrl||'',
            comments:[], created: (item.createdDateTime||'').split('T')[0],
          });

          /* Design */
          for (const cat of paths.design.cats) {
            const files = await getChildren(`${paths.design.root}/${cat}`);
            files.filter(f=>!f.folder).forEach(f => {
              if (!designAssets.find(a=>a.sp_item_id===f.id)) { onSaveDesignAsset(mkAsset(f,cat)); addedCount++; }
            });
          }
          /* From Client */
          for (const cat of paths.from_client.cats) {
            const files = await getChildren(`${paths.from_client.root}/${cat}`);
            files.filter(f=>!f.folder).forEach(f => {
              if (!clientAssets.find(a=>a.sp_item_id===f.id)) { onSaveClientAsset(mkAsset(f,cat)); addedCount++; }
            });
          }
          /* Documents */
          for (const cat of paths.documents.cats) {
            const files = await getChildren(`${paths.documents.root}/${cat}`);
            files.filter(f=>!f.folder).forEach(f => {
              if (!documents.find(a=>a.sp_item_id===f.id)) { onSaveDocument(mkAsset(f,cat)); addedCount++; }
            });
          }
          showToast(t('des_toast_sync').replace('{{name}}',project.name).replace('{{n}}',addedCount));
        } catch(e) { showToast(t('des_err_prefix') + e.message); console.error(e); }
        setSpLoading(false);
      };

      /* ── Move asset between tabs (+ SP move) ── */
      const handleMoveAsset = async (asset, fromTab, toTab) => {
        if (!project) return;
        const paths = getSpPaths(project.name);
        const destCfg = paths[toTab];
        const destCat = destCfg.cats[0];
        /* Move in SharePoint */
        if (asset.sp_item_id && spUser) {
          try { await spMoveItem(asset.sp_item_id, `${destCfg.root}/${destCat}`); }
          catch(e) { showToast(t('des_sp_err_move') + e.message); return; }
        }
        /* Remove from source */
        if (fromTab==='design')      onDeleteDesignAsset(asset.id);
        else if (fromTab==='from_client') onDeleteClientAsset(asset.id);
        else if (fromTab==='documents')   onDeleteDocument(asset.id);
        /* Add to destination */
        const moved = { ...asset, category: destCat, sp_web_url: asset.sp_web_url };
        if (toTab==='design')      onSaveDesignAsset(moved);
        else if (toTab==='from_client') onSaveClientAsset(moved);
        else if (toTab==='documents')   onSaveDocument(moved);
        showToast(t('des_toast_moved').replace('{{dest}}', MOVE_TABS.find(tk=>tk.key===toTab)?.label||toTab));
      };

      /* ── SP-aware delete wrappers ── */
      const deleteDesign = async (asset) => {
        if (asset.sp_item_id && spUser) {
          try { await spDeleteFile(asset.sp_item_id); }
          catch(e) { showToast(t('des_sp_err_delete') + e.message); return; }
        }
        onDeleteDesignAsset(asset.id);
      };
      const deleteClient = async (asset) => {
        if (asset.sp_item_id && spUser) {
          try { await spDeleteFile(asset.sp_item_id); }
          catch(e) { showToast(t('des_sp_err_delete') + e.message); return; }
        }
        onDeleteClientAsset(asset.id);
      };
      const deleteDocument = async (doc) => {
        if (doc.sp_item_id && spUser) {
          try { await spDeleteFile(doc.sp_item_id); }
          catch(e) { showToast(t('des_sp_err_delete') + e.message); return; }
        }
        onDeleteDocument(doc.id);
      };

      /* ── Move between categories within same tab ── */
      const handleMoveCat = async (asset, fromTab, toCat) => {
        if (asset.category === toCat) return;
        if (asset.sp_item_id && spUser && spPaths) {
          const tabKey = fromTab==='from_client' ? 'from_client' : fromTab==='documents' ? 'documents' : 'design';
          try { await spMoveItem(asset.sp_item_id, `${spPaths[tabKey].root}/${toCat}`); }
          catch(e) { showToast(t('des_sp_err_move') + e.message); return; }
        }
        const updated = { ...asset, category: toCat };
        if (fromTab==='design')       onSaveDesignAsset(updated);
        else if (fromTab==='from_client') onSaveClientAsset(updated);
        else if (fromTab==='documents')   onSaveDocument(updated);
        showToast(t('des_toast_cat_moved').replace('{{cat}}', toCat));
      };

      return (
        <div>
          <div className="flex items-center justify-between mb-6">
            <div>
              <h1 className="text-2xl font-bold text-white">Design & Content</h1>
              <p className="text-slate-500 text-sm mt-0.5">{t('des_subtitle')}</p>
            </div>
            {/* SharePoint Connection */}
            <div className="flex items-center gap-2">
              {spUser ? (

    const SMLineChart = ({ growth, width=500, height=100 }) => {
      if (!growth) return null;
      const { facebook:fb=[], instagram:ig=[], tiktok:tt=[] } = growth;
      const all = [...fb,...ig,...tt].filter(v=>v!=null);
      if (!all.length) return null;
      const minV = Math.min(...all), maxV = Math.max(...all), range = maxV-minV||1;
      const toD = arr => arr.map((v,i)=>{
        const x = (i/(arr.length-1||1))*width;
        const y = height-((v-minV)/range)*(height-6)+3;
        return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      return (
        <svg viewBox={`0 0 ${width} ${height}`} className="w-full mt-1" style={{height:height}}>
          <path d={toD(fb)} stroke="#1877F2" strokeWidth="2" fill="none" strokeLinejoin="round"/>
          <path d={toD(ig)} stroke="#E1306C" strokeWidth="2" fill="none" strokeLinejoin="round"/>

    /* ── Meta Graph API fetch ── */

      const ig = account?.instagram;
      const GR = 'https://graph.facebook.com/v19.0';

      if (!fb?.connected || !fb?.page_id?.trim() || !fb?.page_token?.trim()) {
        showToast('أدخل Page ID وPage Token في إعدادات الحسابات أولاً');
        return;
      }
      const pid = fb.page_id.trim();
      const tok = fb.page_token.trim();

      showToast('جارٍ جلب البيانات من Meta...');
      try {
        /* ─ Facebook page ─ */
        const pageR = await fetch(`${GR}/${pid}?fields=name,fan_count,followers_count&access_token=${tok}`);
        const page  = await pageR.json();
        if (page.error) throw new Error('Facebook: ' + page.error.message);

        /* ─ Facebook insights (last month) ─ */
        const since = Math.floor(new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime()/1000);

      const w=window.open('','_blank','width=820,height=760');

    /* ── AdsManagerSubTab ── */
    const AdsManagerSubTab = ({ projId, adsData, project, client, showToast }) => {
      const { t } = useLang();
      const [monthFilter, setMonthFilter] = useState(()=>new Date().toISOString().slice(0,7));
      const data = adsData.find(d=>d.projectId===projId);

      if (!data) return <p className="text-slate-600 text-sm text-center py-16">{t('ads_no_data')}</p>;

      const totalSpend = ADS_PLATFORMS.reduce((s,pl)=>s+(data[pl]?.spend||0),0);

      return (
        <div className="space-y-6">
          {/* Filter + Report + Total */}
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div className="flex items-center gap-3">
              <span className="text-xs text-slate-400">{t('ads_month_filter')}:</span>
              <input type="month" value={monthFilter} onChange={e=>setMonthFilter(e.target.value)}
                className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white outline-none"/>
              {totalSpend > 0 && (
                <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-800 rounded-lg border border-slate-700">
                  <span className="text-xs text-slate-400">{t('ads_spend')}:</span>
                  <span className="text-xs font-bold text-white">${fmtK(totalSpend)}</span>
                </div>
              )}
            </div>
            <button onClick={()=>printAdsReport({project,client,data,month:monthFilter})}
              className="flex items-center gap-2 px-4 py-2 rounded-xl text-sm bg-emerald-600/15 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-600/25 transition-all">
              <Ic name="print" size={14}/> {t('ads_report')}
            </button>
          </div>

          {/* Platform cards 2x2 */}
          <div className="grid grid-cols-2 gap-4">
            {ADS_PLATFORMS.map(plat=>{
              const m  = ADS_PLAT_META[plat];
              const pd = data[plat]||{spend:0,active_campaigns:0,cpm:0,cpc:0,ctr:0,roas:0,campaigns:[]};
              return (
                <div key={plat} className={`bg-slate-900 border ${m.border} rounded-2xl p-5 space-y-4`}>
                  {/* Platform header */}
                  <div className="flex items-center justify-between">
                    <span className={`text-sm font-bold ${m.color}`}>{m.label}</span>
                    {pd.active_campaigns > 0 && (
                      <span className="text-[10px] px-2.5 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400">
                        {pd.active_campaigns} {t('ads_active_camps')}
                      </span>
                    )}
                  </div>

                  {pd.spend === 0
                    ? <p className="text-slate-600 text-xs text-center py-4">{t('ads_no_campaigns')}</p>
                    : (<>
                      {/* Metrics grid */}
                      <div className="grid grid-cols-3 gap-2">
                        <div className="bg-slate-800/50 rounded-xl p-3 text-center">
                          <div className="text-base font-bold text-white">${fmtK(pd.spend)}</div>
                          <div className="text-[10px] text-slate-500 mt-0.5">{t('ads_spend')}</div>
                        </div>
                        <div className="bg-slate-800/50 rounded-xl p-3 text-center">
                          <div className="text-base font-bold text-white">${pd.cpm}</div>
                          <div className="text-[10px] text-slate-500 mt-0.5">{t('ads_cpm')}</div>
                        </div>
                        <div className="bg-slate-800/50 rounded-xl p-3 text-center">
                          <div className="text-base font-bold text-white">${pd.cpc}</div>
                          <div className="text-[10px] text-slate-500 mt-0.5">{t('ads_cpc')}</div>
                        </div>
                        <div className="bg-slate-800/50 rounded-xl p-3 text-center">
                          <div className="text-base font-bold text-white">{pd.ctr}%</div>
                          <div className="text-[10px] text-slate-500 mt-0.5">{t('ads_ctr')}</div>
                        </div>
                        <div className="bg-slate-800/50 rounded-xl p-3 text-center col-span-2">
                          <div className="text-base font-bold text-emerald-400">{pd.roas}x</div>
                          <div className="text-[10px] text-slate-500 mt-0.5">{t('ads_roas')}</div>
                        </div>
                      </div>
                      {/* Campaigns by objective */}
                      {pd.campaigns.length > 0 && (
                        <div>
                          <p className="text-[11px] text-slate-500 mb-2">{t('ads_campaigns')}</p>
                          <div className="space-y-1.5">
                            {pd.campaigns.map(camp=>{
                              const obj = ADS_OBJ_MAP[camp.objective]||ADS_OBJ_MAP.reach;
                              return (
                                <div key={camp.id} className={`flex items-center justify-between px-3 py-2 rounded-lg ${obj.bg}`}>
                                  <div className="min-w-0 flex-1">
                                    <span className="text-xs text-white font-medium truncate block">{camp.name}</span>
                                    <span className={`text-[10px] ${obj.color}`}>{t(obj.key)}</span>
                                  </div>
                                  <div className="text-right flex-shrink-0 mr-3">
                                    <div className={`text-xs font-bold ${obj.color}`}>{fmtK(camp.results)}</div>
                                    <div className="text-[10px] text-slate-500">${camp.spend}</div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </>)
                  }
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    /* ── Main SocialMediaModule ── */
    const SocialMediaModule = ({ projects, clients, smStats, smPosts, smMessages, smAccounts, adsData, onSavePost, onDeletePost, onReadMessage, onSaveAccount, onUpdateStats, onSaveAdsData, showToast }) => {
      const { t } = useLang();
      const [subTab, setSubTab]         = useState('social'); // 'social' | 'ads'
      const [projId, setProjId]         = useState(projects[0]?.id||null);
      const [modal, setModal]           = useState(null);
      const [editPost, setEditPost]     = useState(null);
      const [monthFilter, setMonthFilter] = useState(()=>new Date().toISOString().slice(0,7));
      const [periodFrom, setPeriodFrom] = useState('');
      const [periodTo,   setPeriodTo]   = useState('');
      const [syncing, setSyncing]       = useState(false);

      const project  = projects.find(p=>p.id===projId);
      const client   = project ? clients.find(c=>c.id===project.clientId) : null;
      const stats    = smStats.find(s=>s.projectId===projId);
      const account  = smAccounts.find(a=>a.projectId===projId);
      const posts    = smPosts.filter(p=>p.projectId===projId);
      const unread   = smMessages.filter(m=>m.projectId===projId&&!m.read).length;

      const totalF  = stats ? stats.facebook.followers+stats.instagram.followers+stats.tiktok.followers : 0;
      const totalR  = stats ? stats.facebook.reach+stats.instagram.reach+stats.tiktok.reach : 0;
      const engRate = stats ? (((stats.facebook.likes+stats.instagram.likes+stats.tiktok.likes)/Math.max(totalF,1))*100).toFixed(1) : '0.0';
      const uniqueV = stats?.unique_views||0;

      const bestPosts      = [...posts].filter(p=>p.status==='published'&&(p.scheduled_date||'').startsWith(monthFilter)).sort((a,b)=>(b.engagement_rate||0)-(a.engagement_rate||0)).slice(0,5);
      const publishedPosts = [...posts].filter(p=>p.status==='published').sort((a,b)=>(b.scheduled_date||'').localeCompare(a.scheduled_date||''));
      const upcoming       = [...posts].filter(p=>['scheduled','reviewing'].includes(p.status)).sort((a,b)=>a.scheduled_date.localeCompare(b.scheduled_date)).slice(0,6);

      /* Period filter */
      const hasPeriod   = !!(periodFrom||periodTo);
      const periodPosts = publishedPosts.filter(p=>{
        const d = p.scheduled_date||'';
        if(periodFrom && d < periodFrom) return false;
        if(periodTo   && d > periodTo)   return false;
        return true;
      });
      const periodLikes = periodPosts.reduce((s,p)=>s+(p.likes||0),0);
      const periodReach = periodPosts.reduce((s,p)=>s+(p.reach||0),0);
      const periodImp   = periodPosts.reduce((s,p)=>s+(p.impressions||0),0);

      const openEdit = p => { setEditPost(p); setModal('edit_post'); };
      const handleDelete = id => { if(confirm(t('soc_del_confirm'))) { onDeletePost(id); showToast(t('soc_del_post_toast')); } };

      const kpiCards = [
        { labelKey:'soc_kpi_followers', value:fmtK(totalF),  icon:'users',   grad:'from-blue-600 to-blue-800'    },
        { labelKey:'soc_kpi_eng',       value:engRate+'%',   icon:'trending', grad:'from-emerald-600 to-emerald-800' },
        { labelKey:'soc_kpi_reach',     value:fmtK(totalR),  icon:'bar2',    grad:'from-blue-600 to-blue-800'    },
        { labelKey:'soc_kpi_views',     value:fmtK(uniqueV), icon:'eye',     grad:'from-amber-600 to-amber-800'  },
      ];

      return (
        <div className="space-y-6">
          {/* Header + project selector */}
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-2xl font-bold text-white">{t('soc_title')}</h1>
              <p className="text-slate-400 text-sm mt-0.5">{client?.name||project?.name||t('soc_select_proj')}</p>
            </div>
            <div className="flex items-center gap-3">
              {subTab==='social' && (
                <button
                  onClick={async()=>{
                    setSyncing(true);
                    await fetchMetaStats({ account, projId, onUpdateStats, onAddPosts:newPosts=>newPosts.forEach(p=>onSavePost(p)), showToast });
                    setSyncing(false);
                  }}
                  disabled={syncing} title={t('soc_sync_title')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-xl border text-sm font-medium transition-all ${syncing?'border-slate-700 text-slate-500 cursor-not-allowed':'border-blue-500/40 text-blue-300 bg-blue-600/10 hover:bg-blue-600/20'}`}>
                  <span className={syncing?'animate-spin inline-block':''}>⟳</span>
                  {syncing?t('soc_syncing'):t('soc_sync_btn')}
                </button>
              )}
              <select value={projId||''} onChange={e=>setProjId(Number(e.target.value))}
                className="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white outline-none focus:border-blue-500 min-w-[180px]">
                {projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
          </div>

          {/* Sub-tabs */}
          <div className="flex items-center gap-1 bg-slate-900 border border-slate-800 rounded-xl p-1 w-fit">
            {[{id:'social',labelKey:'soc_tab_social'},{id:'ads',labelKey:'soc_tab_ads'}].map(tab=>(
              <button key={tab.id} onClick={()=>setSubTab(tab.id)}
                className={`px-6 py-2 rounded-lg text-sm font-medium transition-all ${subTab===tab.id?'bg-blue-600 text-white shadow-sm':'text-slate-400 hover:text-white'}`}>
                {t(tab.labelKey)}
              </button>
            ))}
          </div>

          {/* ── Social Media sub-tab ── */}
          {subTab==='social' && (
            <div className="space-y-6">

              {/* KPI cards */}
              <div className="grid grid-cols-4 gap-4">
                {kpiCards.map(k=>(
                  <div key={k.labelKey} className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                    <div className={`w-9 h-9 rounded-xl bg-gradient-to-br ${k.grad} flex items-center justify-center text-white mb-3`}><Ic name={k.icon} size={16}/></div>
                    <div className="text-2xl font-bold text-white">{k.value}</div>
                    <div className="text-xs text-slate-400 mt-1">{t(k.labelKey)}</div>
                  </div>
                ))}
              </div>

              {/* Period filter */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                <div className="flex items-center gap-4 flex-wrap mb-3">
                  <h3 className="font-bold text-white text-sm">{t('soc_period_filter')}</h3>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-400">{t('soc_date_from')}</span>
                    <input type="date" value={periodFrom} onChange={e=>setPeriodFrom(e.target.value)}
                      className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white outline-none"/>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-400">{t('soc_date_to')}</span>
                    <input type="date" value={periodTo} onChange={e=>setPeriodTo(e.target.value)}
                      className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white outline-none"/>
                  </div>
                  {hasPeriod && (
                    <button onClick={()=>{setPeriodFrom('');setPeriodTo('');}}
                      className="text-[11px] text-slate-500 hover:text-slate-300 px-2 py-1 rounded">
                      ✕ {t('soc_clear_filter')}
                    </button>
                  )}
                </div>
                {!hasPeriod && <p className="text-slate-600 text-xs text-center py-1">{t('soc_period_hint')}</p>}
                {hasPeriod && periodPosts.length===0 && <p className="text-slate-600 text-xs text-center py-2">{t('soc_period_no_data')}</p>}
                {hasPeriod && periodPosts.length>0 && (
                  <div className="grid grid-cols-4 gap-3 mt-1">
                    {[
                      { label:t('soc_period_total_likes'), value:fmtK(periodLikes), color:'text-blue-400'   },
                      { label:t('soc_period_total_reach'), value:fmtK(periodReach), color:'text-emerald-400'},
                      { label:t('soc_period_total_imp'),   value:fmtK(periodImp),   color:'text-purple-400' },
                      { label:t('soc_period_new_foll'),    value:fmtK(totalF),      color:'text-amber-400'  },
                    ].map(c=>(
                      <div key={c.label} className="bg-slate-800/50 rounded-xl p-3 text-center">
                        <div className={`text-xl font-bold ${c.color}`}>{c.value}</div>
                        <div className="text-[10px] text-slate-500 mt-0.5">{c.label}</div>
                        <div className="text-[9px] text-slate-600 mt-0.5">{periodPosts.length} {t('soc_posts')||'منشور'}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Platform cards */}
              <div className="grid grid-cols-3 gap-4">
                {SM_PLATFORMS.map(plat=>{
                  const m=PLATFORM_META[plat]; const st=stats?.[plat];
                  return (
                    <div key={plat} className={`bg-slate-900 border ${m.border} rounded-2xl p-5`}>
                      <div className={`text-sm font-bold mb-1 ${m.text}`}>{m.label}</div>
                      <div className="text-3xl font-black text-white mb-3">{st?fmtK(st.followers):'—'}</div>
                      <div className="grid grid-cols-3 gap-2">
                        {m.metrics.map(key=>(
                          <div key={key} className={`${m.bg} rounded-lg p-2 text-center`}>
                            <div className={`text-sm font-bold ${m.text}`}>{st?fmtK(st[key]||0):'—'}</div>
                            <div className="text-[10px] text-slate-500 mt-0.5">{m.metaLabels[key]}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Post Details table */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                <div className="mb-4">
                  <h3 className="font-bold text-white text-sm">{t('soc_post_details')}</h3>
                  <p className="text-slate-500 text-[11px] mt-0.5">{t('soc_post_details_sub')}</p>
                </div>
                {publishedPosts.length===0
                  ? <p className="text-slate-600 text-xs text-center py-6">{t('soc_no_pub_posts')}</p>
                  : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-xs" style={{direction:'rtl'}}>
                        <thead>
                          <tr className="border-b border-slate-800">
                            {[
                              t('soc_post_title'), t('soc_platforms'), t('soc_post_date'),
                              t('soc_reach'), t('soc_impressions'), t('soc_views_lbl'),
                              t('soc_likes'), t('soc_comments'), t('soc_saves'), t('soc_kpi_eng')
                            ].map(h=>(
                              <th key={h} className="pb-2.5 text-slate-500 font-medium text-right pr-3 whitespace-nowrap">{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/40">
                          {publishedPosts.map(p=>(
                            <tr key={p.id} className="hover:bg-slate-800/40 transition-all cursor-pointer" onClick={()=>openEdit(p)}>
                              <td className="py-2.5 pr-3 text-white font-medium max-w-[150px]">
                                <span className="truncate block">{p.title}</span>
                              </td>
                              <td className="py-2.5 pr-3">
                                <div className="flex gap-1">
                                  {(p.platforms||[]).map(pl=><span key={pl} className={`text-[9px] ${PLATFORM_META[pl]?.text}`}>{PLATFORM_META[pl]?.label}</span>)}
                                </div>
                              </td>
                              <td className="py-2.5 pr-3 text-slate-400 whitespace-nowrap">{p.scheduled_date||'—'}</td>
                              <td className="py-2.5 pr-3 text-slate-300">{p.reach!=null?fmtK(p.reach):'—'}</td>
                              <td className="py-2.5 pr-3 text-slate-300">{p.impressions!=null?fmtK(p.impressions):'—'}</td>
                              <td className="py-2.5 pr-3 text-slate-300">{p.views_reach!=null?fmtK(p.views_reach):'—'}</td>
                              <td className="py-2.5 pr-3 text-slate-300">{p.likes!=null?fmtK(p.likes):'—'}</td>
                              <td className="py-2.5 pr-3 text-slate-300">{p.comments!=null?fmtK(p.comments):'—'}</td>
                              <td className="py-2.5 pr-3 text-slate-300">{p.saves!=null?fmtK(p.saves):'—'}</td>
                              <td className="py-2.5 pr-3 font-bold text-emerald-400">{p.engagement_rate!=null?p.engagement_rate+'%':'—'}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )
                }
              </div>

              {/* Top posts + Audience */}
              <div className="grid grid-cols-2 gap-4">
                {/* Top Posts */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                  <div className="flex items-center justify-between mb-4">
                    <div>
                      <h3 className="font-bold text-white text-sm">{t('soc_top_posts')}</h3>
                      <p className="text-slate-500 text-[11px] mt-0.5">{t('soc_by_eng')}</p>
                    </div>
                    <input type="month" value={monthFilter} onChange={e=>setMonthFilter(e.target.value)}
                      className="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white outline-none"/>
                  </div>
                  {bestPosts.length===0 && <p className="text-slate-600 text-xs text-center py-6">{t('soc_no_posts_month')}</p>}
                  <div className="space-y-2">
                    {bestPosts.map((p,i)=>{
                      const colors=['bg-blue-500','bg-blue-500','bg-emerald-500','bg-amber-500','bg-rose-500'];
                      return (
                        <div key={p.id} className="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-800/60 transition-all cursor-pointer" onClick={()=>openEdit(p)}>
                          <div className={`w-6 h-6 rounded-lg ${colors[i]||'bg-slate-600'} flex items-center justify-center text-white text-[10px] font-bold flex-shrink-0`}>{i+1}</div>
                          <div className="flex-1 min-w-0">
                            <div className="text-xs text-white font-medium truncate">{p.title}</div>
                            <div className="flex items-center gap-1.5 mt-0.5">
                              {(p.platforms||[]).map(pl=><span key={pl} className={`text-[9px] ${PLATFORM_META[pl]?.text}`}>{PLATFORM_META[pl]?.label}</span>)}
                              <span className="text-[9px] text-slate-600">·</span>
                              <span className="text-[9px] text-slate-500">{p.content_type}</span>
                            </div>
                          </div>
                          <div className="text-right flex-shrink-0">
                            <div className="text-xs font-bold text-emerald-400">{p.engagement_rate}%</div>
                            <div className="text-[9px] text-slate-500">{p.views_reach?fmtK(p.views_reach):''} {p.views_type||''}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Audience */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                  <h3 className="font-bold text-white text-sm">{t('soc_audience')}</h3>
                  {!stats?.audience ? <p className="text-slate-600 text-xs">{t('no_data')}</p> : <>
                    <div>
                      <div className="flex justify-between text-xs text-slate-400 mb-1">
                        <span>{t('soc_males')} {stats.audience.gender.male}%</span>
                        <span>{t('soc_females')} {stats.audience.gender.female}%</span>
                      </div>
                      <div className="h-2 bg-slate-800 rounded-full overflow-hidden flex">
                        <div className="bg-blue-500 h-full rounded-r-full" style={{width:`${stats.audience.gender.male}%`}}/>
                        <div className="bg-pink-500 h-full rounded-l-full flex-1"/>
                      </div>
                    </div>
                    <div>
                      <p className="text-[11px] text-slate-500 mb-2">{t('soc_age_group')}</p>
                      <div className="space-y-1.5">
                        {stats.audience.age.map(a=>(
                          <div key={a.label} className="flex items-center gap-2">
                            <span className="text-[10px] text-slate-400 w-12 flex-shrink-0">{a.label}</span>
                            <div className="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                              <div className="bg-blue-500 h-full rounded-full" style={{width:`${a.pct}%`}}/>
                            </div>
                            <span className="text-[10px] text-slate-500 w-6 text-left">{a.pct}%</span>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div>
                      <p className="text-[11px] text-slate-500 mb-2">{t('soc_top_cities')}</p>
                      <div className="space-y-1">

                          <div className="flex-1 min-w-0">

                            <div className="flex items-center gap-1 mt-0.5">
                              {(p.platforms||[]).map(pl=><span key={pl} className={`text-[9px] ${PLATFORM_META[pl]?.text}`}>{PLATFORM_META[pl]?.label}</span>)}
                            </div>
                          </div>
                          <span className={`text-[10px] px-2 py-0.5 rounded-full border ${st.badge} flex-shrink-0`}>{sl(st,t)}</span>
                        </div>

                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                  <h3 className="font-bold text-white text-sm mb-4">{t('soc_quick_actions')}</h3>
                  <div className="grid grid-cols-2 gap-3">
                    {[
                      { labelKey:'soc_new_post',  descKey:'soc_qa_new_post_desc', icon:'send',     action:()=>setModal('new_post'),                                                             color:'text-blue-400'    },
                      { labelKey:'soc_msgs',       desc:`${unread} ${t('soc_qa_msgs_desc')}`,     icon:'mail',     action:()=>setModal('messages'),                                             color:'text-blue-400'    },
                      { labelKey:'soc_qa_report', descKey:'soc_qa_report_desc',    icon:'print',    action:()=>printSMReport({project,client,stats,posts,month:monthFilter}),                    color:'text-emerald-400' },
                      { labelKey:'soc_accounts',  descKey:'soc_qa_accounts_desc',  icon:'settings2',action:()=>setModal('accounts'),                                                             color:'text-amber-400'   },
                    ].map(a=>(
                      <button key={a.labelKey} onClick={a.action} className="flex flex-col items-start p-4 bg-slate-800/60 rounded-xl border border-slate-700 hover:border-slate-600 hover:bg-slate-800 transition-all text-right">
                        <span className={`mb-2 ${a.color}`}><Ic name={a.icon} size={18}/></span>
                        <span className="text-sm font-medium text-white">{t(a.labelKey)}</span>
                        <span className="text-[11px] text-slate-500 mt-0.5">{a.desc||t(a.descKey)}</span>
