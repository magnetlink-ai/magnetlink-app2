    const Dashboard = ({ leads, clients, projects, invoices, expenses, teamMembers, attendance,
                          designAssets, smStats, smPosts, smMessages, taskTasks, announcements,
                          currentUser, customRoles, setPage, dashShortcuts, onSaveShortcuts }) => {
      const { t, lang } = useLang();
      const [showCustomize, setShowCustomize] = useState(false);
      const widgetData = { leads, clients, projects, invoices, expenses, teamMembers, attendance,
                           designAssets, smStats, smPosts, smMessages, taskTasks, announcements };
      const total    = leads.length;
      const won      = leads.filter(l => l.status === 'won').length;
      const lost     = leads.filter(l => l.status === 'lost').length;
      const active   = leads.filter(l => LEAD_STATUSES.find(s => s.id === l.status)?.active);

      // Weighted pipeline: Σ(price × prob/100) for active leads only
      const pipeline = active.reduce((s, l) => s + (l.price_quote * (l.probability / 100)), 0);

      const stats = [
        { label:t('dash_total_leads'), value:total,                   sub:`${active.length} ${t('dash_active_sub')}`,    grad:'from-blue-600 to-blue-800', icon:'crm' },
        { label:t('dash_pipeline'),    value:`$${Math.round(pipeline).toLocaleString()}`, sub:t('dash_pipeline_sub'), grad:'from-blue-600 to-blue-800',   icon:'finance' },
        { label:t('dash_converted'),   value:won,                     sub:`${total > 0 ? Math.round(won/total*100) : 0}% ${t('dash_conv_rate')}`, grad:'from-emerald-600 to-emerald-800', icon:'client' },
        { label:t('dash_lost'),        value:lost,                    sub:`${total > 0 ? Math.round(lost/total*100) : 0}% ${t('dash_from_total')}`, grad:'from-rose-600 to-rose-800', icon:'x' },
      ];

      const byStatus = LEAD_STATUSES.map(s => ({
        ...s,
        count: leads.filter(l => l.status === s.id).length,
        weighted: leads.filter(l => l.status === s.id).reduce((sm, l) => sm + l.price_quote * (l.probability/100), 0),
      })).filter(s => s.count > 0);

      const recent = [...leads].sort((a,b) => b.created.localeCompare(a.created)).slice(0, 6);

      const activeWidgets = (dashShortcuts || [])
        .map(id => SECTION_WIDGET_DEFS.find(s => s.id === id))

    /* ═══════════════════════════ INLINE EDIT ═══════════════════════════ */

    // General-purpose inline editable cell
    const InlineEdit = ({ value, onChange, type='text', options, suffix='' }) => {
      const [editing, setEditing] = useState(false);
      const [val, setVal]         = useState(value);
      const ref                   = useRef(null);

      useEffect(() => { setVal(value); }, [value]);
      useEffect(() => { if (editing && ref.current) ref.current.focus(); }, [editing]);

      const save = () => { if (val !== value) onChange(val); setEditing(false); };
      const cancel = () => { setVal(value); setEditing(false); };

      const display = type === 'select'
        ? (options?.find(o => o.value === value)?.label ?? value)
        : type === 'number'
        ? (Number(value) > 0 ? `$${Number(value).toLocaleString()}` : <span className="text-slate-600">—</span>)
        : type === 'percent'
        ? <span>{value}%</span>
        : (value || <span className="text-slate-600 text-xs">—</span>);

      const cls = "bg-slate-700 border border-blue-500 rounded-md px-2 py-0.5 text-sm text-white outline-none w-full";

      if (!editing) return (
        <span onClick={() => setEditing(true)}
          className="cursor-text hover:text-blue-300 transition-colors">
          {display}{suffix && value ? suffix : ''}
        </span>
      );

      if (type === 'select') return (
        <select ref={ref} value={val} onChange={e => setVal(e.target.value)} onBlur={save} className={cls}>
          {options?.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
      );

      return (
        <input ref={ref}
          type={type === 'percent' ? 'number' : type === 'number' ? 'number' : 'text'}
          min={type === 'percent' ? 0 : undefined}
          max={type === 'percent' ? 100 : undefined}
          value={val}
          onChange={e => setVal(['number','percent'].includes(type) ? Number(e.target.value) : e.target.value)}
          onBlur={save}
          onKeyDown={e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') cancel(); }}
          className={cls}
        />
      );
    };

    /* ═══════════════════════════ NOTES CELL ═══════════════════════════ */

    const NotesCell = ({ value, onChange, expanded, onToggle }) => {
      const { t } = useLang();
      const [editing, setEditing] = useState(false);
      const [val, setVal]         = useState(value);
      const ref                   = useRef(null);

      useEffect(() => { setVal(value); }, [value]);
      useEffect(() => { if (editing && ref.current) ref.current.focus(); }, [editing]);

      const save = () => { if (val !== value) onChange(val); setEditing(false); };

      if (editing) return (
        <textarea ref={ref} value={val}
          onChange={e => setVal(e.target.value)}
          onBlur={save}
          onKeyDown={e => { if (e.key === 'Escape') { setVal(value); setEditing(false); } }}
          rows={3}
          className="bg-slate-700 border border-blue-500 rounded-lg px-2 py-1.5 text-xs text-white outline-none w-full resize-none min-w-[200px]"
        />
      );

      if (!value) return (
        <span onClick={() => setEditing(true)}
          className="text-slate-600 text-xs cursor-text hover:text-slate-400 transition-colors">—</span>
      );

      if (expanded) return (
        <div className="min-w-[200px]">
          <div className="text-xs text-slate-300 leading-relaxed whitespace-pre-wrap">{value}</div>
          <div className="flex gap-3 mt-1.5">

            <button onClick={onToggle} className="text-[10px] text-slate-500 hover:text-slate-300">{t('notes_fold')}</button>

      return (

    const StatusDropdown = ({ current, onSelect, onClose }) => {

    /* ═══════════════════════════ CRM MODULE ═══════════════════════════ */

    const CRM = ({ leads, onUpdate, onDelete, clients }) => {
      const { t } = useLang();
      const [filterStatus, setFilterStatus] = useState('all');
      const [search,       setSearch]       = useState('');
      const [cols,         setCols]         = useState({ email:false, probability:true, price_quote:true, notes:true });
      const [newModal,     setNewModal]     = useState(false);
      const [viewLead,     setViewLead]     = useState(null);
      const [openDrop,     setOpenDrop]     = useState(null);
      const [expandedNote, setExpandedNote] = useState(null); // lead.id | null

      const filtered = leads.filter(l => {
        const okStatus = filterStatus === 'all' || l.status === filterStatus;
        const q = search.toLowerCase();
        const okSearch = !q || l.name.toLowerCase().includes(q)
                            || l.phone.includes(q)
                            || l.email.toLowerCase().includes(q);
        return okStatus && okSearch;

      const active   = leads.filter(l => LEAD_STATUSES.find(s => s.id === l.status)?.active).length;
      const pipeline = leads
        .filter(l => LEAD_STATUSES.find(s => s.id === l.status)?.active)

      // Column definitions

        { key:'name',    header:t('crm_col_name') },
        { key:'phone',   header:t('phone') },
        { key:'source',  header:t('crm_col_source') },
        { key:'service', header:t('crm_col_service') },
        { key:'status',  header:t('status') },

                <tbody>

                  {filtered.map(lead => (
                    <tr key={lead.id}

                      {/* Name */}
                      <td className="px-4 py-3">
                        <div className="flex items-center gap-2.5">
                          <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500/25 to-blue-500/25 flex items-center justify-center text-sm font-bold text-blue-300 flex-shrink-0">

                          <div className="min-w-0">

                          </div>
                        </div>
                      </td>

                      {/* Phone */}
                      <td className="px-4 py-3 text-slate-300">
                        <InlineEdit value={lead.phone} onChange={v => onUpdate(lead.id,'phone',v)} />
                      </td>

                      {/* Email (optional) */}
                      {cols.email && (
                        <td className="px-4 py-3 text-slate-300">
                          <InlineEdit value={lead.email} onChange={v => onUpdate(lead.id,'email',v)} />
                        </td>
                      )}

                      {/* Source */}
                      <td className="px-4 py-3 text-slate-300">
                        <InlineEdit value={lead.source} type="select"
                          options={SOURCES.map(s => ({value:s, label:s}))}
                          onChange={v => onUpdate(lead.id,'source',v)} />
                      </td>

                      {/* Service */}
                      <td className="px-4 py-3 text-slate-300">
                        <InlineEdit value={lead.service} type="select"
                          options={SERVICES.map(s => ({value:s, label:s}))}
                          onChange={v => onUpdate(lead.id,'service',v)} />
                      </td>

                      {/* Probability (optional) */}
                      {cols.probability && (
                        <td className="px-4 py-3 text-slate-300">
                          <InlineEdit value={lead.probability} type="percent"
                            onChange={v => onUpdate(lead.id,'probability', Math.min(100, Math.max(0, v)))} />
                        </td>
                      )}

                      {/* Price (optional) */}
                      {cols.price_quote && (
                        <td className="px-4 py-3 text-slate-300">
                          <InlineEdit value={lead.price_quote} type="number"

                      <td className="px-4 py-3">
                        <div className="relative inline-block">
                          <StatusBadge statusId={lead.status}
                            onClick={() => setOpenDrop(p => p === lead.id ? null : lead.id)} />

                            <StatusDropdown

                              onSelect={v => { onUpdate(lead.id,'status',v); setOpenDrop(null); }}

                            />

                        </div>
                      </td>

                      {/* Notes (optional) */}
                      {cols.notes && (
                        <td className="px-4 py-3">
                          <NotesCell
                            value={lead.notes}
                            onChange={v => onUpdate(lead.id,'notes',v)}
                            expanded={expandedNote === lead.id}

                            className="p-1.5 rounded-lg text-slate-600 hover:text-red-400 hover:bg-red-500/10 transition-all" title={t('delete')}>
                            <Ic name="trash" size={13} />
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Modals */}
          {newModal && (
            <NewLeadModal
              onSave={lead => onUpdate(null, null, null, lead)}
              onClose={() => setNewModal(false)}
            />
          )}
          {viewLead && (
            <ViewModal
              lead={viewLead}
              clients={clients}
              onUpdate={updated => { onUpdate(updated.id, '_full', updated); setViewLead(null); }}
              onClose={() => setViewLead(null)}
            />
          )}
        </div>
      );
    };

    /* ═══════════════════════════ PRINT INVOICE UTILITY ═══════════════════════════ */

      const itemRows = invoice.items.map(it=>`

      const html=`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>${invoice.inv_no}</title>

    /* ═══════════════════════════ INVOICE FORM OVERLAY ═══════════════════════════ */

    const InvoiceFormOverlay = ({ invoice, project, projects, allInvoices, onSave, onClose }) => {
      const { t } = useLang();
      const isEdit = !!invoice;
      const nextNo = `INV-${String(allInvoices.length + (isEdit?0:1)).padStart(3,'0')}`;
      const [selectedProjectId, setSelectedProjectId] = useState(project?.id ? String(project.id) : '');

      const [f, setF] = useState(isEdit
        ? { ...invoice, items:invoice.items.map(i=>({...i})), payments:invoice.payments.map(p=>({...p})) }

      const remItem  = id => setF(p=>({...p,items:p.items.filter(i=>i.id!==id)}));
      const updItem  = (id,k,v) => setF(p=>({...p,items:p.items.map(i=>i.id===id?{...i,[k]:v}:i)}));
      const addPmt   = () => setF(p=>({...p,payments:[...p.payments,{id:Date.now(),pct:0,status:'pending'}]}));
      const remPmt   = id => setF(p=>({...p,payments:p.payments.filter(x=>x.id!==id)}));
      const updPmt   = (id,k,v) => setF(p=>({...p,payments:p.payments.map(x=>x.id===id?{...x,[k]:v}:x)}));

      const save = () => {
        if(!resolvedProject){alert(t('inv_err_project'));return;}
        if(pctSum!==100){alert(t('inv_err_pct').replace('{{n}}',pctSum));return;}

                  <button onClick={addItem} className="flex items-center gap-1 text-xs text-blue-400 hover:text-blue-300"><Ic name="plus" size={12}/>{t('inv_add_item')}</button>
                </div>
                <div className="bg-slate-900/50 rounded-xl overflow-hidden border border-slate-700/50">
                  <table className="w-full text-xs">
                    <thead><tr className="border-b border-slate-700/60">
                      <th className="px-3 py-2 text-slate-500 font-medium text-right">{t('inv_desc_col')}</th>
                      <th className="px-3 py-2 text-slate-500 font-medium w-16 text-center">{t('inv_qty_col')}</th>
                      <th className="px-3 py-2 text-slate-500 font-medium w-24 text-center">{t('inv_unit_price_col')}</th>
                      <th className="px-3 py-2 text-slate-500 font-medium w-20 text-center">{t('inv_total_col')}</th>
                      <th className="w-8"></th>
                    </tr></thead>
                    <tbody>
                      {f.items.map(item=>(
                        <tr key={item.id} className="border-b border-slate-700/30">
                          <td className="px-2 py-1.5"><input value={item.desc} onChange={e=>updItem(item.id,'desc',e.target.value)} placeholder={t('inv_item_ph')} className="w-full bg-slate-700/60 border border-slate-600 focus:border-blue-500 rounded px-2 py-1 text-xs text-white outline-none"/></td>
                          <td className="px-2 py-1.5"><input type="number" min="1" value={item.qty} onChange={e=>updItem(item.id,'qty',Number(e.target.value))} className="w-full bg-slate-700/60 border border-slate-600 focus:border-blue-500 rounded px-2 py-1 text-xs text-white outline-none text-center"/></td>
                          <td className="px-2 py-1.5"><input type="number" min="0" step="0.01" value={item.unit_price} onChange={e=>updItem(item.id,'unit_price',Number(e.target.value))} className="w-full bg-slate-700/60 border border-slate-600 focus:border-blue-500 rounded px-2 py-1 text-xs text-white outline-none text-center"/></td>
                          <td className="px-2 py-1.5 text-center text-slate-300">${(item.qty*item.unit_price).toFixed(2)}</td>
                          <td className="px-1 py-1.5">{f.items.length>1&&<button onClick={()=>remItem(item.id)} className="text-slate-600 hover:text-red-400"><Ic name="x" size={12}/></button>}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              {/* Tax + Totals */}
              <div className="flex items-start justify-between gap-4">
                <div className="w-32"><label className="text-xs text-slate-400 block mb-1">{t('inv_tax')}</label>
                  <input type="number" min="0" max="100" step="0.5" value={f.tax} onChange={e=>setF(p=>({...p,tax:Number(e.target.value)}))} className={inputCls}/></div>
                <div className="text-left space-y-1 text-sm">
                  <div className="flex justify-between gap-8 text-slate-400"><span>{t('inv_subtotal')}</span><span className="text-white">${subtotal.toFixed(2)}</span></div>
                  {(f.tax||0)>0&&<div className="flex justify-between gap-8 text-slate-400"><span>{t('inv_tax')} ({f.tax}%)</span><span className="text-white">${taxAmt.toFixed(2)}</span></div>}
                  <div className="flex justify-between gap-8 font-semibold text-white border-t border-slate-600 pt-1"><span>{t('inv_grand_total')}</span><span>${grandTotal.toFixed(2)}</span></div>
                </div>
              </div>
              {/* Payment Breakdown */}
              <div>
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2">
                    <span className="text-sm font-medium text-slate-300">{t('inv_breakdown')}</span>
                    <span className={`text-xs px-2 py-0.5 rounded-full border ${pctSum===100?'bg-emerald-500/15 text-emerald-300 border-emerald-500/30':'bg-red-500/15 text-red-300 border-red-500/30'}`}>
                      {pctSum}%{pctSum!==100&&' '+t('inv_must_100')}
                    </span>
                  </div>
                  <button onClick={addPmt} className="flex items-center gap-1 text-xs text-blue-400 hover:text-blue-300"><Ic name="plus" size={12}/>{t('inv_add_pmt')}</button>
                </div>
                <div className="space-y-2">
                  {f.payments.map((pmt,idx)=>(
                    <div key={pmt.id} className="flex items-center gap-2 bg-slate-900/40 rounded-xl p-3 border border-slate-700/40">
                      <span className="text-xs text-slate-500 w-20 flex-shrink-0">Payment {idx+1}</span>
                      <input type="number" min="0" max="100" value={pmt.pct} onChange={e=>updPmt(pmt.id,'pct',Number(e.target.value))} className="w-16 bg-slate-700/60 border border-slate-600 focus:border-blue-500 rounded px-2 py-1 text-xs text-white outline-none text-center"/>
                      <span className="text-xs text-slate-500">%</span>
                      <span className="text-xs text-slate-400 flex-1">= ${(grandTotal*pmt.pct/100).toFixed(2)}</span>
                      <select value={pmt.status} onChange={e=>updPmt(pmt.id,'status',e.target.value)} className="bg-slate-700/60 border border-slate-600 rounded px-2 py-1 text-xs text-white outline-none">
                        <option value="pending">{t('inv_pending')}</option>
                        <option value="paid">{t('fin_status_paid')}</option>
                      </select>
                      {f.payments.length>1&&<button onClick={()=>remPmt(pmt.id)} className="text-slate-600 hover:text-red-400"><Ic name="x" size={12}/></button>}
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div className="flex gap-3 px-5 pb-5 sticky bottom-0 bg-slate-800 pt-3 border-t border-slate-700">
              <button onClick={save} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-2.5 text-sm font-medium transition-colors shadow-lg shadow-blue-500/20">
                {isEdit ? t('tm_save_changes') : t('inv_create')}

              <button onClick={onClose} className="px-5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl py-2.5 text-sm transition-colors">{t('cancel')}</button>

    /* ═══════════════════════════ PROJECT DETAIL ═══════════════════════════ */

    const ProjectDetailPage = ({ project, client, invoices, clients, onBack, onSaveInvoice, onDeleteInvoice, onSaveProject, showToast }) => {
      const { t } = useLang();
      const [tab, setTab]           = useState('overview');
      const [invFormOpen, setForm]  = useState(false);
      const [editInv, setEditInv]   = useState(null);
      const [editOpen, setEditOpen] = useState(false);
      const [ef, setEf]             = useState({});
      const inputCls = "w-full bg-slate-700 border border-slate-600 focus:border-blue-500 rounded-lg px-3 py-2 text-sm text-white outline-none";
      const dl = DELIVERY_STATUSES.find(s=>s.id===project.delivery);
      const projInvs = invoices.filter(i=>i.projectId===project.id);
      const totalPaid = projInvs.reduce((sum,inv)=>{
        const gt=inv.items.reduce((s,i)=>s+i.qty*i.unit_price,0)*(1+(inv.tax||0)/100);
        return sum+inv.payments.filter(p=>p.status==='paid').reduce((s,p)=>s+gt*p.pct/100,0);
      },0);
      const TABS=[{id:'overview',labelKey:'proj_tab_overview'},{id:'invoices',labelKey:'proj_tab_invoices',count:projInvs.length},{id:'details',labelKey:'proj_tab_details'}];
      return (
        <div className="space-y-5">
          <button onClick={onBack} className="flex items-center gap-1.5 text-slate-500 hover:text-slate-300 text-sm transition-colors">
            {t('proj_back')} <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <div className="flex items-start gap-4">
            <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-blue-600 flex items-center justify-center flex-shrink-0 shadow-lg shadow-blue-500/20">
              <Ic name="projects" size={26}/>
            </div>
            <div className="flex-1">
              <div className="flex items-center gap-3 flex-wrap">
                <h1 className="text-2xl font-bold text-white">{project.name}</h1>
                {dl&&<span className={`text-xs px-2.5 py-1 rounded-full border flex items-center gap-1.5 ${dl.badge}`}><span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${dl.dot}`}/>{sl(dl,t)}</span>}
                <button onClick={()=>{setEf({name:project.name,clientId:project.clientId,service_requested:project.service_requested,start_date:project.start_date,delivery:project.delivery});setEditOpen(true);}} className="text-xs px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg border border-slate-600">{t('edit')||'تعديل'}</button>
              </div>
              <div className="text-slate-500 text-sm mt-1">{client?.name||'—'} · {project.service_requested} · {t('proj_started')} {project.start_date}</div>
            </div>
          </div>
          <div className="flex gap-1 border-b border-slate-700/60">
            {TABS.map(ti=>(
              <button key={ti.id} onClick={()=>setTab(ti.id)}
                className={`px-5 py-2.5 text-sm font-medium transition-all border-b-2 -mb-px ${tab===ti.id?'text-blue-300 border-blue-500':'text-slate-500 border-transparent hover:text-slate-300'}`}>
                {t(ti.labelKey)}{ti.count!=null?` (${ti.count})`:''}
              </button>
            ))}
          </div>
          {/* OverView */}
          {tab==='overview'&&(
            <div className="grid grid-cols-2 gap-5">
              <div className="bg-slate-800/60 rounded-2xl p-5 border border-slate-700/40 space-y-4">
                <h3 className="font-semibold text-white text-sm">{t('proj_details_title')}</h3>
                {[{id:'name',label:t('proj_name_lbl'),value:project.name},{id:'client',label:t('proj_client_lbl'),value:client?.name},{id:'service',label:t('proj_service_lbl'),value:project.service_requested},{id:'start',label:t('proj_start_lbl'),value:project.start_date},{id:'delivery',label:t('proj_delivery_lbl'),value:dl?sl(dl,t):null}]
                  .map(({id,label,value})=>value?(
                    <div key={id}><div className="text-xs text-slate-500 mb-0.5">{label}</div><div className="text-sm text-slate-200">{value}</div></div>
                  ):null)}
              </div>
              <div className="bg-slate-800/60 rounded-2xl p-5 border border-slate-700/40">
                <h3 className="font-semibold text-white text-sm mb-4">{t('proj_financial_title')}</h3>
                <div className="space-y-3">
                  {[{id:'collected',label:t('proj_collected'),value:`$${totalPaid.toFixed(0)}`,grad:'from-emerald-600 to-emerald-800'},{id:'remaining',label:t('proj_remaining'),value:'—',grad:'from-rose-600 to-rose-800'}]
                    .map((s)=>(
                      <div key={s.id} className="flex items-center justify-between bg-slate-700/30 rounded-xl p-3">
                        <div className={`w-7 h-7 rounded-lg bg-gradient-to-br ${s.grad} flex items-center justify-center`}><Ic name="finance" size={12}/></div>
                        <span className="text-slate-400 text-sm flex-1 mr-3">{s.label}</span>
                        <span className="font-semibold text-white">{s.value}</span>
                      </div>
                    ))}
                </div>
              </div>
            </div>
          )}
          {/* Invoices */}
          {tab==='invoices'&&(
            <div className="space-y-4">
              <div className="flex justify-end">
                <button onClick={()=>{setEditInv(null);setForm(true);}}
                  className="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium transition-colors shadow-lg shadow-blue-500/20">
                  <Ic name="plus" size={14}/>{t('inv_new')}
                </button>
              </div>
              {projInvs.length===0?(
                <div className="bg-slate-800/60 rounded-2xl p-12 border border-slate-700/40 text-center">
                  <div className="text-4xl mb-3">🧾</div>
                  <div className="text-slate-400 font-medium">{t('proj_no_invoices')}</div>
                </div>
              ):(
                <div className="space-y-3">
                  {projInvs.map(inv=>{
                    const st=inv.items.reduce((s,i)=>s+i.qty*i.unit_price,0);
                    const ta=st*((inv.tax||0)/100);
                    const gt=st+ta;
                    const paid=inv.payments.filter(p=>p.status==='paid').reduce((s,p)=>s+gt*p.pct/100,0);
                    const allPaid=inv.payments.every(p=>p.status==='paid');
                    const anyPaid=inv.payments.some(p=>p.status==='paid');
                    const ps=PAYMENT_STATUSES.find(s=>s.id===(allPaid?'paid':anyPaid?'partial':'pending'));
                    return (
                      <div key={inv.id} className="bg-slate-800/60 rounded-2xl border border-slate-700/40 overflow-hidden">
                        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-700/40">
                          <div className="flex items-center gap-3">
                            <div className="w-9 h-9 rounded-xl bg-blue-500/15 flex items-center justify-center"><Ic name="note" size={15}/></div>
                            <div>
                              <div className="font-semibold text-white">{inv.inv_no}</div>
                              <div className="text-xs text-slate-500">{t('proj_inv_due')} {inv.due_date||'—'} · {t('proj_inv_progress')} {inv.progress}%</div>
                            </div>
                          </div>
                          <div className="flex items-center gap-3">
                            <span className={`text-xs px-2.5 py-1 rounded-full border ${ps?.badge}`}>{ps?sl(ps,t):''}</span>
                            <div className="text-left">
                              <div className="font-semibold text-white">${gt.toFixed(2)}</div>
                              {anyPaid&&<div className="text-xs text-emerald-400">{t('proj_inv_paid')} ${paid.toFixed(2)}</div>}
                            </div>
                            <div className="flex items-center gap-1">
                              <button onClick={()=>printInvoice(inv,project,client,'full')} title={t('inv_print_full')}
                                className="p-1.5 rounded-lg text-slate-500 hover:text-blue-400 hover:bg-blue-500/10 transition-all"><Ic name="print" size={14}/></button>
                              <button onClick={()=>{setEditInv(inv);setForm(true);}} title={t('inv_edit_inv')}
                                className="p-1.5 rounded-lg text-slate-500 hover:text-blue-400 hover:bg-blue-500/10 transition-all"><Ic name="edit2" size={14}/></button>
                              <button onClick={()=>{if(confirm(t('proj_del_inv_confirm')))onDeleteInvoice(inv.id);}}
                                className="p-1.5 rounded-lg text-slate-500 hover:text-red-400 hover:bg-red-500/10 transition-all"><Ic name="trash" size={14}/></button>
                            </div>
                          </div>
                        </div>
                        <div className="px-5 py-3">
                          <div className="text-xs text-slate-500 mb-2">{t('inv_breakdown')}</div>
                          <div className="flex gap-2 flex-wrap">
                            {inv.payments.map((pmt,idx)=>{
                              const amt=gt*pmt.pct/100;
                              return (
                                <div key={pmt.id} className={`flex items-center gap-2 px-3 py-2 rounded-xl border text-xs ${pmt.status==='paid'?'bg-emerald-500/10 border-emerald-500/30 text-emerald-300':'bg-slate-700/40 border-slate-600/40 text-slate-400'}`}>
                                  <span className="font-medium">{t('proj_payment_n').replace('{{n}}',idx+1)}</span>
                                  <span>{pmt.pct}%</span>
                                  <span className="font-semibold text-white">${amt.toFixed(2)}</span>
                                  {pmt.status==='paid'&&<span className="text-emerald-400 text-[10px]">✓</span>}
                                  <button onClick={()=>printInvoice(inv,project,client,'single',idx)} title={t('inv_print_payment').replace('{{n}}',idx+1)}
                                    className="mr-1 text-slate-500 hover:text-blue-400 transition-colors"><Ic name="print" size={11}/></button>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
          {/* Details */}
          {tab==='details'&&(
            <div className="bg-slate-800/60 rounded-2xl p-5 border border-slate-700/40 space-y-4">
              <h3 className="font-semibold text-white text-sm">{t('proj_more_details')}</h3>
              {[{id:'service',label:t('proj_service_req_lbl'),value:project.service_requested},{id:'start',label:t('proj_start_lbl'),value:project.start_date},{id:'delivery',label:t('proj_delivery_lbl'),value:dl?sl(dl,t):null}]
                .map(({id,label,value})=>(
                  <div key={id} className="flex gap-4 items-center border-b border-slate-700/30 pb-3">
                    <span className="text-slate-500 text-sm w-40 flex-shrink-0">{label}</span>
                    <span className="text-slate-200 text-sm">{value||'—'}</span>
                  </div>
                ))}
            </div>
          )}
          {invFormOpen&&(
            <InvoiceFormOverlay
              invoice={editInv}
              project={project}
              allInvoices={invoices}
              onSave={inv=>{onSaveInvoice(inv);setEditInv(null);setForm(false);showToast(editInv?t('proj_inv_updated'):t('proj_inv_created'));}}
              onClose={()=>{setEditInv(null);setForm(false);}}
            />
          )}
          {editOpen&&(
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl">
                <div className="flex items-center justify-between px-5 py-4 border-b border-slate-700">
                  <h3 className="font-semibold text-white">{t('edit')||'تعديل'} {t('proj_name_lbl')||'المشروع'}</h3>
                  <button onClick={()=>setEditOpen(false)} className="text-slate-500 hover:text-white"><Ic name="x"/></button>
                </div>
                <div className="p-5 space-y-4">
                  <div><label className="text-xs text-slate-400 block mb-1">{t('proj_name_lbl')} *</label>
                    <input value={ef.name||''} onChange={e=>setEf(p=>({...p,name:e.target.value}))} className={inputCls}/></div>
                  <div><label className="text-xs text-slate-400 block mb-1">{t('proj_client_lbl')}</label>
                    <select value={ef.clientId||''} onChange={e=>setEf(p=>({...p,clientId:Number(e.target.value)}))} className={inputCls}>
                      {(clients||[]).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                    </select></div>
                  <div><label className="text-xs text-slate-400 block mb-1">{t('proj_service_lbl')}</label>
                    <select value={ef.service_requested||''} onChange={e=>setEf(p=>({...p,service_requested:e.target.value}))} className={inputCls}>
                      {SERVICES.map(s=><option key={s}>{s}</option>)}
                    </select></div>
                  <div><label className="text-xs text-slate-400 block mb-1">{t('proj_start_lbl')}</label>
                    <input type="date" value={ef.start_date||''} onChange={e=>setEf(p=>({...p,start_date:e.target.value}))} className={inputCls}/></div>
                  <div><label className="text-xs text-slate-400 block mb-1">{t('proj_delivery_lbl')}</label>
                    <select value={ef.delivery||''} onChange={e=>setEf(p=>({...p,delivery:e.target.value}))} className={inputCls}>
                      {DELIVERY_STATUSES.map(s=><option key={s.id} value={s.id}>{sl(s,t)}</option>)}
                    </select></div>
                </div>
                <div className="flex gap-3 px-5 pb-5">
                  <button onClick={()=>{if(!ef.name?.trim())return;onSaveProject({...project,...ef});setEditOpen(false);showToast('تم الحفظ ✓');}} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-2.5 text-sm font-medium">{t('save')||'حفظ'}</button>
                  <button onClick={()=>setEditOpen(false)} className="px-5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl py-2.5 text-sm">{t('cancel')||'إلغاء'}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    /* ═══════════════════════════ NEW PROJECT MODAL ═══════════════════════════ */

    const NewProjectModal = ({ clients, onSave, onClose }) => {
      const { t } = useLang();
      const [f,setF]=useState({name:'',clientId:'',service_requested:'Social Media',delivery:'in_progress',start_date:new Date().toISOString().split('T')[0]});
      const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
      const inputCls="w-full bg-slate-700 border border-slate-600 focus:border-blue-500 rounded-lg px-3 py-2 text-sm text-white outline-none placeholder-slate-500";
      const save=()=>{
        if(!f.name.trim()||!f.clientId)return;
        onSave({...f,id:Date.now(),clientId:Number(f.clientId),price:0});
        onClose();
      };
      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl">
            <div className="flex items-center justify-between px-5 py-4 border-b border-slate-700">
              <h3 className="font-semibold text-white">{t('proj_new_title')}</h3>
              <button onClick={onClose} className="text-slate-500 hover:text-white"><Ic name="x"/></button>
            </div>
            <div className="p-5 grid grid-cols-2 gap-4">
              <div className="col-span-2"><label className="text-xs text-slate-400 block mb-1">{t('proj_name_lbl')} *</label>
                <input value={f.name} onChange={set('name')} placeholder="" className={inputCls}/></div>
              <div className="col-span-2"><label className="text-xs text-slate-400 block mb-1">{t('proj_client_lbl')} *</label>
                <select value={f.clientId} onChange={set('clientId')} className={inputCls}>
                  <option value="">{t('proj_select_client')}</option>
                  {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                </select></div>
              <div><label className="text-xs text-slate-400 block mb-1">{t('proj_service_lbl')}</label>
                <select value={f.service_requested} onChange={set('service_requested')} className={inputCls}>
                  {SERVICES.map(s=><option key={s}>{s}</option>)}
                </select></div>
              <div><label className="text-xs text-slate-400 block mb-1">{t('proj_start_lbl')}</label>
                <input type="date" value={f.start_date} onChange={set('start_date')} className={inputCls}/></div>
              <div><label className="text-xs text-slate-400 block mb-1">{t('proj_delivery_lbl')}</label>
                <select value={f.delivery} onChange={set('delivery')} className={inputCls}>
                  {DELIVERY_STATUSES.map(s=><option key={s.id} value={s.id}>{sl(s,t)}</option>)}
                </select></div>
            </div>
            <div className="flex gap-3 px-5 pb-5">
              <button onClick={save} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-2.5 text-sm font-medium transition-colors shadow-lg shadow-blue-500/20">{t('proj_create')}</button>
              <button onClick={onClose} className="px-5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl py-2.5 text-sm transition-colors">{t('cancel')}</button>
            </div>
          </div>
        </div>
      );

    /* ═══════════════════════════ PROJECTS MODULE ═══════════════════════════ */

    const ProjectsModule = ({ projects, clients, invoices, onAddProject, onSaveProject, onSaveInvoice, onDeleteInvoice, showToast }) => {
      const { t } = useLang();
      const [viewId,setViewId]=useState(null);
      const [newModal,setNewModal]=useState(false);
      const [search,setSearch]=useState('');
      const viewProject=viewId?projects.find(p=>p.id===viewId):null;
      const viewClient=viewProject?clients.find(c=>c.id===viewProject.clientId):null;
      const filtered=projects.filter(p=>{
        const q=search.toLowerCase();
        return !q||p.name.toLowerCase().includes(q)||(clients.find(c=>c.id===p.clientId)?.name||'').toLowerCase().includes(q);
      });
      if(viewProject) return (
        <ProjectDetailPage project={viewProject} client={viewClient} invoices={invoices} clients={clients}
          onBack={()=>setViewId(null)} onSaveInvoice={onSaveInvoice} onDeleteInvoice={onDeleteInvoice} onSaveProject={onSaveProject} showToast={showToast}/>
      );
      return (
        <div className="space-y-5">
          <div className="flex items-start justify-between">
            <div><h1 className="text-2xl font-bold text-white">{t('prj_title')}</h1>
              <p className="text-slate-500 text-sm mt-1">{projects.length} {t('crm_total')}</p></div>
            <button onClick={()=>setNewModal(true)}
              className="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium transition-colors shadow-lg shadow-blue-500/20">
              <Ic name="plus" size={14}/>{t('prj_new')}
            </button>
          </div>
          <div className="relative">
            <span className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none"><Ic name="search" size={13}/></span>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={t('prj_search')}
              className="bg-slate-800 border border-slate-700 focus:border-blue-500 rounded-lg pr-9 pl-3 py-2 text-sm text-white placeholder-slate-500 outline-none w-64"/>
          </div>
          <div className="bg-slate-800/60 rounded-2xl border border-slate-700/40 overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="border-b border-slate-700/60 text-right">
                  <th className="px-4 py-3 text-xs font-medium text-slate-500 min-w-[200px]">{t('prj_col_name')}</th>
                  <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('prj_col_client')}</th>
                  <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('prj_col_service')}</th>
                  <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('prj_col_delivery')}</th>
                  <th className="px-4 py-3 text-xs font-medium text-slate-500">{t('prj_invoices')}</th>
                  <th className="px-3 py-3 w-16"></th>
                </tr></thead>
                <tbody>
                  {filtered.length===0&&<tr><td colSpan={6} className="text-center py-16 text-slate-600">{projects.length===0?t('prj_empty'):t('no_data')}</td></tr>}
                  {filtered.map(proj=>{
                    const cl=clients.find(c=>c.id===proj.clientId);
                    const dl=DELIVERY_STATUSES.find(s=>s.id===proj.delivery);
                    const invCount=invoices.filter(i=>i.projectId===proj.id).length;
                    return (
                      <tr key={proj.id} className="border-b border-slate-700/30 hover:bg-white/[0.02] transition-colors">
                        <td className="px-4 py-3">
                          <div className="flex items-center gap-2.5">
                            <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500/25 to-blue-500/25 flex items-center justify-center text-blue-300 flex-shrink-0"><Ic name="projects" size={14}/></div>
                            <div><div className="text-slate-200 font-medium">{proj.name}</div><div className="text-xs text-slate-600">{proj.start_date}</div></div>
                          </div>
                        </td>
                        <td className="px-4 py-3 text-slate-300">{cl?.name||<span className="text-slate-600">—</span>}</td>
                        <td className="px-4 py-3 text-slate-400 text-xs">{proj.service_requested}</td>
                        <td className="px-4 py-3">{dl&&<span className={`text-xs px-2.5 py-1 rounded-full border flex items-center gap-1.5 w-fit ${dl.badge}`}><span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${dl.dot}`}/>{sl(dl, t)}</span>}</td>
                        <td className="px-4 py-3"><span className="text-xs bg-slate-700/60 text-slate-400 px-2 py-0.5 rounded-full">{invCount} {t('prj_invoice_count')}</span></td>
                        <td className="px-3 py-3">
                          <button onClick={()=>setViewId(proj.id)} className="p-1.5 rounded-lg text-slate-600 hover:text-blue-400 hover:bg-blue-500/10 transition-all" title={t('crm_view')}><Ic name="eye" size={13}/></button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
          {newModal&&<NewProjectModal clients={clients} onSave={p=>{onAddProject(p);showToast(`${p.name} ✓`);setNewModal(false);}} onClose={()=>setNewModal(false)}/>}
        </div>
      );
    };

    /* ═══════════════════════════ TEAM MODULE ═══════════════════════════ */

    const RoleForm = ({ role, customRoles, teamMembers, onSave, onClose }) => {
      const { t } = useLang();
      const isEdit = !!role;
      const nextRank = customRoles.length > 0
        ? Math.max(...customRoles.map(r=>r.rank)) + 10
        : 50;
      const defaultActions = Object.fromEntries(TEAM_ACTIONS.map(a=>[a.id, false]));
      const [f,setF] = useState(role ? {
        ...role,
        permissions: { ...role.permissions, actions: { ...defaultActions, ...(role.permissions?.actions||{}) } }
      } : {
        id:'cr_'+Date.now(), name:'', rank:nextRank, colorKey:'purple',
        permissions: { ...Object.fromEntries(DEPT_KEYS.map(k=>[k,{access:false}])), actions: { ...defaultActions } },
      });
      const inputCls="w-full bg-slate-700 border border-slate-600 focus:border-blue-500 rounded-lg px-3 py-2 text-sm text-white outline-none placeholder-slate-500";
      const togglePerm=k=>setF(p=>({...p,permissions:{...p.permissions,[k]:{access:!p.permissions[k]?.access}}}));
      const toggleAction=a=>setF(p=>({...p,permissions:{...p.permissions,actions:{...(p.permissions.actions||{}), [a]:!(p.permissions.actions?.[a])}}}));
      const usedByCount = teamMembers.filter(m=>m.role===f.id).length;
      const save=()=>{
        if(!f.name.trim())return;
        onSave(f);
        onClose();
      };
      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl max-h-[92vh] overflow-y-auto">
            <div className="flex items-center justify-between px-5 py-4 border-b border-slate-700 sticky top-0 bg-slate-800 z-10">
              <h3 className="font-semibold text-white">{isEdit ? t('tm_edit_role_title') : t('tm_new_role')}</h3>
              <button onClick={onClose} className="text-slate-500 hover:text-white"><Ic name="x"/></button>
            </div>
            <div className="p-5 space-y-5">
              <div>
                <label className="text-xs text-slate-400 block mb-1">{t('tm_role_name_lbl')}</label>
                <input value={f.name} onChange={e=>setF(p=>({...p,name:e.target.value}))} placeholder={t('tm_role_name_ph')} className={inputCls}/>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-xs text-slate-400 block mb-1">{t('tm_role_rank_lbl')}</label>
                  <input type="number" min="2" max="89" value={f.rank} onChange={e=>setF(p=>({...p,rank:Number(e.target.value)}))} className={inputCls}/>
                  <div className="text-[10px] text-slate-600 mt-1">{t('tm_role_rank_hint')}</div>
                </div>
                <div>
                  <label className="text-xs text-slate-400 block mb-2">{t('tm_role_color_lbl')}</label>
                  <div className="flex flex-wrap gap-2">
                    {ROLE_COLOR_PALETTE.map(pal=>(
                      <button key={pal.key} onClick={()=>setF(p=>({...p,colorKey:pal.key}))}
                        title={pal.key}
                        className={`w-6 h-6 rounded-full ${pal.dot} flex-shrink-0 transition-all ${f.colorKey===pal.key?'ring-2 ring-white ring-offset-1 ring-offset-slate-800 scale-110':''}`}/>
                    ))}
                  </div>
                </div>
              </div>
              <div>
                <div className="text-xs text-slate-400 mb-2 font-medium flex items-center gap-2">
                  <Ic name="eye" size={11}/> {t('tm_role_depts_lbl')}
                </div>
                <div className="grid grid-cols-3 gap-2">
                  {DEPT_KEYS.map(k=>(
                    <button key={k} onClick={()=>togglePerm(k)}
                      className={`flex items-center gap-2 px-3 py-2 rounded-xl border text-xs transition-all
                        ${f.permissions[k]?.access?'bg-blue-500/15 text-blue-300 border-blue-500/40':'bg-slate-700/30 text-slate-500 border-slate-600/40 hover:border-slate-500'}`}>
                      <div className={`w-3.5 h-3.5 rounded border flex items-center justify-center flex-shrink-0 ${f.permissions[k]?.access?'bg-blue-500 border-blue-500':'border-slate-500'}`}>
                        {f.permissions[k]?.access&&<Ic name="check" size={9}/>}
                      </div>
                      {DEPT_LABELS[k]}
                    </button>
                  ))}
                </div>
              </div>
              {/* ── Action Permissions ── */}
              <div>
                <div className="text-xs text-slate-400 mb-2 font-medium flex items-center gap-2">
                  <Ic name="shield2" size={11}/> {t('tm_action_perms')}
                </div>
                <div className="grid grid-cols-2 gap-2">
                  {TEAM_ACTIONS.map(a => {
                    const active = f.permissions?.actions?.[a.id];
                    return (
                      <button key={a.id} onClick={() => toggleAction(a.id)}
                        className={`flex items-center gap-2 px-3 py-2 rounded-xl border text-xs transition-all
                          ${active ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/40' : 'bg-slate-700/30 text-slate-500 border-slate-600/40 hover:border-slate-500'}`}>
                        <div className={`w-3.5 h-3.5 rounded border flex items-center justify-center flex-shrink-0 ${active ? 'bg-emerald-500 border-emerald-500' : 'border-slate-500'}`}>
                          {active && <Ic name="check" size={9}/>}
                        </div>
                        <Ic name={a.icon} size={11}/>
                        {t(a.labelKey)}
                      </button>
                    );
                  })}
                </div>
              </div>

              {isEdit&&usedByCount>0&&(
                <div className="flex items-center gap-2 text-xs text-amber-400 bg-amber-500/10 border border-amber-500/20 rounded-xl px-3 py-2">
                  <Ic name="users" size={11}/> {t('tm_role_in_use')} {usedByCount} {t('tm_role_in_use2')}
                </div>
              )}
            </div>
            <div className="flex gap-3 px-5 pb-5 sticky bottom-0 bg-slate-800 pt-3 border-t border-slate-700">
              <button onClick={save} disabled={!f.name.trim()}
                className="flex-1 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-xl py-2.5 text-sm font-medium transition-colors">
                {isEdit ? t('tm_save_changes') : t('tm_add_role')}
              </button>
              <button onClick={onClose} className="px-5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl py-2.5 text-sm transition-colors">{t('cancel')}</button>
            </div>
          </div>
        </div>
      );
    };

    /* ═══════════════════════════ ATTENDANCE ADMIN VIEW ═══════════════════════════ */

    const AttendanceAdminView = ({ teamMembers, attendanceRecords, offDays, deductions, bonuses, onAddDeduction, onAddOffDay, onAddBonus, showToast, currentUser, customRoles }) => {
      const { t, lang } = useLang();
      const [viewHistory,    setViewHistory]    = useState(null);
      const [deductionForm,  setDeductionForm]  = useState(null);
      const [bonusForm,      setBonusForm]      = useState(null);
      const [offDayForm,     setOffDayForm]     = useState(null);
      const [monthOffset,    setMonthOffset]    = useState(0);

      const canAdmin        = ['super_admin','admin'].includes(currentUser?.role);
      const canDeductions   = canDoAction(currentUser, customRoles, 'add_deductions');
      const canBonuses      = canDoAction(currentUser, customRoles, 'add_bonuses');
      const canOffDays      = canDoAction(currentUser, customRoles, 'manage_off_days');
      const canAttendance   = canDoAction(currentUser, customRoles, 'manage_attendance');

      const getMonthKey = () => {
        const d = new Date(); d.setMonth(d.getMonth() + monthOffset);
        const pad = n => String(n).padStart(2,'0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
      };
      const monthKey = getMonthKey();

      const getStats = (userId) => {
        const recs  = attendanceRecords.filter(r => r.userId === userId && r.date.startsWith(monthKey));
        const offs  = offDays.filter(d => d.userId === userId && d.date.startsWith(monthKey));
        const deds  = deductions.filter(d => d.userId === userId && d.date.startsWith(monthKey));
        const bons  = (bonuses||[]).filter(b => b.userId === userId && b.date.startsWith(monthKey));
        const totalMins = recs.reduce((sum, r) => sum + calcWorkMinutes(r), 0);
        return {
          recs, offs, deds, bons, totalMins,
          days: recs.filter(r=>r.clockIn).length,
          totalDed: deds.reduce((s,d)=>s+Number(d.amount),0),
          totalBonus: bons.reduce((s,b)=>s+Number(b.amount),0),
        };
      };

      const getTodayRec = (userId) => attendanceRecords.find(r => r.userId === userId && r.date === todayStr());

      const offTypeLabel = { absent:t('att_off_absent'), vacation:t('att_off_vacation'), sick:t('att_off_sick') };

      return (
        <div className="space-y-5">
          {/* Month navigator */}
          <div className="flex items-center gap-3">
            <button onClick={() => setMonthOffset(o => o-1)}
              className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
              <Ic name="chevron_up" size={14}/>
            </button>
            <span className="text-sm text-white font-medium min-w-[110px] text-center">
              {new Date(monthKey+'-01').toLocaleDateString(lang==='ar'?'ar-SA':'en-US',{year:'numeric',month:'long'})}
            </span>
            <button onClick={() => setMonthOffset(o => Math.min(0, o+1))}
              className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
              <Ic name="chevron_down" size={14}/>
            </button>
          </div>

          {/* Employee cards */}
          <div className="space-y-3">
            {teamMembers.map(m => {
              const stats   = getStats(m.id);
              const today   = getTodayRec(m.id);
              const onBreak = isOnBreak(today);
              const ri      = getRoleInfo(m.role, []);
              const expanded = viewHistory === m.id;
              const isMe     = currentUser.id === m.id;

              return (
                <div key={m.id} className="bg-slate-800/60 border border-slate-700/50 rounded-2xl overflow-hidden transition-all hover:border-slate-600/70">
                  {/* Card header */}
                  <div className="flex items-center gap-4 p-4">
                    {/* Avatar */}
                    <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${ri.grad} flex items-center justify-center text-base font-bold text-white flex-shrink-0`}>
                      {m.name.charAt(0)}
                    </div>
                    {/* Name */}
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-sm font-medium text-white">{m.name}</span>
                        {isMe && <span className="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full border border-blue-500/30">{t('att_you')}</span>}
                        {today && !today.clockOut ? (
                          <span className={`text-[10px] px-2 py-0.5 rounded-full border ${
                            onBreak ? 'bg-amber-500/10 text-amber-300 border-amber-500/20' : 'bg-emerald-500/10 text-emerald-300 border-emerald-500/20'
                          }`}>{onBreak ? t('att_on_break') : t('att_clocked_in')}</span>
                        ) : (
                          <span className="text-[10px] px-2 py-0.5 rounded-full border bg-slate-700/50 text-slate-500 border-slate-600/30">{t('att_clocked_out')}</span>
                        )}
                      </div>
                      <div className="text-[11px] text-slate-500 mt-0.5">{ri.label}</div>
                    </div>
                    {/* Stats row */}
                    <div className="flex items-center gap-5 text-center flex-shrink-0">
                      <div>
                        <div className="text-sm font-bold text-white font-mono">{fmtDuration(stats.totalMins,lang)}</div>
                        <div className="text-[10px] text-slate-500 mt-0.5">{t('att_hours')}</div>
                      </div>
                      <div>
                        <div className="text-sm font-bold text-white">{stats.days}</div>
                        <div className="text-[10px] text-slate-500 mt-0.5">{t('att_days_stat')}</div>
                      </div>
                      <div>
                        <div className="text-sm font-bold text-amber-400">{stats.offs.length}</div>
                        <div className="text-[10px] text-slate-500 mt-0.5">{t('att_absent_stat')}</div>
                      </div>
                      <div>
                        <div className={`text-sm font-bold ${stats.totalDed > 0 ? 'text-rose-400' : 'text-slate-500'}`}>
                          {stats.totalDed > 0 ? `$${stats.totalDed}` : '—'}
                        </div>
                        <div className="text-[10px] text-slate-500 mt-0.5">{t('att_deductions')}</div>
                      </div>
                      <div>
                        <div className={`text-sm font-bold ${stats.totalBonus > 0 ? 'text-emerald-400' : 'text-slate-500'}`}>
                          {stats.totalBonus > 0 ? `+$${stats.totalBonus}` : '—'}
                        </div>
                        <div className="text-[10px] text-slate-500 mt-0.5">{t('att_bonuses')}</div>
                      </div>
                    </div>
                    {/* Actions */}
                    <div className="flex items-center gap-1.5 flex-shrink-0">
                      {canDeductions && (
                        <button onClick={() => setDeductionForm({ userId:m.id, amount:'', reason:'', date:todayStr() })}
                          title={t('att_add_deduction')}
                          className="p-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs border border-rose-500/15 transition-all">
                          <Ic name="minus" size={13}/>
                        </button>
                      )}
                      {canBonuses && (
                        <button onClick={() => setBonusForm({ userId:m.id, amount:'', reason:'', date:todayStr() })}
                          title={t('att_add_bonus')}
                          className="p-1.5 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 text-xs border border-emerald-500/15 transition-all">
                          <Ic name="plus" size={13}/>
                        </button>
                      )}
                      {canOffDays && (
                        <button onClick={() => setOffDayForm({ userId:m.id, date:todayStr(), type:'absent', notes:'' })}
                          title={t('att_log_offday')}
                          className="p-1.5 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 text-xs border border-amber-500/15 transition-all">
                          <Ic name="calendar" size={13}/>
                        </button>
                      )}
                      <button onClick={() => setViewHistory(expanded ? null : m.id)}
                        title={t('att_history')}
                        className={`p-1.5 rounded-lg text-xs border transition-all ${
                          expanded ? 'bg-blue-500/20 text-blue-300 border-blue-500/30' : 'bg-slate-700/40 hover:bg-slate-700/70 text-slate-400 border-slate-600/30'
                        }`}>
                        <Ic name="clock2" size={13}/>
                      </button>
                    </div>
                  </div>

                  {/* Expanded history */}
                  {expanded && (
                    <div className="border-t border-slate-700/50 px-4 pb-4 pt-3 space-y-3">

                      {/* Attendance log */}
                      <div>
                        <div className="text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-2">{t('att_log_title')}</div>
                        {stats.recs.length === 0 ? (
                          <div className="text-xs text-slate-600 text-center py-3">{t('att_no_log')}</div>
                        ) : (
                          <div className="space-y-1.5">
                            {stats.recs.slice().sort((a,b) => b.date.localeCompare(a.date)).map(r => (
                              <div key={r.id} className="flex items-center gap-3 px-3 py-2 rounded-xl bg-slate-800/50 text-xs">
                                <span className="text-slate-400 w-24 flex-shrink-0">{r.date}</span>
                                <span className="text-emerald-400 flex-shrink-0">
                                  {t('att_in')} {r.clockIn ? new Date(r.clockIn).toLocaleTimeString(lang==='ar'?'ar-SA':'en-US',{hour:'2-digit',minute:'2-digit'}) : '—'}
                                </span>
                                <span className="text-rose-400 flex-shrink-0">
                                  {t('att_out')} {r.clockOut ? new Date(r.clockOut).toLocaleTimeString(lang==='ar'?'ar-SA':'en-US',{hour:'2-digit',minute:'2-digit'}) : '—'}
                                </span>
                                <span className="text-white font-mono mr-auto flex-shrink-0">{fmtDuration(calcWorkMinutes(r),lang)}</span>
                                {(r.pauses||[]).filter(p=>p.end).length > 0 && (
                                  <span className="text-amber-500 flex-shrink-0 flex items-center gap-1">
                                    <Ic name="coffee" size={10}/> {(r.pauses||[]).filter(p=>p.end).length}
                                  </span>
                                )}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* Off days */}
                      {stats.offs.length > 0 && (
                        <div>
                          <div className="text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-2">{t('att_offdays_title')}</div>
                          <div className="space-y-1.5">
                            {stats.offs.map(d => (
                              <div key={d.id} className="flex items-center gap-3 px-3 py-2 rounded-xl bg-amber-500/5 border border-amber-500/10 text-xs">
                                <span className="text-slate-400 w-24 flex-shrink-0">{d.date}</span>
                                <span className="text-amber-300 flex-shrink-0">{offTypeLabel[d.type]||d.type}</span>
                                {d.notes && <span className="text-slate-400 flex-1 truncate">{d.notes}</span>}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* Deductions */}
                      {stats.deds.length > 0 && (
                        <div>
                          <div className="text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-2">{t('att_deductions_title')}</div>
                          <div className="space-y-1.5">
                            {stats.deds.map(d => (

    /* ═══════════════════════════ FINANCE MODULE ═══════════════════════════ */

    const RECURRENCE_LABELS = {
      one_time:'fin_rec_one_time', every_x_days:'fin_rec_every_x',
      weekly:'fin_rec_weekly', monthly:'fin_rec_monthly', quarterly:'fin_rec_quarterly',
    };

    /* generate all occurrences of a recurring expense up to today */
    const generateOccurrences = (exp) => {
      if (exp.recurrence === 'one_time') return [{ ...exp, gen_date: exp.date || exp.start_date }];
      const results = [];
      const today   = new Date(); today.setHours(23,59,59);
      let current   = new Date(exp.start_date);
      let safety    = 0;
      while (current <= today && safety < 600) {
        safety++;
        if (!exp.paused || results.length === 0) results.push({ ...exp, gen_date: current.toISOString().split('T')[0] });
        // If paused we still want to show past occurrences up to today but not future
        switch (exp.recurrence) {
          case 'every_x_days': current.setDate(current.getDate() + Math.max(1, exp.recurrence_x||7)); break;
          case 'weekly':       current.setDate(current.getDate() + 7); break;
          case 'monthly':      current.setMonth(current.getMonth() + 1); break;
          case 'quarterly':    current.setMonth(current.getMonth() + 3); break;
          default: current = new Date(9999, 0); break;
        }
      }
      return results;
    };

    const getPrevMonth = (m) => {
      const [y, mo] = m.split('-').map(Number);
      return new Date(y, mo - 2, 1).toISOString().slice(0, 7);

      const recurring = isRec(f.recurrence);
      const save = () => {
        if (!f.desc.trim() || !f.amount) return;
        onSave({ ...f, id: expense?.id||Date.now(), amount: Number(f.amount) });
        onClose();
      };
      return (

              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-slate-400 block mb-1">{t('fin_amount_lbl')} *</label>
                  <input type="number" min="0" step="0.01" value={f.amount} onChange={e=>setF(p=>({...p,amount:e.target.value}))} placeholder="0" className={inputCls}/>
                </div>
                <div>
                  <label className="text-xs text-slate-400 block mb-1">{t('fin_recurrence')}</label>
                  <select value={f.recurrence} onChange={e=>setF(p=>({...p,recurrence:e.target.value}))} className={inputCls}>
                    <option value="one_time">{t('fin_rec_one_time')}</option>
                    <option value="every_x_days">{t('fin_rec_every_x')}</option>
                    <option value="weekly">{t('fin_rec_weekly')}</option>
                    <option value="monthly">{t('fin_rec_monthly')}</option>
                    <option value="quarterly">{t('fin_rec_quarterly')}</option>
                  </select>
                </div>
              </div>
              {f.recurrence==='every_x_days' && (
                <div>
                  <label className="text-xs text-slate-400 block mb-1">{t('fin_every_x_ph')}</label>
                  <input type="number" min="1" value={f.recurrence_x} onChange={e=>setF(p=>({...p,recurrence_x:Number(e.target.value)}))} className={inputCls}/>
                </div>
              )}
              <div>
                <label className="text-xs text-slate-400 block mb-1">{recurring ? t('tsk_start_date') : t('fin_date_lbl')} *</label>

                  onChange={e=>setF(p=>recurring?{...p,start_date:e.target.value}:{...p,date:e.target.value})} className={inputCls}/>
              </div>
            </div>
            <div className="flex gap-3 px-5 pb-5">

      const { t } = useLang();
      const isEdit      = !!salary;
      const activeMembers = teamMembers.filter(m => m.status==='active');

        employee_id:'', employee_name:'', role:'', amount:'',
        recurring:true, start_date: new Date().toISOString().split('T')[0], month:'',

      const inputCls = "w-full bg-slate-700 border border-slate-600 focus:border-blue-500 rounded-lg px-3 py-2 text-sm text-white outline-none placeholder-slate-500";
      const pickEmployee = id => {

        setF(p => ({ ...p, employee_id:m.id, employee_name:m.name, role:rl?.label||m.role, amount: m.salary||'' }));

      const save = () => {
        if (!f.employee_name || !f.amount) return;

      };
      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl">
